<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is essential for iPhone notched screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Global Web Dialer Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { 
            --bg: #000; --card: #1c1c1e; --primary: #34c759; --danger: #ff3b30; 
            --blue: #007aff; --text: #fff; --gray: #2c2c2e; 
        }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Prevent elastic scrolling/bounce on iOS */
        html, body { 
            background-color: var(--bg); color: var(--text); margin: 0; padding: 0;
            height: 100%; overflow: hidden; position: fixed; width: 100%;
        }

        /* Top Bar */
        .top-info { 
            width: 100%; max-width: 420px; background: #111; 
            padding: 10px; text-align: center; border-bottom: 1px solid #333; 
            padding-top: env(safe-area-inset-top); /* Fix for iPhone Notch */
        }
        #status-bar { font-size: 10px; color: #ffc107; text-transform: uppercase; font-weight: bold; }

        /* The Phone Shell - Using dvh (Dynamic Viewport Height) */
        .phone-shell { 
            width: 100%; max-width: 420px; 
            height: 100dvh; /* Uses actual visible height including Safari bar */
            background: var(--bg); position: relative; display: flex; 
            flex-direction: column; overflow: hidden;
            margin: 0 auto;
        }

        .view { display: none; flex-direction: column; height: 100%; padding: 20px; }
        .view.active { display: flex; }

        /* Dialer Screen */
        #my-num-display { font-size: 38px; color: var(--primary); margin: 5px 0; font-weight: bold; text-align: center; }
        #dial-display { font-size: 48px; height: 50px; text-align: center; margin: 10px 0; font-weight: 300; color: #fff; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; justify-items: center; align-content: center; flex-grow: 1; }
        .key { width: 70px; height: 70px; background: var(--gray); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .key:active { background: #444; transform: scale(0.92); }
        .key b { font-size: 26px; }
        .key.call-btn { background: var(--primary); grid-column: 2; color: white; }

        /* Video / Call Screen */
        .video-view { flex-grow: 1; position: relative; background: #111; border-radius: 25px; overflow: hidden; margin-top: 10px; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 10px; right: 10px; width: 85px; height: 125px; border-radius: 12px; border: 1px solid #444; object-fit: cover; z-index: 10; background: #222; }

        /* Controls - This is where Safari's bar usually hides things */
        .call-controls { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; 
            padding: 20px 10px; 
            padding-bottom: calc(20px + env(safe-area-inset-bottom)); /* Pushes buttons above Safari bar */
        }
        .btn-ctl { border: none; border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; color: white; background: var(--gray); }
        .btn-ctl.active { background: white; color: black; }
        .btn-ctl.hangup { background: var(--danger); }

        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="top-info">
        <div id="status-bar">System Initializing...</div>
        <div style="font-size: 11px; color: var(--blue); cursor:pointer; margin-top:5px;" onclick="copyInvite()">Copy Invite Link</div>
    </div>

    <div class="phone-shell">
        <!-- DIALER -->
        <div id="view-dialer" class="view active">
            <div style="text-align: center; color: #888; font-size: 11px;">YOUR NUMBER</div>
            <h1 id="my-num-display">....</h1>
            <div id="dial-display"></div>
            <div class="keypad" id="kpad"></div>
            <!-- Padding for dialer footer in Safari -->
            <div style="height: env(safe-area-inset-bottom); min-height: 20px;"></div>
        </div>

        <!-- CALL VIEW -->
        <div id="view-call" class="view">
            <div class="video-view">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="call-controls">
                <button class="btn-ctl active" id="toggle-mic">🎤</button>
                <button class="btn-ctl active" id="toggle-cam">📷</button>
                <button class="btn-ctl" style="background:var(--blue)" id="toggle-screen">📺</button>
                <button class="btn-ctl" id="toggle-data" style="font-size: 9px; font-weight: bold;">LOW<br>DATA</button>
                <button class="btn-ctl hangup" id="btn-hangup">📵</button>
            </div>
        </div>

        <!-- INCOMING -->
        <div id="incoming-overlay" class="overlay">
            <h2 id="caller-name">Incoming Call...</h2>
            <div style="display:flex; gap: 40px; margin-top: 30px;">
                <button class="btn-ctl hangup" onclick="location.reload()">✕</button>
                <button class="btn-ctl active" style="background:var(--primary); width:75px; height:75px;" onclick="answerCall()">✔</button>
            </div>
        </div>
    </div>

    <script>
        const status = document.getElementById('status-bar');
        const dialDisplay = document.getElementById('dial-display');
        let dialString = "", lowDataMode = false, localStream, currentCall, dataConn;

        // 1. PeerJS + Your Metered.ca Credentials
        const myNum = localStorage.getItem('web_dial_pro_v7') || (Math.floor(Math.random() * 1000) + 1).toString().padStart(4, '0');
        localStorage.setItem('web_dial_pro_v7', myNum);
        document.getElementById('my-num-display').innerText = myNum;

        const peer = new Peer('MB-' + myNum, {
            config: {
                iceServers: [
                    { urls: "stun:stun.relay.metered.ca:80" },
                    { urls: "turn:global.relay.metered.ca:80", username: "c198465a34d3f8e5ae248d9e", credential: "5BRzxWFSps2G0yOR" },
                    { urls: "turn:global.relay.metered.ca:443", username: "c198465a34d3f8e5ae248d9e", credential: "5BRzxWFSps2G0yOR" }
                ]
            }
        });

        peer.on('open', () => { status.innerText = "Online - Ready"; status.style.color = "var(--primary)"; });
        peer.on('connection', conn => { dataConn = conn; conn.on('data', d => { if(d === 'HANGUP') location.reload(); }); });
        peer.on('call', call => { currentCall = call; document.getElementById('caller-name').innerText = "Call from " + call.peer.replace('MB-', ''); document.getElementById('incoming-overlay').style.display = 'flex'; });

        // 2. Keypad Setup
        const kpad = document.getElementById('kpad');
        ['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(k => {
            const el = document.createElement('div'); el.className = 'key'; el.innerHTML = `<b>${k}</b>`;
            el.onclick = () => { if(dialString.length < 4) { dialString += k; dialDisplay.innerText = dialString; } };
            kpad.appendChild(el);
        });
        const callBtn = document.createElement('div'); callBtn.className = 'key call-btn'; callBtn.innerHTML = `<b>📞</b>`;
        callBtn.onclick = startCall; kpad.appendChild(callBtn);

        // 3. Call Handling
        async function startCall() {
            if (!dialString) return; switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            const target = 'MB-' + dialString.padStart(4, '0');
            dataConn = peer.connect(target);
            bindEvents(peer.call(target, localStream));
        }

        async function answerCall() {
            document.getElementById('incoming-overlay').style.display = 'none'; switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            currentCall.answer(localStream);
            dataConn = peer.connect(currentCall.peer);
            bindEvents(currentCall);
        }

        function bindEvents(call) {
            currentCall = call;
            call.on('stream', rem => { document.getElementById('remote-video').srcObject = rem; });
            call.peerConnection.oniceconnectionstatechange = () => { status.innerText = "Network: " + call.peerConnection.iceConnectionState; };
            call.on('close', () => location.reload());
        }

        // 4. iOS-Safe Screen Share
        document.getElementById('toggle-screen').onclick = async () => {
            if (!navigator.mediaDevices.getDisplayMedia) {
                return alert("iOS Note: Screen sharing ONLY works in Safari. Please open this link in the Safari app.");
            }
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                const screenTrack = screenStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) {
                    sender.replaceTrack(screenTrack);
                    document.getElementById('local-video').srcObject = screenStream;
                    screenTrack.onended = () => {
                        sender.replaceTrack(localStream.getVideoTracks()[0]);
                        document.getElementById('local-video').srcObject = localStream;
                    };
                }
            } catch (e) { alert("iOS: Ensure you are in Safari and Screen Recording is allowed in Settings."); }
        };

        // 5. Controls
        document.getElementById('toggle-mic').onclick = e => { localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled; e.currentTarget.classList.toggle('active'); };
        document.getElementById('toggle-cam').onclick = e => { localStream.getVideoTracks()[0].enabled = !localStream.getVideoTracks()[0].enabled; e.currentTarget.classList.toggle('active'); };
        document.getElementById('toggle-data').onclick = async e => {
            lowDataMode = !lowDataMode; e.currentTarget.classList.toggle('active');
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            if (sender) {
                const params = sender.getParameters(); if (!params.encodings) params.encodings = [{}];
                params.encodings[0].maxBitrate = lowDataMode ? 50000 : 1500000;
                await sender.setParameters(params);
            }
        };
        document.getElementById('btn-hangup').onclick = () => { if(dataConn) dataConn.send('HANGUP'); setTimeout(() => location.reload(), 300); };

        function switchView(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function copyInvite() { navigator.clipboard.writeText(`Call me: ${window.location.href} (Number: ${myNum})`); alert("Invite Link Copied!"); }
    </script>
</body>
</html>
