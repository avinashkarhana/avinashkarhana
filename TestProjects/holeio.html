<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hole.io - Advanced Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Segoe UI', sans-serif; }
        
        /* UI Elements */
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); pointer-events: none;
        }
        #score-val { font-size: 32px; font-weight: bold; }

        /* Settings Menu */
        #settings-btn {
            position: absolute; top: 20px; right: 20px;
            padding: 10px 20px; background: rgba(0,0,0,0.6);
            color: white; border: 1px solid white; border-radius: 5px;
            cursor: pointer; z-index: 100;
        }
        #settings-menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); color: white; padding: 30px;
            border-radius: 15px; display: none; flex-direction: column; gap: 15px;
            min-width: 250px; z-index: 101;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; }
        input[type=range] { cursor: pointer; }
        
        #instructions {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: white; font-size: 14px; opacity: 0.8; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">
    <div>SIZE</div>
    <div id="score-val">2.0m</div>
</div>

<button id="settings-btn">Settings</button>

<div id="settings-menu">
    <h2 style="margin-top:0">Settings</h2>
    <div class="setting-row">
        <label>Sensitivity</label>
        <input type="range" id="sens-slider" min="1" max="100" value="15">
    </div>
    <div class="setting-row">
        <label>Camera Smoothness</label>
        <input type="range" id="cam-slider" min="1" max="100" value="10">
    </div>
    <button id="close-settings" style="margin-top:10px; padding: 8px; cursor: pointer;">Close & Resume</button>
</div>

<div id="instructions">Drag to move • Eat smaller objects to grow</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- Config & State ---
    const config = {
        sensitivity: 0.015,
        camSmooth: 0.1,
        holeRadius: 2.0,
        score: 2.0
    };

    let isPaused = false;
    const items = [];
    const mouse = new THREE.Vector2();
    const targetHolePos = new THREE.Vector3();

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.localClippingEnabled = true; // Required for the "falling into floor" effect
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(50, 100, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // --- The Ground (With visual hole) ---
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // The "Pit" (A black cylinder that follows the hole)
    const pitGeo = new THREE.CylinderGeometry(1, 1, 10, 32);
    const pitMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const pit = new THREE.Mesh(pitGeo, pitMat);
    pit.position.y = -5.01; // Just below surface
    scene.add(pit);

    // Visual Ring around the hole
    const ringGeo = new THREE.RingGeometry(0.95, 1, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.02;
    scene.add(ring);

    // --- Object Creation ---
    function createBox(x, z, w, h, d, type) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshStandardMaterial({ 
            color: Math.random() * 0xffffff,
            clippingPlanes: [] // We will dynamically add planes here
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, h/2, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        
        mesh.userData = {
            type,
            size: Math.max(w, d),
            height: h,
            isFalling: false,
            velY: 0,
            rotVel: new THREE.Vector3(Math.random()*0.1, Math.random()*0.1, Math.random()*0.1)
        };
        
        scene.add(mesh);
        items.push(mesh);
    }

    // Build a segmented city
    for(let i=0; i<60; i++) {
        const x = (Math.random()-0.5) * 150;
        const z = (Math.random()-0.5) * 150;
        
        if (Math.random() > 0.4) {
            // Segmented Building
            const floors = 3 + Math.floor(Math.random() * 5);
            const w = 2 + Math.random();
            for(let f=0; f<floors; f++) {
                createBox(x, f*1.1 + 0.5, z, 1, 2, 2, 'building');
            }
        } else {
            // Cars/Props
            createBox(x, 0.4, z, 1.2, 0.8, 2.5, 'car');
        }
    }

    // --- Controls Logic ---
    const raycaster = new THREE.Raycaster();
    
    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    const settingsBtn = document.getElementById('settings-btn');
    const settingsMenu = document.getElementById('settings-menu');
    const closeBtn = document.getElementById('close-settings');
    const sensSlider = document.getElementById('sens-slider');
    const camSlider = document.getElementById('cam-slider');

    settingsBtn.onclick = () => { isPaused = true; settingsMenu.style.display = 'flex'; };
    closeBtn.onclick = () => { isPaused = false; settingsMenu.style.display = 'none'; };
    sensSlider.oninput = (e) => { config.sensitivity = e.target.value / 1000; };
    camSlider.oninput = (e) => { config.camSmooth = e.target.value / 100; };

    // --- Core Game Loop ---
    function animate() {
        requestAnimationFrame(animate);
        if (isPaused) return;

        // 1. Smoothly move target based on mouse
        raycaster.setFromCamera(mouse, camera);
        const intersect = raycaster.intersectObject(ground);
        if (intersect.length > 0) {
            // The hole "drifts" toward the cursor based on sensitivity
            const p = intersect[0].point;
            targetHolePos.lerp(p, config.sensitivity * 10); 
        }

        // Apply hole position
        pit.position.x = targetHolePos.x;
        pit.position.z = targetHolePos.z;
        ring.position.x = targetHolePos.x;
        ring.position.z = targetHolePos.z;
        
        // Scale hole visuals
        pit.scale.set(config.holeRadius, 1, config.holeRadius);
        ring.scale.set(config.holeRadius, config.holeRadius, 1);

        // 2. Smooth Camera Follow
        const camTarget = new THREE.Vector3(targetHolePos.x, camera.position.y, targetHolePos.z + 25);
        camera.position.lerp(camTarget, config.camSmooth);
        camera.lookAt(targetHolePos.x, 0, targetHolePos.z);

        // 3. Physics & Falling Logic
        items.forEach((item, index) => {
            if (item.userData.consumed) return;

            const dist = new THREE.Vector2(item.position.x - targetHolePos.x, item.position.z - targetHolePos.z).length();

            // If object is over the hole
            if (dist < config.holeRadius) {
                // Only fall if hole is large enough
                if (config.holeRadius > item.userData.size * 0.8) {
                    item.userData.isFalling = true;
                }
            }

            if (item.userData.isFalling) {
                // Sucking effect: move toward center
                item.position.x += (targetHolePos.x - item.position.x) * 0.1;
                item.position.z += (targetHolePos.z - item.position.z) * 0.1;

                // Falling effect: gravity
                item.userData.velY -= 0.01;
                item.position.y += item.userData.velY;

                // Tumbling effect
                item.rotation.x += item.userData.rotVel.x;
                item.rotation.y += item.userData.rotVel.y;

                // Scale down slightly as it falls
                item.scale.multiplyScalar(0.98);

                // Consumption check
                if (item.position.y < -5 || item.scale.x < 0.1) {
                    scene.remove(item);
                    item.userData.consumed = true;
                    config.score += 0.1;
                    config.holeRadius += 0.03;
                    document.getElementById('score-val').innerText = config.score.toFixed(1) + "m";
                }
            } else {
                // If not falling, ensure it stays on ground (for segmented buildings logic)
                // This keeps segments from floating if the one below them is eaten
                const belowThreshold = (item.userData.type === 'building') ? -100 : 0;
                if (item.position.y > item.userData.height/2) {
                     // Simple gravity for building blocks if floor below is gone
                     let hasSupport = false;
                     // In a full game we'd raycast down, here we just let them settle
                     item.position.y -= 0.05; 
                }
                if (item.position.y < item.userData.height/2) item.position.y = item.userData.height/2;
            }
        });

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
