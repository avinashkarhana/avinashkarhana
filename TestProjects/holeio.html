<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Hole.io Clone</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box; color: white;
        }
        .stats { display: flex; justify-content: space-between; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #timer { color: #ffeb3b; }
        #settings-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 30px; border-radius: 15px;
            pointer-events: all; display: none; flex-direction: column; gap: 15px; color: white; border: 1px solid #444;
        }
        .slider-row { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
        button { cursor: pointer; padding: 10px; background: #3498db; border: none; color: white; border-radius: 5px; font-weight: bold; }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 100;
        }
    </style>
</head>
<body>

<div id="ui-overlay">
    <div class="stats">
        <div id="score">SIZE: 1.5m</div>
        <div id="timer">02:00</div>
    </div>
    <div style="text-align: center; opacity: 0.6;">Hold Mouse to Move</div>
</div>

<div id="settings-panel">
    <h2>Settings</h2>
    <div class="slider-row"><label>Sensitivity</label><input type="range" id="sens" min="5" max="50" value="20"></div>
    <button onclick="toggleSettings()">Resume</button>
</div>

<div id="game-over">
    <h1 id="final-status">TIME'S UP!</h1>
    <p id="final-score">Final Size: 0m</p>
    <button onclick="location.reload()">Play Again</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- Configuration ---
    const GAME_TIME = 120; // 2 minutes
    const WORLD_SIZE = 120;
    const GRID_RES = 6; // Spacing between buildings
    let holeRadius = 1.6;
    let score = 1.6;
    let sensitivity = 0.02;
    let timeLeft = GAME_TIME;
    let gameActive = true;

    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 50, 150);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(50, 100, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // --- Ground ---
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2),
        new THREE.MeshStandardMaterial({ color: 0x444444 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- Hole Visual ---
    const holeGroup = new THREE.Group();
    const holeCircle = new THREE.Mesh(
        new THREE.RingGeometry(0.95, 1, 32),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
    );
    holeCircle.rotation.x = -Math.PI / 2;
    holeCircle.position.y = 0.05;

    const holePit = new THREE.Mesh(
        new THREE.CylinderGeometry(1, 1, 10, 32),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
    );
    holePit.position.y = -5.01;

    holeGroup.add(holeCircle);
    holeGroup.add(holePit);
    scene.add(holeGroup);

    // --- World Generation ---
    const items = [];
    const colors = [0xff5722, 0x4caf50, 0x2196f3, 0xffeb3b, 0x9c27b0, 0xffffff];

    function createObject(x, z, w, h, d, isSegmented) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        if (isSegmented) {
            const floors = Math.ceil(h / 0.8);
            for (let i = 0; i < floors; i++) {
                const segH = 0.75;
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(w, segH, d),
                    new THREE.MeshStandardMaterial({ color })
                );
                mesh.position.set(x, (i * (segH + 0.05)) + segH/2, z);
                setupObject(mesh, w, d);
            }
        } else {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color })
            );
            mesh.position.set(x, h/2, z);
            setupObject(mesh, w, d);
        }
    }

    function setupObject(mesh, w, d) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = {
            size: Math.sqrt(w*w + d*d) / 2, // Radius-like size
            fallStarted: 0,
            isFalling: false,
            velocity: new THREE.Vector3(),
            rotVel: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).multiplyScalar(0.1)
        };
        scene.add(mesh);
        items.push(mesh);
    }

    // Programmatic Grid Generation
    for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x += GRID_RES) {
        for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z += GRID_RES) {
            if (Math.abs(x) < 5 && Math.abs(z) < 5) continue; // Keep center clear

            const chance = Math.random();
            const cx = x + (Math.random() - 0.5) * 2;
            const cz = z + (Math.random() - 0.5) * 2;

            if (chance > 0.8) {
                // Tall segmented building
                createObject(cx, cz, 3, 6 + Math.random() * 8, 3, true);
            } else if (chance > 0.4) {
                // Solid small building/house
                createObject(cx, cz, 2.5, 2 + Math.random() * 3, 2.5, false);
            } else if (chance > 0.1) {
                // Small props (cars/boxes)
                createObject(cx, cz, 1, 0.6, 2, false);
            }
        }
    }

    // --- Game Logic ---
    const mouse = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    const holeTarget = new THREE.Vector3();

    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // Handle timer
    const timerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 0) endGame();
    }, 1000);

    function endGame() {
        gameActive = false;
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-score').innerText = `Final Size: ${score.toFixed(1)}m`;
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!gameActive) return;

        // 1. Hole Movement
        raycaster.setFromCamera(mouse, camera);
        const intersect = raycaster.intersectObject(ground);
        if (intersect.length > 0) {
            const p = intersect[0].point;
            holeTarget.lerp(p, sensitivity);
        }
        holeGroup.position.copy(holeTarget);
        holeGroup.scale.set(holeRadius, 1, holeRadius);

        // 2. Dynamic Camera (Zooms out as hole grows to keep visual size consistent)
        // Base distance * hole scale factor
        const camDist = 15 + (holeRadius * 4);
        const camHeight = 12 + (holeRadius * 3);
        const targetCamPos = new THREE.Vector3(
            holeTarget.x, 
            camHeight, 
            holeTarget.z + camDist
        );
        camera.position.lerp(targetCamPos, 0.05);
        camera.lookAt(holeTarget);

        // 3. Physics & Delayed Falling
        const now = Date.now();

        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            const dx = item.position.x - holeTarget.x;
            const dz = item.position.z - holeTarget.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            // Logic: Is object within the hole?
            if (dist < holeRadius * 0.9) {
                // Sizing Check: Hole must be significantly larger than the base
                if (holeRadius > item.userData.size * 1.1) {
                    
                    if (!item.userData.isFalling) {
                        if (item.userData.fallStarted === 0) {
                            item.userData.fallStarted = now; // Start the 200ms timer
                        } else if (now - item.userData.fallStarted > 200) {
                            item.userData.isFalling = true;
                        }
                    }
                }
            } else {
                // If it moved out of the hole before 200ms, reset timer
                if (!item.userData.isFalling) item.userData.fallStarted = 0;
            }

            if (item.userData.isFalling) {
                // Smooth Suck to center
                item.position.x += (holeTarget.x - item.position.x) * 0.1;
                item.position.z += (holeTarget.z - item.position.z) * 0.1;

                // Straight Smooth Fall
                item.userData.velocity.y -= 0.015;
                item.position.y += item.userData.velocity.y;
                
                // Rotate while falling
                item.rotation.x += item.userData.rotVel.x;
                item.rotation.z += item.userData.rotVel.z;

                // Scale down slightly as it goes deep
                item.scale.multiplyScalar(0.97);

                // Cleanup and Score
                if (item.position.y < -8) {
                    scene.remove(item);
                    items.splice(i, 1);
                    score += 0.05;
                    holeRadius += 0.02;
                    document.getElementById('score').innerText = `SIZE: ${score.toFixed(1)}m`;
                }
            }
        }

        renderer.render(scene, camera);
    }

    // Settings
    window.toggleSettings = () => {
        const panel = document.getElementById('settings-panel');
        const isVisible = panel.style.display === 'flex';
        panel.style.display = isVisible ? 'none' : 'flex';
        gameActive = isVisible;
    };

    document.getElementById('sens').oninput = (e) => {
        sensitivity = e.target.value / 1000;
    };

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
