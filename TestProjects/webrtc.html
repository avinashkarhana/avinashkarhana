<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AKalls</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --primary: #34c759; --danger: #ff3b30; --blue: #007aff; --text: #fff; --gray: rgba(255,255,255,0.12); }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { background-color: #0a0a0a; color: var(--text); margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        .app-shell { width: 100%; max-width: 450px; height: 100dvh; background: var(--bg); position: relative; display: flex; flex-direction: column; border-left: 1px solid #222; border-right: 1px solid #222; }

        .view { display: none; flex-direction: column; height: 100%; width: 100%; overflow: hidden; position: relative; }
        .view.active { display: flex; }

        /* Header */
        .header { padding: calc(10px + env(safe-area-inset-top)) 15px 10px; text-align: center; border-bottom: 1px solid #222; flex-shrink: 0; }
        .app-name { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        #user-name-input { background: none; border: none; color: #888; font-size: 13px; text-align: center; width: 100%; outline: none; margin-top: 5px; border-bottom: 1px dashed #333; }
        .id-pill { background: var(--gray); padding: 5px 15px; border-radius: 20px; font-size: 11px; cursor: pointer; display: inline-block; margin-top: 8px; color: var(--blue); }

        /* Dialer Layout */
        .dial-display-container { flex-shrink: 0; padding: 20px 0 10px; text-align: center; }
        #dial-display { font-size: 48px; font-weight: 200; letter-spacing: 5px; height: 60px; color: #fff; }

        /* Scrollable Content */
        .scrollable-content { flex-grow: 1; overflow-y: auto; padding: 0 15px; -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); }
        .logs-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; position: sticky; top: 0; background: var(--bg); padding: 5px 0; z-index: 5; }
        
        .log-item { display: flex; align-items: center; background: var(--gray); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
        .log-body { flex-grow: 1; padding: 12px; cursor: pointer; display: flex; align-items: center; }
        .log-body:active { background: rgba(255,255,255,0.1); }
        .log-type { font-size: 8px; font-weight: bold; padding: 2px 5px; border-radius: 4px; margin-right: 10px; color: #fff; }
        .log-info b { font-size: 14px; display: block; }
        .log-info span { font-size: 10px; color: #666; }
        .info-icon { padding: 15px; cursor: pointer; color: var(--blue); border-left: 1px solid rgba(255,255,255,0.05); font-size: 18px; }

        /* Pinned Keypad */
        .keypad { flex-shrink: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; justify-items: center; padding: 15px 20px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid #111; background: var(--bg); }
        .key { width: 68px; height: 68px; background: var(--gray); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 26px; font-weight: bold; }
        .key:active { background: #333; }
        .key.call-btn { background: var(--primary); grid-column: 2; }

        /* Video Area */
        .video-container { flex-grow: 1; position: relative; background: #000; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-preview { position: absolute; top: 20px; right: 20px; width: 90px; height: 130px; border-radius: 12px; border: 1px solid #444; z-index: 10; overflow: hidden; }
        .vol-bar-bg { position: absolute; bottom: 0; width: 100%; height: 4px; background: rgba(0,0,0,0.5); }
        #vol-bar-fill { height: 100%; width: 0; background: var(--primary); transition: width 0.1s; }

        .call-controls { position: absolute; bottom: 0; width: 100%; display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 20px 5px calc(30px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, #000); justify-items: center; z-index: 20; }
        .btn-round { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--gray); color: #fff; font-size: 18px; cursor: pointer; }
        .btn-round.active { background: #fff; color: #000; }
        .btn-round.hangup { background: var(--danger); font-size: 22px; }

        /* Forensics Modal */
        .modal { position: absolute; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; padding: 20px; padding-top: env(safe-area-inset-top); overflow-y: auto; }
        .timeline-item { border-left: 2px solid var(--gray); padding: 0 0 20px 15px; position: relative; }
        .timeline-item::before { content: ''; width: 10px; height: 10px; background: var(--blue); border-radius: 50%; position: absolute; left: -6px; top: 2px; }
        .timeline-remote::before { background: var(--primary); }
        .timeline-msg { font-size: 14px; color: #eee; }
        .timeline-time { font-size: 10px; color: #666; font-family: monospace; }

        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="view active" id="view-dialer">
            <div class="header">
                <div class="app-name">AKalls</div>
                <input type="text" id="user-name-input" placeholder="Set your name">
                <div id="net-state" style="font-size: 9px; color: #ffc107; margin-top:5px;">CONNECTING...</div>
                <div class="id-pill" onclick="copyInvite()">My Number: <b id="my-num">....</b> 🔗</div>
            </div>
            <div class="dial-display-container"><div id="dial-display"></div></div>
            <div class="scrollable-content">
                <div class="logs-label">Recent Activity (Tap to redial)</div>
                <div id="log-list"></div>
            </div>
            <div class="keypad">
                <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div>
                <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div>
                <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div>
                <div class="key" style="background:transparent; color:#444; font-size:18px;" onclick="backspace()">⌫</div>
                <div class="key" onclick="press('0')">0</div>
                <div class="key call-btn" onclick="startCall()">📞</div>
            </div>
        </div>

        <div id="view-call" class="view">
            <div class="video-container">
                <video id="remote-video" autoplay playsinline autopictureinpicture></video>
                <div id="local-preview">
                    <video id="local-video" autoplay playsinline muted></video>
                    <div class="vol-bar-bg"><div id="vol-bar-fill"></div></div>
                </div>
            </div>
            <div class="call-controls">
                <button class="btn-round active" id="mic-btn" onclick="toggleMic()">🎤</button>
                <button class="btn-round active" id="cam-btn" onclick="toggleCam()">📷</button>
                <button class="btn-round" onclick="flipCamera()">🔄</button>
                <button class="btn-round" onclick="toggleScreen()">📺</button>
                <button class="btn-round" id="pip-btn" onclick="togglePiP()">🖼️</button>
                <button class="btn-round hangup" onclick="hangup(true)">📵</button>
            </div>
        </div>

        <div id="modal-forensic" class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <h2 style="margin:0;">Call Forensics</h2>
                <button onclick="closeModal()" style="background:var(--gray); border:none; color:#fff; padding:8px 15px; border-radius:10px;">Close</button>
            </div>
            <div id="timeline-box"></div>
        </div>

        <div id="incoming-ui" class="overlay">
            <h1 id="caller-name-ui" style="font-size: 42px; margin-bottom: 40px;">0000</h1>
            <div style="display:flex; gap: 40px;">
                <button class="btn-round hangup" style="width:75px; height:75px;" onclick="location.reload()">✕</button>
                <button class="btn-round" style="background:var(--primary); width:75px; height:75px;" onclick="answerCall()">✔</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE = { ID: 'akalls_id', NAME: 'akalls_name', LOGS: 'akalls_history' };
        let myId = localStorage.getItem(STORAGE.ID) || Math.floor(1000 + Math.random() * 9000).toString();
        localStorage.setItem(STORAGE.ID, myId);
        document.getElementById('my-num').innerText = myId;

        const nameInput = document.getElementById('user-name-input');
        nameInput.value = localStorage.getItem(STORAGE.NAME) || "";
        nameInput.oninput = () => localStorage.setItem(STORAGE.NAME, nameInput.value);

        const peer = new Peer('P-' + myId, {
            config: { iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "turn:global.relay.metered.ca:80", username: "c198465a34d3f8e5ae248d9e", credential: "5BRzxWFSps2G0yOR" },
                { urls: "turn:global.relay.metered.ca:443", username: "c198465a34d3f8e5ae248d9e", credential: "5BRzxWFSps2G0yOR" }
            ]}
        });

        let localStream, currentCall, dataConn, audioCtx, analyser, events = [], startTime = 0;
        const remoteVid = document.getElementById('remote-video');

        // --- 1. SYNCED LOGGING ENGINE ---
        function logEvent(msg, broadcast = true) {
            const elapsed = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0;
            const entry = { 
                time: `${Math.floor(elapsed/60)}:${(elapsed%60).toString().padStart(2,'0')}`, 
                msg: msg,
                isRemote: !broadcast // If we are not broadcasting, it was received from remote
            };
            events.push(entry);
            
            // Broadcast to Peer
            if (broadcast && dataConn && dataConn.open) {
                dataConn.send({ type: 'EVENT', msg: msg });
            }
        }

        function setupDataChannel(conn) {
            dataConn = conn;
            conn.on('data', d => {
                if (d === 'BYE') endCall("Remote hung up");
                if (d === 'PING') { conn.send('PONG'); }
                if (d.type === 'EVENT') {
                    logEvent("Remote: " + d.msg, false); // Log without broadcasting back
                }
            });
        }

        // --- 2. PEER EVENTS ---
        peer.on('open', () => { document.getElementById('net-state').innerText = "ONLINE"; renderLogs(); });
        peer.on('connection', conn => setupDataChannel(conn));
        peer.on('call', call => { 
            currentCall = call; 
            document.getElementById('caller-name-ui').innerText = (call.metadata && call.metadata.name) || call.peer.replace('P-',''); 
            document.getElementById('incoming-ui').style.display = 'flex'; 
        });

        async function startCall(directNum = null) {
            const num = directNum || document.getElementById('dial-display').innerText;
            if(!num) return;
            switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('local-video').srcObject = localStream;
            startTime = Date.now(); events = []; logEvent("Call started");
            
            dataConn = peer.connect('P-' + num);
            setupDataChannel(dataConn);
            
            currentCall = peer.call('P-' + num, localStream, { metadata: { name: nameInput.value } });
            setupStream();
        }

        async function answerCall() {
            document.getElementById('incoming-overlay').style.display = 'none';
            switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('local-video').srcObject = localStream;
            startTime = Date.now(); events = []; logEvent("Call answered");
            
            currentCall.answer(localStream);
            dataConn = peer.connect(currentCall.peer);
            setupDataChannel(dataConn);
            setupStream();
        }

        function setupStream() {
            currentCall.on('stream', rem => { remoteVid.srcObject = rem; logEvent("Video connected"); });
            initVis(localStream);
        }

        function endCall(reason) {
            logEvent(reason || "Call ended");
            const duration = Math.floor((Date.now() - startTime) / 1000);
            const history = JSON.parse(localStorage.getItem(STORAGE.LOGS) || '[]');
            history.unshift({ 
                num: currentCall ? currentCall.peer.replace('P-','') : '?', 
                type: currentCall && currentCall.metadata && currentCall.metadata.name ? 'IN' : 'OUT', 
                duration: `${Math.floor(duration/60)}m ${duration%60}s`, 
                timeline: [...events], 
                date: new Date().toLocaleString() 
            });
            localStorage.setItem(STORAGE.LOGS, JSON.stringify(history.slice(0, 20)));
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            switchView('view-dialer'); renderLogs(); analyser = null;
        }

        // --- 3. UI & FEATURES ---
        function renderLogs() {
            const history = JSON.parse(localStorage.getItem(STORAGE.LOGS) || '[]');
            document.getElementById('log-list').innerHTML = history.map((h, i) => `
                <div class="log-item">
                    <div class="log-body" onclick="redial('${h.num}')">
                        <span class="log-type" style="background:${h.type==='IN'?'#34c759':'#007aff'}">${h.type}</span>
                        <div class="log-info"><b>${h.num}</b><span>${h.date} • ${h.duration}</span></div>
                    </div>
                    <div class="info-icon" onclick="openForensics(${i})">ⓘ</div>
                </div>`).join('');
        }

        function openForensics(idx) {
            const h = JSON.parse(localStorage.getItem(STORAGE.LOGS))[idx];
            document.getElementById('timeline-box').innerHTML = h.timeline.map(e => `
                <div class="timeline-item ${e.isRemote ? 'timeline-remote' : ''}">
                    <div class="timeline-time">${e.time}</div>
                    <div class="timeline-msg">${e.msg}</div>
                </div>`).join('');
            document.getElementById('modal-forensic').style.display = 'flex';
        }

        function toggleMic() { 
            const active = localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled;
            document.getElementById('mic-btn').classList.toggle('active');
            logEvent(active ? "Unmuted microphone" : "Muted microphone");
        }
        function toggleCam() { 
            const active = localStream.getVideoTracks()[0].enabled = !localStream.getVideoTracks()[0].enabled;
            document.getElementById('cam-btn').classList.toggle('active');
            logEvent(active ? "Started camera" : "Stopped camera");
        }
        async function flipCamera() { 
            logEvent("Flipping camera");
            const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:true});
            currentCall.peerConnection.getSenders().find(x=>x.track.kind==='video').replaceTrack(s.getVideoTracks()[0]);
            document.getElementById('local-video').srcObject = s;
        }
        async function toggleScreen() { 
            try { 
                const s = await navigator.mediaDevices.getDisplayMedia({video:true}); 
                logEvent("Started screen share");
                currentCall.peerConnection.getSenders().find(x=>x.track.kind==='video').replaceTrack(s.getVideoTracks()[0]);
            } catch(e){} 
        }

        // --- 4. UTILS ---
        function closeModal() { document.getElementById('modal-forensic').style.display = 'none'; }
        function redial(n) { document.getElementById('dial-display').innerText = n; startCall(n); }
        function press(k) { if(navigator.vibrate) navigator.vibrate(15); const d = document.getElementById('dial-display'); if(d.innerText.length < 4) d.innerText += k; }
        function backspace() { const d = document.getElementById('dial-display'); d.innerText = d.innerText.slice(0,-1); }
        function switchView(v) { document.querySelectorAll('.view').forEach(e => e.classList.remove('active')); document.getElementById(v).classList.add('active'); }
        function hangup(sig) { if(sig && dataConn) dataConn.send('BYE'); endCall("Hung up"); }
        function togglePiP() { if (document.pictureInPictureElement) document.exitPictureInPicture(); else remoteVid.requestPictureInPicture(); }
        function copyInvite() { navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?dial=${myId}`); alert("Link Copied!"); }
        function initVis(s) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser();
            audioCtx.createMediaStreamSource(s).connect(analyser);
            const f = () => { if(!analyser) return; const d = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(d);
                document.getElementById('vol-bar-fill').style.width = Math.min(100, (d.reduce((a,b)=>a+b,0)/d.length)*2.5) + "%"; requestAnimationFrame(f); }; f();
        }
    </script>
</body>
</html>
