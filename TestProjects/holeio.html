<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Hole.io Clone - Cyberpunk Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff0055;
            --neon-yellow: #fcee0a;
            --neon-green: #00ff66;
            --bg-glass: rgba(8, 12, 20, 0.75);
            --border-cyan: rgba(0, 240, 255, 0.35);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background: #05070d; 
            font-family: 'Rajdhani', sans-serif; 
            touch-action: none; 
            user-select: none; 
            -webkit-user-select: none;
        }
        
        #ui-overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 14px; 
            box-sizing: border-box; 
            color: white;
            z-index: 10;
        }
        
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            gap: 8px;
        }

        .cyber-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 10px rgba(0, 240, 255, 0.05);
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }
        
        #stars-container { 
            display: flex; 
            align-items: center;
            gap: 4px; 
            pointer-events: all; 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            padding: 6px 12px; 
        }
        #stars-container:hover { 
            transform: scale(1.04); 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        }
        .star { 
            font-size: 20px; 
            color: #334155; 
            transition: color 0.3s, text-shadow 0.3s; 
            line-height: 1;
        }
        .star.achieved { 
            color: var(--neon-yellow); 
            text-shadow: 0 0 10px var(--neon-yellow), 0 0 20px rgba(252, 238, 10, 0.6); 
        }
        .star.failed { 
            color: var(--neon-pink); 
            opacity: 0.5; 
        }
        
        #center-info { 
            text-align: center; 
            padding: 8px 16px; 
            pointer-events: all; 
            min-width: 140px;
        }
        #level-text { 
            font-family: 'Orbitron', sans-serif;
            font-size: 11px; 
            letter-spacing: 1.5px;
            color: var(--neon-cyan); 
            margin-bottom: 2px; 
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }
        #score-text { 
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff; 
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }
        
        #growth-container { 
            margin-top: 6px; 
            width: 100%; 
            max-width: 200px;
            text-align: center;
        }
        #growth-text { 
            color: #94a3b8; 
            margin-bottom: 3px; 
            font-weight: 600; 
            letter-spacing: 1px; 
            font-size: 10px;
            text-transform: uppercase;
        }
        .progress-bg { 
            width: 100%; 
            height: 6px; 
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid rgba(0, 240, 255, 0.3); 
            border-radius: 2px;
            overflow: hidden; 
            box-shadow: inset 0 0 6px rgba(0,0,0,0.9); 
        }
        #growth-bar { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green)); 
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.2s ease-out, background 0.4s ease;
        }
        
        .right-hud { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            gap: 6px; 
            pointer-events: all; 
        }
        #timer { 
            font-family: 'Orbitron', sans-serif;
            font-size: 18px; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            padding: 6px 12px; 
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(252, 238, 10, 0.6);
        }
        #btn-settings { 
            cursor: pointer; 
            padding: 6px 10px; 
            color: #cbd5e1; 
            font-weight: 700; 
            font-size: 12px;
            letter-spacing: 1px;
            transition: 0.2s; 
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #btn-settings:hover { 
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .modal {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(4, 7, 13, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            color: white; 
            z-index: 100; 
            pointer-events: all;
            padding: 15px;
            box-sizing: border-box;
        }
        
        .modal-content {
            background: rgba(10, 15, 26, 0.95); 
            border: 1px solid var(--neon-cyan); 
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 240, 255, 0.08);
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            padding: 24px; 
            width: 440px; 
            max-width: 95vw; 
            max-height: 88vh;
            overflow-y: auto;
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            box-sizing: border-box;
        }

        .main-menu-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: var(--neon-cyan);
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px rgba(0, 240, 255, 0.6);
            margin: 0;
        }
        .main-menu-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--neon-pink);
            letter-spacing: 3px;
            margin-top: -6px;
            margin-bottom: 10px;
            text-shadow: 0 0 8px var(--neon-pink);
        }
        .save-badge {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-cyan);
            padding: 8px 12px;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .save-badge strong {
            color: var(--neon-yellow);
        }
        
        .obj-row { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 14px; 
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(0, 240, 255, 0.2);
            margin: 6px 0; 
            padding: 10px 12px; 
            text-align: left; 
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }
        .obj-row img { 
            width: 60px; 
            height: 60px; 
            background: #0b111e; 
            border: 1px solid var(--border-cyan); 
            object-fit: contain; 
        }
        .obj-details { flex-grow: 1; }
        .obj-desc { 
            font-weight: 700; 
            font-size: 15px; 
            color: #f1f5f9; 
            letter-spacing: 0.5px;
            margin-bottom: 2px; 
        }
        .obj-prog { font-size: 12px; color: var(--neon-cyan); }
        .obj-status { 
            font-family: 'Orbitron', sans-serif;
            font-size: 16px; 
            font-weight: 700; 
            color: var(--neon-yellow);
        }
        
        .slider-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 10px 14px; 
            gap: 8px;
        }
        .slider-row label { 
            font-weight: 700; 
            font-size: 13px; 
            width: 38%; 
            text-align: left;
            letter-spacing: 0.5px;
            color: #cbd5e1;
        }
        input[type=range] { 
            width: 44%; 
            accent-color: var(--neon-cyan);
            cursor: pointer;
        }
        .val-display { 
            background: #090d16; 
            color: var(--neon-cyan);
            padding: 2px 6px; 
            border: 1px solid var(--border-cyan); 
            font-family: 'Orbitron', monospace; 
            font-size: 13px; 
            min-width: 25px; 
            text-align: center; 
        }

        button { 
            cursor: pointer; 
            padding: 11px 22px; 
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.05)); 
            border: 1px solid var(--neon-cyan); 
            color: var(--neon-cyan); 
            font-family: 'Orbitron', sans-serif;
            font-weight: 700; 
            font-size: 14px; 
            letter-spacing: 1.5px;
            transition: 0.2s; 
            margin: 4px; 
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }
        button:hover { 
            background: var(--neon-cyan); 
            color: #05070d; 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transform: translateY(-1px); 
        }
        button.success { 
            border-color: var(--neon-green); 
            color: var(--neon-green); 
            background: linear-gradient(135deg, rgba(0, 255, 102, 0.2), rgba(0, 255, 102, 0.05));
        }
        button.success:hover { 
            background: var(--neon-green); 
            color: #05070d; 
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }
        button.danger {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(255, 0, 85, 0.05));
        }
        button.danger:hover {
            background: var(--neon-pink); 
            color: #ffffff; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #475569;
            color: #64748b;
            box-shadow: none;
            transform: none;
        }
        
        #instructions { 
            position: absolute; 
            bottom: 12px; 
            width: 100%; 
            left: 0;
            text-align: center; 
            opacity: 0.6; 
            font-weight: 600; 
            pointer-events: none; 
            font-size: 13px; 
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 6px black;
        }
        
        #joystick-base {
            position: absolute; 
            border-radius: 50%; 
            width: 90px; 
            height: 90px;
            background: rgba(0, 240, 255, 0.06); 
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
            transform: translate(-50%, -50%); 
            pointer-events: none; 
            display: none; 
            z-index: 50;
        }
        #joystick-knob {
            position: absolute; 
            border-radius: 50%; 
            width: 36px; 
            height: 36px;
            background: radial-gradient(circle, var(--neon-cyan) 0%, rgba(0, 240, 255, 0.2) 80%); 
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: translate(-50%, -50%); 
            top: 50%; 
            left: 50%;
        }

        @media (max-width: 600px) {
            #ui-overlay { padding: 8px; }
            .top-bar { gap: 4px; }
            #stars-container { padding: 4px 8px; gap: 2px; }
            .star { font-size: 16px; }
            #center-info { padding: 4px 10px; min-width: 110px; }
            #level-text { font-size: 9px; letter-spacing: 1px; }
            #score-text { font-size: 13px; }
            #growth-container { margin-top: 4px; max-width: 140px; }
            #growth-text { font-size: 8px; margin-bottom: 2px; }
            .progress-bg { height: 5px; }
            #timer { font-size: 15px; padding: 4px 8px; }
            #btn-settings { font-size: 11px; padding: 4px 6px; }
            #instructions { font-size: 10px; bottom: 8px; }
            .modal-content { padding: 16px; gap: 8px; }
            .main-menu-title { font-size: 24px; letter-spacing: 2px; }
            .main-menu-sub { font-size: 9px; }
            .obj-row { padding: 6px 8px; gap: 8px; }
            .obj-row img { width: 45px; height: 45px; }
            .obj-desc { font-size: 13px; }
            button { font-size: 12px; padding: 9px 16px; }
        }

        @media (max-height: 500px) {
            #ui-overlay { padding: 6px 12px; }
            #growth-container { display: none; }
            #center-info { padding: 4px 8px; }
            .modal-content { max-height: 94vh; padding: 12px; }
        }
    </style>
</head>
<body>

<div id="joystick-base"><div id="joystick-knob"></div></div>

<div id="ui-overlay">
    <div class="top-bar">
        <div id="stars-container" class="cyber-card" title="Click to view Objectives">

<!-- Main Menu Modal -->

        <button onclick="resumeGame('obj-modal')">RESUME MISSION</button>

</div>

<!-- End Game Modal -->

        <h1 id="end-title" style="font-size: 28px; margin: 0; font-family: 'Orbitron', sans-serif; letter-spacing: 2px;">MISSION EXPIRED</h1>

        <div style="font-size: 36px; margin: 10px 0;" id="end-stars"></div>
        <div id="end-buttons">
            <button id="btn-next" class="success" style="display:none;" onclick="nextLevel()">NEXT SECTOR</button>

<script>
    window.__holeioBooted = false;
    window.__holeioBootErrorShown = false;

    function showBootError(message) {
        if (window.__holeioBootErrorShown) return;
        window.__holeioBootErrorShown = true;
        const el = document.createElement('div');
        el.style.position = 'fixed';
        el.style.left = '16px';
        el.style.right = '16px';
        el.style.bottom = '16px';
        el.style.zIndex = '1000';
        el.style.background = 'rgba(35, 10, 16, 0.95)';
        el.style.border = '1px solid #ff0055';
        el.style.boxShadow = '0 0 20px rgba(255, 0, 85, 0.35)';
        el.style.color = '#ffd3df';
        el.style.padding = '12px 14px';
        el.style.fontFamily = "'Rajdhani', sans-serif";
        el.style.fontSize = '14px';
        el.style.letterSpacing = '0.4px';
        el.textContent = message;
        document.body.appendChild(el);
    }

    window.addEventListener('unhandledrejection', (event) => {
        const msg = String(event?.reason?.message || event?.reason || '');
        if (msg.toLowerCase().includes('failed') && msg.toLowerCase().includes('import')) {
            showBootError('Game failed to start: required engine scripts could not be loaded. Check network access and reload.');
        }
    });

    window.addEventListener('load', () => {
        setTimeout(() => {
            if (!window.__holeioBooted) {
                showBootError('Game initialization did not complete. If you are offline or behind a restricted network, external dependencies may be blocked.');
            }
        }, 3000);
    });
</script>

<script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    // --- Global Game State ---
    let GAME_TIME = 150;
    let currentLevel = 1;
    let difficultyConfig = {};
    let totalWorldPoints = 0;
    let score = 0;
    
    // Growth Logic (Smooth Animation Over ~2 Seconds)
    let holeLevel = 1;
    let holePoints = 0;
    let targetHolePoints = 100;
    let holeRadius = 1.6;       
    let targetHoleRadius = 1.6; 
    let scoreMultiplier = 1.6; 
    
    // Sensitivities
    let mouseSpeed = 20;
    let touchSpeed = 20;
    let keySpeed = 20;
    
    let timeLeft = GAME_TIME;
    let gameActive = false;
    let isPaused = true;
    let inMainMenu = true;
    
    let objectives = []; 
    let WORLD_SIZE = 160;
    let polygon = []; 
    
    let items = [];
    let mapMeshes = [];
    let wallBodies = [];
    
    let nextBuildingId = 1;
    let buildingMap = {};
    let buildingStates = {};
    let removalQueue = [];

    // Gameplay tuning: COM trigger sensitivity, below-ground removal line, and visual fade-out timing.
    const HOLE_COM_MARGIN = 0.98;
    const REMOVAL_Y_THRESHOLD = -0.35;
    const FINAL_FADE_MS = 160;

    function disposeMeshResources(mesh) {
        if (!mesh) return;
        if (mesh.isGroup) {
            mesh.traverse(child => {
                if (!child.isMesh) return;
                child.geometry?.dispose();
                if (Array.isArray(child.material)) child.material.forEach(m => m?.dispose?.());
                else child.material?.dispose?.();
            });
            return;
        }
        mesh.geometry?.dispose?.();
        if (Array.isArray(mesh.material)) mesh.material.forEach(m => m?.dispose?.());
        else mesh.material?.dispose?.();
    }

    function getItemHalfHeight(item) {
        const params = item?.mesh?.geometry?.parameters;
        const baseHeight = params?.height ?? (item.radius ? item.radius * 2 : 1);
        return Math.max(0.05, baseHeight * 0.5 * (item?.mesh?.scale?.y ?? 1));
    }

    function getItemTopY(item) {
        return item.body.position.y + getItemHalfHeight(item);
    }

    function getPartsOfBuilding(buildingId) {
        return items.filter(it => it.buildingId === buildingId && !it._scheduledForRemoval);
    }

    function computeBuildingCOM(buildingId) {
        const parts = getPartsOfBuilding(buildingId);
        if (!parts.length) return null;
        let totalMass = 0;
        let sumX = 0, sumY = 0, sumZ = 0;
        for (const part of parts) {
            const m = Math.max(0.001, part.mass || part.body.mass || 1);
            totalMass += m;
            sumX += part.body.position.x * m;
            sumY += part.body.position.y * m;
            sumZ += part.body.position.z * m;
        }
        if (totalMass <= 0) return null;
        return { x: sumX / totalMass, y: sumY / totalMass, z: sumZ / totalMass };
    }

    function startBuildingFall(buildingId) {
        if (!buildingId) return;
        const state = buildingStates[buildingId];
        if (state?.falling) return;

        const parts = getPartsOfBuilding(buildingId);
        if (!parts.length) return;

        buildingStates[buildingId] = { falling: true, startedAt: performance.now() };

        for (const part of parts) {
            const body = part.body;
            if (!body) continue;
            if (body.type !== CANNON.Body.DYNAMIC) {
                body.type = CANNON.Body.DYNAMIC;
                if (body.mass <= 0) body.mass = Math.max(0.5, part.mass || 1);
                body.updateMassProperties?.();
            }
            body.collisionFilterMask = maskVoidFall;
            body.wakeUp?.();
            part._fallTriggered = true;
        }
    }

    function applyItemRewards(item) {
        if (!item || item._rewardGranted) return;
        item._rewardGranted = true;
        score += item.mass;
        updateScoreObjective();
        checkItemObjective(item);

        holePoints += item.mass;
        while (holePoints >= targetHolePoints) {
            holePoints -= targetHolePoints;
            holeLevel++;
            const percent = getGrowthPercent(holeLevel);
            targetHoleRadius *= (1 + percent);
            scoreMultiplier *= (1 + percent);
            targetHolePoints = getNextTargetPoints(holeLevel);
        }
        updateGrowthUI();
        saveGameState();
    }

    function scheduleRemoval(item, now) {
        if (!item || item._scheduledForRemoval) return;
        item._scheduledForRemoval = true;
        const body = item.body;
        if (body) {
            body.collisionFilterMask = 0;
            body.type = CANNON.Body.KINEMATIC;
            body.velocity.set(0, 0, 0);
            body.angularVelocity.set(0, 0, 0);
            body.updateMassProperties?.();
            body.wakeUp?.();
        }
        removalQueue.push({
            item,
            startedAt: now,
            removeAt: now + FINAL_FADE_MS
        });
    }

    function processRemovals(now) {
        if (!removalQueue.length) return;
        const pending = [];
        let removedAny = false;

        for (const entry of removalQueue) {
            const item = entry.item;
            if (!item) continue;
            const t = Math.min(1, Math.max(0, (now - entry.startedAt) / FINAL_FADE_MS));
            const scale = 1 - (0.96 * t);
            const opacity = 1 - t;
            if (item.mesh) {
                item.mesh.scale.setScalar(Math.max(0.04, scale));
                if (item.mesh.material) item.mesh.material.opacity = Math.max(0, opacity);
            }

            if (now < entry.removeAt) {
                pending.push(entry);
                continue;
            }

            applyItemRewards(item);
            world.removeBody(item.body);
            scene.remove(item.mesh);
            disposeMeshResources(item.mesh);
            const idx = items.indexOf(item);
            if (idx >= 0) items.splice(idx, 1);
            removedAny = true;
        }

        removalQueue = pending;
        if (removedAny && items.length === 0) levelComplete();
    }

    function finalizeFallenBuildings(now) {
        for (const item of items) {
            if (item._scheduledForRemoval || item.buildingId || !item._fallTriggered) continue;
            if (getItemTopY(item) < REMOVAL_Y_THRESHOLD) scheduleRemoval(item, now);
        }

        for (const id of Object.keys(buildingStates)) {
            const buildingId = Number(id);
            const state = buildingStates[buildingId];
            if (!state?.falling) continue;
            const parts = getPartsOfBuilding(buildingId);
            if (!parts.length) {
                delete buildingStates[buildingId];
                continue;
            }
            const allBelowThreshold = parts.every(part => getItemTopY(part) < REMOVAL_Y_THRESHOLD);
            if (!allBelowThreshold) continue;
            for (const part of parts) scheduleRemoval(part, now);
            delete buildingStates[buildingId];
        }
    }

    function createSnapshot(previewObj) {
        if (!previewObj) return null;
        try {
            const renderTarget = new THREE.WebGLRenderTarget(128, 128);
            const clone = previewObj.clone(true);
            clone.position.set(0, 0, 0);
            clone.rotation.set(0, 0, 0);
            snapScene.add(clone);

            const box = new THREE.Box3().setFromObject(clone);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z, 1.0);

            clone.position.sub(center);
            snapCamera.position.set(maxDim * 1.5, maxDim * 1.2, maxDim * 1.5);
            snapCamera.lookAt(0, 0, 0);

            const oldTarget = renderer.getRenderTarget();
            renderer.setRenderTarget(renderTarget);
            renderer.render(snapScene, snapCamera);

            const buffer = new Uint8Array(128 * 128 * 4);
            renderer.readRenderTargetPixels(renderTarget, 0, 0, 128, 128, buffer);
            renderer.setRenderTarget(oldTarget);

            const sCtx = snapCanvas.getContext('2d');
            const imgData = sCtx.createImageData(128, 128);
            for (let y = 0; y < 128; y++) {
                for (let x = 0; x < 128; x++) {
                    const srcIdx = ((127 - y) * 128 + x) * 4;
                    const dstIdx = (y * 128 + x) * 4;
                    imgData.data[dstIdx] = buffer[srcIdx];
                    imgData.data[dstIdx + 1] = buffer[srcIdx + 1];
                    imgData.data[dstIdx + 2] = buffer[srcIdx + 2];
                    imgData.data[dstIdx + 3] = buffer[srcIdx + 3];
                }
            }
            sCtx.putImageData(imgData, 0, 0);
            const dataUrl = snapCanvas.toDataURL();

            snapScene.remove(clone);
            renderTarget.dispose();
            return dataUrl;
        } catch (e) {
            console.warn("Snapshot fallback icon used:", e);
            return null;
        }
    }

    function isPointInPolygon(x, z, poly) {
        if (!poly || poly.length < 3) return true;
        let isInside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, zi = poly[i].y;
            const xj = poly[j].x, zj = poly[j].y;
            const intersect = ((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi);
            if (intersect) isInside = !isInside;
        }
        return isInside;
    }

    function getPolygonRadius(angle) {
        if (!polygon || polygon.length === 0) return WORLD_SIZE * 0.45;
        let a = (angle + Math.PI * 2) % (Math.PI * 2);
        const numPoints = polygon.length;
        const indexFloat = (a / (Math.PI * 2)) * numPoints;
        const i1 = Math.floor(indexFloat) % numPoints;
        const i2 = (i1 + 1) % numPoints;
        const t = indexFloat - Math.floor(indexFloat);
        const r1 = Math.sqrt(polygon[i1].x**2 + polygon[i1].y**2);
        const r2 = Math.sqrt(polygon[i2].x**2 + polygon[i2].y**2);
        return r1 * (1 - t) + r2 * t; 
    }

    function isRoadInside(x1, z1, x2, z2) {
        const mx = (x1 + x2) / 2, mz = (z1 + z2) / 2;
        const d1 = Math.sqrt(x1*x1 + z1*z1);
        const d2 = Math.sqrt(x2*x2 + z2*z2);
        const dm = Math.sqrt(mx*mx + mz*mz);
        
        const r1 = getPolygonRadius(Math.atan2(z1, x1));
        const r2 = getPolygonRadius(Math.atan2(z2, x2));
        const rm = getPolygonRadius(Math.atan2(mz, mx));
        
        if (r1 - d1 < 3.8 || r2 - d2 < 3.8 || rm - dm < 3.8) return false;
        return isPointInPolygon(x1, z1, polygon) && isPointInPolygon(x2, z2, polygon) && isPointInPolygon(mx, mz, polygon);
    }

    function startLevel(levelNum) {
        inMainMenu = false;

        WORLD_SIZE = Math.floor(Math.random() * 40) + 150;
        const AVG_RADIUS = WORLD_SIZE * 0.44;
        
        polygon = [];
        const numPoints = 60;
        const bumpA = Math.floor(Math.random()*5)+2;
        const bumpB = Math.floor(Math.random()*6)+4;
        
        for (let i = 0; i < numPoints; i++) {
            const angle = (i / numPoints) * Math.PI * 2; 
            const r = AVG_RADIUS + Math.sin(angle * bumpA) * 12 + Math.cos(angle * bumpB) * 8;
            polygon.push(new THREE.Vector2(Math.cos(angle) * r, Math.sin(angle) * r));
        }

        buildIslandAndWalls();
        buildRandomHoleTop();
        
        let startX = 0, startZ = 0;
        let attempts = 0;
        while (attempts++ < 500) {
            const testX = (Math.random() - 0.5) * WORLD_SIZE * 0.5;
            const testZ = (Math.random() - 0.5) * WORLD_SIZE * 0.5;
            const dist = Math.sqrt(testX**2 + testZ**2);
            if (isPointInPolygon(testX, testZ, polygon) && (getPolygonRadius(Math.atan2(testZ, testX)) - dist) > 14) {
                startX = testX;
                startZ = testZ;
                break;
            }
        }
        
        holeTarget.set(startX, 0, startZ);
        cameraTarget.set(startX, 0, startZ);
        groundUniforms.holePos.value.set(startX, 0, startZ);
        
        const aspect = window.innerWidth / window.innerHeight;
        const aspectMultiplier = aspect < 1.4 ? Math.min(2.6, 1.4 / Math.max(0.45, aspect)) : 1.0;
        camera.position.set(startX, (7 + 1.6 * 1.5) * aspectMultiplier, startZ + (8 + 1.6 * 2.5) * aspectMultiplier);
        camera.lookAt(cameraTarget);
        
        spawnCity(startX, startZ);
        generateObjectives();
        
        timeLeft = GAME_TIME;
        updateUI();
        saveGameState();

    function buildIslandAndWalls() {
        const shape = new THREE.Shape();
        shape.moveTo(polygon[0].x, -polygon[0].y); 
        for(let i=1; i<polygon.length; i++) shape.lineTo(polygon[i].x, -polygon[i].y);
        shape.lineTo(polygon[0].x, -polygon[0].y);

        const islandGeom = new THREE.ShapeGeometry(shape);
        islandGeom.rotateX(-Math.PI / 2); 
        islandGeom.computeVertexNormals();

        const islandMat = new THREE.MeshStandardMaterial({ color: 0x4aa651, roughness: 0.9 });
        applyHoleShader(islandMat);
        const islandMesh = new THREE.Mesh(islandGeom, islandMat);
        islandMesh.position.y = -0.01; 
        islandMesh.receiveShadow = true;
        scene.add(islandMesh);
        mapMeshes.push(islandMesh);

        const edgePath = new THREE.CurvePath();
        const wallThickness = 200; 

        for (let i = 0; i < polygon.length; i++) {
            const p1 = polygon[i], p2 = polygon[(i + 1) % polygon.length];
            edgePath.add(new THREE.LineCurve3(new THREE.Vector3(p1.x, 0, p1.y), new THREE.Vector3(p2.x, 0, p2.y)));
            
            const dx = p2.x - p1.x; const dy = p2.y - p1.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist <= 0.001) continue;
            
            const nx = dy / dist; const nz = -dx / dist;

            const wallShape = new CANNON.Box(new CANNON.Vec3(dist / 2, 100, wallThickness / 2));
            const wallBody = new CANNON.Body({ mass: 0, material: wallMat });
            wallBody.addShape(wallShape);
            
            wallBody.position.set((p1.x + p2.x) / 2 + (nx * wallThickness/2), 45, (p1.y + p2.y) / 2 + (nz * wallThickness/2));
            wallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -Math.atan2(dy, dx));
            
            wallBody.collisionFilterGroup = CG_GROUND;
            wallBody.collisionFilterMask = CG_ALL_OBJS;
            world.addBody(wallBody);
            wallBodies.push(wallBody);
        }
        
        const tubeGeom = new THREE.TubeGeometry(edgePath, 150, 0.8, 8, true);
        const tubeMat = new THREE.MeshStandardMaterial({ color: 0x3d8c43, roughness: 1 });
        applyHoleShader(tubeMat);
        const edgeMesh = new THREE.Mesh(tubeGeom, tubeMat);
        scene.add(edgeMesh);
        mapMeshes.push(edgeMesh);
    }

    function buildRandomHoleTop() {
        if (holeTopMesh) {
            holeGroup.remove(holeTopMesh);
            holeTopMesh.geometry?.dispose();
            holeTopMesh.material?.dispose();
        }
        const rColor = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
        const type = Math.floor(Math.random() * 3);
        let geom;
        if (type === 0) geom = new THREE.TorusGeometry(1, 0.08, 16, Math.floor(Math.random()*10 + 4));
        else if (type === 1) geom = new THREE.CylinderGeometry(1.05, 1.05, 0.1, 32);
        else geom = new THREE.TorusGeometry(1, 0.1, 6, 32); 
        
        const mat = new THREE.MeshStandardMaterial({ color: rColor, roughness: 0.2, metalness: 0.8 });
        holeTopMesh = new THREE.Mesh(geom, mat);
        if (type !== 1) holeTopMesh.rotation.x = -Math.PI / 2;
        holeTopMesh.position.y = 0.01;
        holeGroup.add(holeTopMesh);
    }

    const colors = [0xff5722, 0x4caf50, 0x2196f3, 0xffeb3b, 0x9c27b0, 0xffffff, 0x607d8b, 0x795548];

    function createSimpleEntity(x, y, z, w, h, d, color, visualType, rotY = 0, category = 'Block', buildingId = 0, blockIndex = 0, previewObj = null) {
        const meshGeom = visualType === 'cylinder' ? new THREE.CylinderGeometry(w/2, d/2, h, 16) : new THREE.BoxGeometry(w, h, d);
        const meshMat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, transparent: true, opacity: 1.0 });
        const mesh = new THREE.Mesh(meshGeom, meshMat);
        mesh.position.set(x, y, z);
        mesh.rotation.y = rotY;
        mesh.castShadow = mesh.receiveShadow = true;
        scene.add(mesh);

        const mass = Math.max(1, Math.floor(w * h * d * 5)); 
        totalWorldPoints += mass;
        
        const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));

        const body = new CANNON.Body({ 
            mass, 
            material: objMat, 
            position: new CANNON.Vec3(x, y, z), 
            linearDamping: 0.35, 
            angularDamping: 0.4 
        });
        body.quaternion.setFromEuler(0, rotY, 0);
        body.addShape(shape);
        body.collisionFilterGroup = CG_ALL_OBJS;
        body.collisionFilterMask = CG_GROUND | CG_ALL_OBJS; 
        world.addBody(body);
        body.sleep(); 
        mesh.userData.radius = Math.max(w, d)/2;

        items.push({ 
            mesh, 
            body, 
            radius: Math.max(w, d)/2, 
            initialY: y, 
            targetOpacity: 1.0, 
            mass, 
            cat: category, 
            color, 
            buildingId, 
            blockIndex, 
            previewObj: previewObj || mesh 
        });
    }

    function spawnBuildingStack(cx, cz, blocksData, color, category) {
        const buildingId = nextBuildingId++;
        const previewGroup = new THREE.Group();
        buildingMap[buildingId] = { totalBlocks: blocksData.length, eatenBlocks: 0, cat: category, color: color };

        blocksData.forEach((b, idx) => {
            const depth = b.d || b.w;
            const x = cx + (b.offsetX || 0);
            const y = b.y;
            const z = cz + (b.offsetZ || 0);
            const blockCol = b.color !== undefined ? b.color : color;
            
            const geom = b.type === 'cylinder' ? new THREE.CylinderGeometry(b.w/2, (b.d ? b.d/2 : b.w/2), b.h, 16) : new THREE.BoxGeometry(b.w, b.h, depth);
            const mat = new THREE.MeshStandardMaterial({ color: blockCol, roughness: 0.8 });
            const pMesh = new THREE.Mesh(geom, mat);
            pMesh.position.set(b.offsetX || 0, b.y, b.offsetZ || 0);
            pMesh.rotation.y = b.rotY || 0;
            previewGroup.add(pMesh);

            createSimpleEntity(x, y, z, b.w, b.h, depth, blockCol, b.type || 'box', b.rotY || 0, category, buildingId, idx, previewGroup);
        });
    }

            blocks.push({ y: cy + siloH/2, w: siloR, d: siloR, h: siloH, type: 'cylinder', offsetX: -offset, offsetZ: offset });

            blocks.push({ y: cy + 1.2, w: 0.35, h: 2.4, type: 'cylinder' });
        } else if (style === 14) {
            blocks.push({ y: cy + 1.1, w: 5.6, d: 5.6, h: 2.2, type: 'box' }); cy += 2.2;
            blocks.push({ y: cy + 1.5, w: 3.8, d: 3.8, h: 3.0, type: 'box' });

            blocks.push({ y: cy + 1.5, w: tR, d: tR, h: tH, type: 'cylinder', offsetX: tOff, offsetZ: tOff });

            blocks.push({ y: cy + 1.6, w: 0.35, h: 3.2, type: 'cylinder' });

        spawnBuildingStack(cx, cz, blocks, color, 'Skyscraper');

    // High-Density Non-Overlapping Urban Grid with Modular Blocks & Road Junctions
    function spawnCity(startX, startZ) {
        const downtowns = [];
        for(let i=0; i<6; i++) downtowns.push({ x: (Math.random()-0.5)*WORLD_SIZE*0.7, z: (Math.random()-0.5)*WORLD_SIZE*0.7 });

        // Perimeter fence
        const inset = 1.8; 
        for (let i = 0; i < polygon.length; i++) {
            const p1 = polygon[i], p2 = polygon[(i + 1) % polygon.length];
            const dx = p2.x - p1.x; const dy = p2.y - p1.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist <= 0.001) continue;
            
            const nx = -dy / dist; const nz = dx / dist;
            const count = Math.max(1, Math.floor(dist / 2.05));
            const angle = Math.atan2(dy, dx);
            
            for (let j = 0; j < count; j++) {
                const d = j * (dist/count) + ((dist/count) / 2);
                const fx = p1.x + Math.cos(angle)*d + (nx * inset);
                const fz = p1.y + Math.sin(angle)*d + (nz * inset);
                createSimpleEntity(fx, 0.6, fz, 2.0, 1.2, 0.4, 0x8b4513, 'box', -angle, 'Fence');
            }
        }

        const BLOCK_SIZE = 16;
        const ROAD_WIDTH = 4.5;
        const CELL_STEP = BLOCK_SIZE + ROAD_WIDTH;

        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.85 });
        applyHoleShader(sidewalkMat);

        const roadMat = new THREE.MeshStandardMaterial({ 
            map: roadTexture, 
            roughness: 0.7, 
            metalness: 0.1 
        });
        applyHoleShader(roadMat);

        const interMat = new THREE.MeshStandardMaterial({ 
            map: intersectionTexture, 
            roughness: 0.7, 
            metalness: 0.1 
        });
        applyHoleShader(interMat);

        // Spawn Disjoint Urban Road Grid & Sidewalk Blocks (Zero overlap)
        for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x += CELL_STEP) {
            for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z += CELL_STEP) {
                const cx = x + BLOCK_SIZE / 2;
                const cz = z + BLOCK_SIZE / 2;
                
                const halfB = BLOCK_SIZE / 2;
                const blockCorners = [
                    { x: cx - halfB, z: cz - halfB },
                    { x: cx + halfB, z: cz - halfB },
                    { x: cx - halfB, z: cz + halfB },
                    { x: cx + halfB, z: cz + halfB },
                    { x: cx, z: cz }
                ];
                
                let blockValid = true;
                for (const pt of blockCorners) {
                    const d = Math.sqrt(pt.x*pt.x + pt.z*pt.z);
                    const r = getPolygonRadius(Math.atan2(pt.z, pt.x));
                    if (r - d < 3.2 || !isPointInPolygon(pt.x, pt.z, polygon)) {
                        blockValid = false;
                        break;
                    }
                }
                if (!blockValid) continue;

                // 1. Concrete Sidewalk Block Curb (y = 0.04)
                const swGeom = new THREE.BoxGeometry(BLOCK_SIZE, 0.08, BLOCK_SIZE);
                const swMesh = new THREE.Mesh(swGeom, sidewalkMat);
                swMesh.position.set(cx, 0.04, cz);
                swMesh.receiveShadow = true;
                scene.add(swMesh);
                mapMeshes.push(swMesh);

                // 2. Non-Overlapping Straight Horizontal Road Segment (length = BLOCK_SIZE)
                const rz_pos = z - ROAD_WIDTH / 2;
                if (isRoadInside(x, rz_pos, x + BLOCK_SIZE, rz_pos)) {
                    const roadXGeom = new THREE.PlaneGeometry(BLOCK_SIZE, ROAD_WIDTH);
                    const roadXMesh = new THREE.Mesh(roadXGeom, roadMat);
                    roadXMesh.rotation.x = -Math.PI / 2;
                    roadXMesh.position.set(cx, 0.005, rz_pos);
                    roadXMesh.receiveShadow = true;
                    scene.add(roadXMesh);
                    mapMeshes.push(roadXMesh);
                }

                // 3. Non-Overlapping Straight Vertical Road Segment (length = BLOCK_SIZE)
                const rx_pos = x - ROAD_WIDTH / 2;
                if (isRoadInside(rx_pos, z, rx_pos, z + BLOCK_SIZE)) {
                    const roadZGeom = new THREE.PlaneGeometry(ROAD_WIDTH, BLOCK_SIZE);
                    const roadZMesh = new THREE.Mesh(roadZGeom, roadMat);
                    roadZMesh.rotation.x = -Math.PI / 2;
                    roadZMesh.position.set(rx_pos, 0.005, cz);
                    roadZMesh.receiveShadow = true;
                    scene.add(roadZMesh);
                    mapMeshes.push(roadZMesh);
                }

                // 4. Non-Overlapping Intersection Crosswalk Square Tile (size = ROAD_WIDTH x ROAD_WIDTH)
                if (isRoadInside(rx_pos, rz_pos, rx_pos, rz_pos)) {
                    const interGeom = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_WIDTH);
                    const interMesh = new THREE.Mesh(interGeom, interMat);
                    interMesh.rotation.x = -Math.PI / 2;
                    interMesh.position.set(rx_pos, 0.005, rz_pos);
                    interMesh.receiveShadow = true;
                    scene.add(interMesh);
                    mapMeshes.push(interMesh);
                }

                let minDistToDt = Infinity;
                downtowns.forEach(dt => { minDistToDt = Math.min(minDistToDt, Math.sqrt((cx - dt.x)**2 + (cz - dt.z)**2)); });
                const distToSpawn = Math.sqrt((cx - startX)**2 + (cz - startZ)**2);
                const color = colors[Math.floor(Math.random() * colors.length)];

                // Starter Spawn Zone
                if (distToSpawn < 15) {
                    createSimpleEntity(cx, 0.4, cz, 0.8, 0.8, 0.8, 0xffff00, 'box', 0, 'Small Box'); 
                    spawnTree(cx + 4, cz - 4);
                    spawnTree(cx - 4, cz + 4);
                    spawnBench(cx + 4, cz + 2, 0);
                    spawnHydrant(cx + 6, cz + 6);
                    spawnCar(cx - 6.2, cz - 4, 0x3498db, Math.PI / 2);
                    continue; 
                }

                // Downtown District (High-Density Multi-Tower Clusters)
                if (minDistToDt < 24) {
                    let layout = Math.random();
                    if (layout > 0.4) {
                        buildSkyscraper(cx, cz, color, Math.floor(Math.random() * 15));
                    } else {
                        buildSkyscraper(cx - 3.2, cz, color, Math.floor(Math.random() * 15));
                        buildSkyscraper(cx + 3.2, cz, colors[(colors.indexOf(color)+3)%colors.length], Math.floor(Math.random() * 15));
                    }
                    
                    spawnStreetlight(cx + 6.8, cz + 6.8, 0);
                    spawnStreetlight(cx - 6.8, cz - 6.8, Math.PI);
                    if (Math.random() > 0.25) spawnCar(cx + 6.8, cz - 2.5, 0xffeb3b, Math.PI / 2);
                    if (Math.random() > 0.35) spawnCar(cx - 6.8, cz + 2.5, 0xe74c3c, Math.PI / 2);
                    if (Math.random() > 0.45) spawnHydrant(cx + 6.8, cz - 6.8);
                } 
                // Commercial / Mid-Rise District
                else if (minDistToDt < 46) {
                    let oLayout = Math.random();
                    if (oLayout > 0.45) {
                        spawnBuildingStack(cx - 3.2, cz, [
                            { y: 1.5, w: 3.2, h: 3.0, type: 'box' },
                            { y: 3.6, w: 2.2, h: 1.2, type: 'cylinder' },
                            { y: 4.5, w: 0.3, h: 1.0, type: 'cylinder' }
                        ], color, 'Office Building');

                        spawnBuildingStack(cx + 3.2, cz, [
                            { y: 1.3, w: 3.0, d: 3.0, h: 2.6, type: 'box' },
                            { y: 1.3, w: 1.6, d: 1.6, h: 2.6, type: 'cylinder', offsetX: 2.35 },
                            { y: 3.1, w: 2.4, d: 2.4, h: 1.0, type: 'box' }
                        ], colors[(colors.indexOf(color)+2)%colors.length], 'Office Building');
                    } else {
                        spawnBuildingStack(cx, cz, [
                            { y: 1.2, w: 2.0, d: 2.0, h: 2.4, type: 'cylinder', offsetX: -1.75 },
                            { y: 1.2, w: 2.0, d: 2.0, h: 2.4, type: 'cylinder', offsetX: 1.75 },
                            { y: 1.2, w: 1.4, d: 1.6, h: 2.0, type: 'box' },
                            { y: 2.8, w: 4.6, d: 2.4, h: 0.8, type: 'box' }
                        ], color, 'Office Building');
                    }
                    spawnTree(cx - 6.0, cz - 6.0);
                    spawnTree(cx + 6.0, cz + 6.0);
                    spawnBench(cx - 6.0, cz + 3, Math.PI / 2);
                    spawnCar(cx + 6.8, cz, 0x2ecc71, Math.PI / 2);
                } 
                // Residential / Suburban District
                else {
                    let isPark = Math.random() > 0.85;
                    if (isPark) {
                        spawnTree(cx - 4, cz - 4);
                        spawnTree(cx + 4, cz - 4);
                        spawnTree(cx - 4, cz + 4);
                        spawnTree(cx + 4, cz + 4);
                        spawnBench(cx, cz - 3, 0);
                        spawnBench(cx, cz + 3, Math.PI);
                        createSimpleEntity(cx, 0.6, cz, 1.4, 1.2, 1.4, 0x95a5a6, 'cylinder', 0, 'Small Box');
                    } else {
                        spawnBuildingStack(cx - 3.2, cz - 3.2, [
                            { y: 1.0, w: 2.2, h: 2.0, type: 'box' },
                            { y: 2.5, w: 1.6, h: 1.0, type: 'box' }
                        ], color, 'House');

                        spawnBuildingStack(cx + 3.2, cz + 3.2, [
                            { y: 1.0, w: 2.2, h: 2.0, type: 'box' },
                            { y: 2.5, w: 1.6, h: 1.0, type: 'box' }
                        ], colors[(colors.indexOf(color)+1)%colors.length], 'House');

                        if (Math.random() > 0.3) {
                            spawnBuildingStack(cx - 3.2, cz + 3.2, [
                                { y: 0.9, w: 2.2, d: 2.0, h: 1.8, type: 'box' },
                                { y: 0.9, w: 1.4, d: 1.4, h: 1.8, type: 'cylinder', offsetX: 1.85 },
                                { y: 2.2, w: 1.8, d: 1.6, h: 0.8, type: 'box' }
                            ], colors[(colors.indexOf(color)+3)%colors.length], 'House');
                        }

                        if (Math.random() > 0.4) {
                            spawnBuildingStack(cx + 3.2, cz - 3.2, [
                                { y: 0.9, w: 2.0, h: 1.8, type: 'cylinder' },
                                { y: 1.9, w: 1.4, h: 0.8, type: 'box' },
                                { y: 2.5, w: 0.3, h: 0.8, type: 'cylinder' }
                            ], colors[(colors.indexOf(color)+4)%colors.length], 'House');
                        }

                        spawnTree(cx - 6.5, cz + 6.5);
                        spawnCar(cx + 6.8, cz - 2, 0x9b59b6, Math.PI / 2);
                        spawnStreetlight(cx - 6.8, cz - 6.8, 0);
                    }
                }
            }
        }
    }

    function generateObjectives() {
        const percent = difficultyConfig.min + Math.random() * (difficultyConfig.max - difficultyConfig.min);
        const targetScore = Math.floor(totalWorldPoints * percent);
        
        objectives = [{
            id: 0, desc: `Score ${targetScore} pts (${difficultyConfig.name})`,
            target: targetScore, current: 0, achieved: false, failed: false, cat: 'Score', timeLimit: null, thumb: null
        }];

        const groups = {};
        items.forEach(it => {
            if(it.cat === 'Fence' || it.cat === 'Small Box' || it.cat === 'Bush') return; 
            const key = it.cat + '_' + it.color;
            if(!groups[key]) {
                groups[key] = { 
                    count: 0, 
                    cat: it.cat, 
                    color: it.color, 
                    previewObj: it.previewObj,
                    buildingIds: new Set()
                };
            }
            groups[key].count++;
            if (it.buildingId) groups[key].buildingIds.add(it.buildingId);
        });

        const validGroups = Object.values(groups).filter(g => g.count >= 2).sort(() => 0.5 - Math.random());

        for (let i = 1; i <= 2; i++) {
            if (validGroups.length > 0) {
                const group = validGroups.pop();
                const hasBuildings = group.buildingIds.size > 0;
                let reqCount, desc, targetType;

                if (hasBuildings) {
                    targetType = 'building';
                    reqCount = Math.min(group.buildingIds.size, Math.floor(Math.random() * 2) + 1);
                    desc = `Eat ${reqCount} ${group.cat}${reqCount > 1 ? 's' : ''}`;
                } else {
                    targetType = 'block';
                    reqCount = Math.min(group.count, Math.floor(Math.random() * 5) + 2);
                    desc = `Eat ${reqCount} ${group.cat}${reqCount > 1 ? 's' : ''}`;
                }

                let hasTimeLimit = Math.random() > 0.5;
                let limit = null;
                if (hasTimeLimit) {
                    let minTime = hasBuildings ? 45 : 30;
                    limit = minTime + Math.floor(Math.random() * 30);
                    if (limit > GAME_TIME - 15) limit = null; 
                }

                if (limit) desc += ` in first ${limit}s`;

                objectives.push({
                    id: i, 
                    desc, 
                    target: reqCount, 
                    current: 0, 
                    achieved: false, 
                    failed: false,
                    cat: group.cat, 
                    color: group.color, 
                    targetType, 
                    timeLimit: limit, 
                    thumb: createSnapshot(group.previewObj)
                });
            } else {
                objectives.push({
                    id: i, desc: "Survive", target: 1, current: 1, achieved: true, failed: false, cat: 'Survive', timeLimit: null, thumb: null
                });
            }
        }
    }

    function checkItemObjective(item) {
        let buildingFullyEaten = false;
        if (item.buildingId && buildingMap[item.buildingId]) {
            buildingMap[item.buildingId].eatenBlocks++;
            if (buildingMap[item.buildingId].eatenBlocks >= buildingMap[item.buildingId].totalBlocks) {
                buildingFullyEaten = true;
            }
        }

        objectives.forEach(obj => {
            if (obj.id > 0 && !obj.achieved && !obj.failed && obj.cat === item.cat && obj.color === item.color) {
                if (obj.targetType === 'building') {
                    if (buildingFullyEaten) {
                        obj.current++;
                        if (obj.current >= obj.target) {
                            obj.achieved = true;
                            document.getElementById(`ui-star-${obj.id}`).classList.add('achieved');
                        }
                    }
                } else {
                    obj.current++;
                    if (obj.current >= obj.target) {
                        obj.achieved = true;
                        document.getElementById(`ui-star-${obj.id}`).classList.add('achieved');
                    }
                }
                if (isPaused) populateObjectiveModal(); 
            }
        });
    }

    let lastPointerType = 'mouse';

    let inputVelocity = new THREE.Vector2(0, 0);

    let dragStart = new THREE.Vector2();
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');

    window.addEventListener('pointerdown', (e) => {
        lastPointerType = e.pointerType;
        if(e.pointerType === 'mouse' || inMainMenu) return; 
        
        if(isPaused || e.target.tagName === 'BUTTON' || e.target.closest('#stars-container') || e.target.tagName === 'INPUT') return;
        isDragging = true;
        dragStart.set(e.clientX, e.clientY);
        inputVelocity.set(0, 0);
        joystickBase.style.display = 'block';
        joystickBase.style.left = e.clientX + 'px';
        joystickBase.style.top = e.clientY + 'px';
        joystickKnob.style.transform = `translate(-50%, -50%)`;
    });

    window.addEventListener('pointermove', (e) => {
        lastPointerType = e.pointerType;
        if (inMainMenu) return;
        if(e.pointerType === 'mouse') {
            const nx = (e.clientX / window.innerWidth) * 2 - 1;
            const ny = (e.clientY / window.innerHeight) * 2 - 1;
            const dist = Math.sqrt(nx * nx + ny * ny);
            const deadzone = 0.05;
            
            if (dist < deadzone) {
                mouseDir.set(0, 0);
            } else {
                const strength = Math.min(1.0, (dist - deadzone) / 0.7);
                mouseDir.set((nx / dist) * strength, (ny / dist) * strength);
            }
        } else {
            if(!isDragging || isPaused) return;
            let dx = e.clientX - dragStart.x;
            let dy = e.clientY - dragStart.y;
            
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxDist = 55;
            if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            inputVelocity.x = dx / maxDist; 
            inputVelocity.y = dy / maxDist;
        }
    });

        if (e.pointerType === 'mouse') return;
        isDragging = false;

    function animate() {
        requestAnimationFrame(animate);

        // Smooth 3D background camera orbit while on Main Menu
        if (inMainMenu) {
            menuOrbitAngle += 0.003;
            const aspect = window.innerWidth / window.innerHeight;
            const aspectMultiplier = aspect < 1.4 ? Math.min(2.6, 1.4 / Math.max(0.45, aspect)) : 1.0;
            const camR = 40 * aspectMultiplier;
            camera.position.set(Math.cos(menuOrbitAngle) * camR, 25 * aspectMultiplier, Math.sin(menuOrbitAngle) * camR);
            camera.lookAt(0, 5, 0);
            renderer.render(scene, camera);
            return;
        }

        if (!gameActive || isPaused) { 
            renderer.render(scene, camera); 
            return; 
        }

        const time = performance.now() / 1000;
        const dt = Math.min(time - lastCallTime, 0.1); 
        lastCallTime = time;

        timeLeft -= dt;
        const mins = Math.floor(Math.max(0, timeLeft) / 60); 
        const secs = Math.floor(Math.max(0, timeLeft) % 60);
        document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        autoSaveTimer += dt;
        if (autoSaveTimer >= 1.5) {
            autoSaveTimer = 0;
            saveGameState();
        }

        let elapsed = GAME_TIME - timeLeft;
        objectives.forEach(obj => {
            if (obj.timeLimit && !obj.achieved && !obj.failed && elapsed >= obj.timeLimit) { 
                obj.failed = true; 
                document.getElementById(`ui-star-${obj.id}`).classList.add('failed'); 
            }
        });
        if (timeLeft <= 0) {
            levelComplete();
            return;
        }

        // Smooth 2-Second Hole Growth Animation
        if (Math.abs(holeRadius - targetHoleRadius) > 0.001) {
            holeRadius += (targetHoleRadius - holeRadius) * (1 - Math.exp(-2.2 * dt));
            updateHoleVisuals(holeRadius);
        } else {
            holeRadius = targetHoleRadius;
        }

        if (holeTopMesh) holeTopMesh.rotation.z += 0.02;

        let currentMode = 'mouse';
        if (activeKeys.size > 0) currentMode = 'keyboard';
        else if (lastPointerType !== 'mouse' && isDragging) currentMode = 'touch';
        else if (lastPointerType !== 'mouse' && !isDragging) currentMode = 'touch-inertia';

        const baseSpeed = (20 + holeRadius * 2);

        if (currentMode === 'keyboard') {
            let kx = 0, ky = 0;
            if(activeKeys.has('arrowup') || activeKeys.has('w')) ky -= 1;
            if(activeKeys.has('arrowdown') || activeKeys.has('s')) ky += 1;
            if(activeKeys.has('arrowleft') || activeKeys.has('a')) kx -= 1;
            if(activeKeys.has('arrowright') || activeKeys.has('d')) kx += 1;
            
            let vec = new THREE.Vector2(kx, ky);
            if(vec.lengthSq() > 0) vec.normalize();
            
            const kSpeed = baseSpeed * (keySpeed / 20);
            holeTarget.x += vec.x * kSpeed * dt;
            holeTarget.z += vec.y * kSpeed * dt;
            
        } else if (currentMode === 'touch' || currentMode === 'touch-inertia') {
            if (currentMode === 'touch-inertia') {
                const glideFriction = Math.exp(-2.8 * dt);
                inputVelocity.multiplyScalar(glideFriction);
                if (inputVelocity.lengthSq() < 0.0001) inputVelocity.set(0, 0);
            }

            const tSpeed = baseSpeed * (touchSpeed / 20);
            holeTarget.x += inputVelocity.x * tSpeed * dt;
            holeTarget.z += inputVelocity.y * tSpeed * dt;

        } else if (currentMode === 'mouse') {
            const mSpeed = baseSpeed * (mouseSpeed / 20);
            holeTarget.x += mouseDir.x * mSpeed * dt;
            holeTarget.z += mouseDir.y * mSpeed * dt;
        }

        const targetAngle = Math.atan2(holeTarget.z, holeTarget.x);
        const maxHoleR = getPolygonRadius(targetAngle) - holeRadius;
        const currentHoleR = Math.sqrt(holeTarget.x**2 + holeTarget.z**2);
        
        if (currentHoleR > maxHoleR && maxHoleR > 0) {
            holeTarget.x = (holeTarget.x / currentHoleR) * maxHoleR;
            holeTarget.z = (holeTarget.z / currentHoleR) * maxHoleR;
            inputVelocity.set(0, 0); 
        }

        holeGroup.position.copy(holeTarget);
        groundUniforms.holePos.value.copy(holeTarget);

        // Buildings only start falling once their whole-building COM projection enters the hole.
        const visitedBuildingIds = new Set();
        for (const item of items) {
            if (!item.buildingId || item._scheduledForRemoval || visitedBuildingIds.has(item.buildingId)) continue;
            visitedBuildingIds.add(item.buildingId);
            if (buildingStates[item.buildingId]?.falling) continue;
            const com = computeBuildingCOM(item.buildingId);
            if (!com) continue;
            const dx = com.x - holeTarget.x;
            const dz = com.z - holeTarget.z;
            if ((dx * dx + dz * dz) <= ((holeRadius * HOLE_COM_MARGIN) ** 2)) {
                startBuildingFall(item.buildingId);
            }
        }

        const aspect = window.innerWidth / window.innerHeight;
        const aspectMultiplier = aspect < 1.4 ? Math.min(2.6, 1.4 / Math.max(0.45, aspect)) : 1.0;

        const camDist = (8 + (holeRadius * 2.5)) * aspectMultiplier; 
        const camHeight = (7 + (holeRadius * 1.5)) * aspectMultiplier;
        camera.position.lerp(new THREE.Vector3(holeTarget.x, camHeight, holeTarget.z + camDist), 0.08);
        
        cameraTarget.lerp(holeTarget, 0.15);
        camera.lookAt(cameraTarget);
        
        scene.fog.near = camDist + 5; 
        scene.fog.far = camDist + (75 + (holeRadius * 8)) * aspectMultiplier;

        world.step(timeStep, dt, 3);
        const nowMs = performance.now();
        finalizeFallenBuildings(nowMs);
        processRemovals(nowMs);
        
        _camToHole.subVectors(holeTarget, camera.position);
        const distToHole = _camToHole.length();
        _camToHole.normalize();

        const occludedBuildingIds = new Set();
        const occludedSingleItems = new Set();

        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            _camToItem.subVectors(item.mesh.position, camera.position);
            const distToItem = _camToItem.length();
            _camToItem.normalize();
            
            const blockingAngle = Math.min(0.35, 0.06 + (item.radius / Math.max(1, distToItem)));
            const isBetween = distToItem < distToHole - 3 && item.body.position.y > 0.1;
            
            if (isBetween && _camToHole.angleTo(_camToItem) < blockingAngle) {
                if (item.buildingId) {
                    occludedBuildingIds.add(item.buildingId);
                } else {
                    occludedSingleItems.add(item);
                }
            }
        }

        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            if (item._scheduledForRemoval) continue;
            
            // Exponential Vertical Velocity Suppression & Jump Height Ceiling
            if (item.body.velocity.y > 0) {
                const vy = item.body.velocity.y;
                const decay = Math.exp(-6.0 * vy * dt);
                item.body.velocity.y = Math.min(vy * decay, 1.2);
            }

            const maxJumpThreshold = 0.5;
            if (item.body.position.y > item.initialY + maxJumpThreshold) {
                item.body.position.y = item.initialY + maxJumpThreshold;
                if (item.body.velocity.y > 0) item.body.velocity.y = 0;
            }

            const dx = item.body.position.x - holeTarget.x; 
            const dz = item.body.position.z - holeTarget.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            // Island containment
            if (!item._fallTriggered && item.body.position.y > -2.0) {
                const itemAngle = Math.atan2(item.body.position.z, item.body.position.x);
                const maxIslandR = getPolygonRadius(itemAngle) - 0.5; 
                const itemDist = Math.sqrt(item.body.position.x**2 + item.body.position.z**2);
                
                if (itemDist > maxIslandR && maxIslandR > 0) {
                    item.body.position.x = (item.body.position.x / itemDist) * maxIslandR;
                    item.body.position.z = (item.body.position.z / itemDist) * maxIslandR;
                    item.body.velocity.set(0, item.body.velocity.y, 0); 
                    item.body.angularVelocity.set(0, 0, 0);
                }
            }
            
            item.mesh.position.copy(item.body.position); 
            item.mesh.quaternion.copy(item.body.quaternion);

            // Unified X-Ray
            const isObstructing = (item.buildingId && occludedBuildingIds.has(item.buildingId)) || occludedSingleItems.has(item);
            item.targetOpacity = isObstructing ? 0.2 : 1.0;

            if (Math.abs(item.mesh.material.opacity - item.targetOpacity) > 0.01) {
                item.mesh.material.opacity += (item.targetOpacity - item.mesh.material.opacity) * 0.18;
            }

            // Pure Void Ingestion: Dropping objects lose ground support without any rim collision
            const buildingFalling = item.buildingId ? !!buildingStates[item.buildingId]?.falling : false;
            const overHole = dist < holeRadius;
            const shouldVoidFall = buildingFalling || (!item.buildingId && overHole);
            if (shouldVoidFall) {
                item._fallTriggered = true;
                if (item.body.collisionFilterMask !== maskVoidFall) {
                    item.body.collisionFilterMask = maskVoidFall;
                    item.body.wakeUp();
                }
            } else if (!item.buildingId && item.body.position.y > -0.2 && item.body.collisionFilterMask !== maskGroundOnly) {
                item.body.collisionFilterMask = maskGroundOnly;
            }
        }
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; 
        camera.updateProjectionMatrix(); 
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Startup Execution
    loadSettings();
    
    // Spawn background preview cityscape for the Main Menu
    if (!loadGameState()) {
        currentLevel = 1;
        difficultyConfig = getDifficultyConfig(1);
        GAME_TIME = difficultyConfig.time;
        clearLevel();
        
        WORLD_SIZE = 160;
        const AVG_RADIUS = WORLD_SIZE * 0.44;
        polygon = [];
        for (let i = 0; i < 60; i++) {
            const angle = (i / 60) * Math.PI * 2; 
            const r = AVG_RADIUS + Math.sin(angle * 3) * 12 + Math.cos(angle * 5) * 8;
            polygon.push(new THREE.Vector2(Math.cos(angle) * r, Math.sin(angle) * r));
        }
        buildIslandAndWalls();
        buildRandomHoleTop();
        spawnCity(0, 0);
        generateObjectives();
        updateUI();
    }
    
    // Show Main Menu on launch
    inMainMenu = true;
    gameActive = false;
    isPaused = true;
    document.getElementById('main-menu-modal').style.display = 'flex';
    refreshMainMenuUI();

    window.__holeioBooted = true;
    animate();
</script>
</body>
</html>
