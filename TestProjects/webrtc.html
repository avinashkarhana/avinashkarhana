<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global WebRTC Mobile</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --primary: #34c759; --danger: #ff3b30; --blue: #007aff; --text: #fff; --gray: #2c2c2e; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* Top Bar */
        .top-info { width: 100%; max-width: 400px; background: #222; padding: 10px; border-radius: 0 0 15px 15px; border: 1px solid #333; text-align: center; }
        #status-bar { font-size: 10px; color: #ffc107; text-transform: uppercase; letter-spacing: 1px; }
        .url-link { color: var(--blue); font-size: 12px; text-decoration: underline; cursor: pointer; display: block; margin-top: 5px; }

        /* Phone Shell */
        .phone-shell { width: 100%; max-width: 400px; height: 82vh; background: var(--card); margin-top: 10px; position: relative; display: flex; flex-direction: column; border-radius: 40px; border: 6px solid #333; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .view { display: none; flex-direction: column; height: 100%; padding: 30px; }
        .view.active { display: flex; }

        /* Dialer Screen */
        .number-container { text-align: center; margin: 30px 0; position: relative; }
        .my-num { font-size: 45px; font-weight: bold; color: var(--primary); display: block; }
        .refresh-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 12px; text-decoration: underline; }
        
        .dial-pad { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        input { background: transparent; border: none; color: white; font-size: 50px; text-align: center; outline: none; width: 100%; }

        /* Call Screen */
        .video-box { flex-grow: 1; position: relative; background: #000; border-radius: 20px; overflow: hidden; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 15px; right: 15px; width: 90px; height: 130px; border-radius: 12px; border: 1px solid #444; object-fit: cover; z-index: 10; background: #222; }

        /* Controls */
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 25px 0; }
        .btn { border: none; border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; color: white; background: var(--gray); }
        .btn.call { background: var(--primary); width: 75px; height: 75px; grid-column: span 4; margin: 0 auto; border-radius: 50%; font-size: 35px; }
        .btn.hangup { background: var(--danger); }
        .btn.active { background: white; color: black; }

        .incoming-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }

        @media (max-width: 480px) { .phone-shell { height: 100vh; border: none; border-radius: 0; margin: 0; } }
    </style>
</head>
<body>

    <div class="top-info">
        <div id="status-bar">System Initializing...</div>
        <span class="url-link" onclick="copyUrl()">Click to Copy Invite Link</span>
    </div>

    <div class="phone-shell">
        <!-- DIALER VIEW -->
        <div id="view-dialer" class="view active">
            <div style="font-size: 12px; color: #888; text-align: center;">YOUR NUMBER</div>
            <div class="number-container">
                <div class="my-num" id="my-num-display">....</div>
                <button class="refresh-btn" onclick="resetNumber()">↻ Change Number</button>
            </div>
            
            <div class="dial-pad">
                <input type="number" id="target-id" placeholder="0000">
                <p style="text-align: center; color: #555;">Enter recipient number</p>
            </div>
            <button class="btn call" id="btn-call">📞</button>
        </div>

        <!-- CALL VIEW -->
        <div id="view-call" class="view">
            <div class="video-box">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="controls">
                <button class="btn active" id="toggle-mic">🎤</button>
                <button class="btn active" id="toggle-cam">📷</button>
                <button class="btn" style="background:var(--blue)" id="toggle-screen">📺</button>
                <button class="btn hangup" id="btn-hangup">📵</button>
            </div>
        </div>

        <!-- INCOMING OVERLAY -->
        <div id="incoming-overlay" class="incoming-ui">
            <h2 id="caller-name">Incoming Call...</h2>
            <div style="display:flex; gap: 40px; margin-top: 30px;">
                <button class="btn hangup" onclick="location.reload()">✕</button>
                <button class="btn active" style="background:var(--primary); width:70px; height:70px;" onclick="answerCall()">✔</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Persistent Number Logic
        let formattedId = localStorage.getItem('webRTC_Number');

        if (!formattedId) {
            const myId = Math.floor(Math.random() * 1000) + 1;
            formattedId = myId.toString().padStart(4, '0');
            localStorage.setItem('webRTC_Number', formattedId);
        }

        document.getElementById('my-num-display').innerText = formattedId;

        function resetNumber() {
            if(confirm("Change your mobile number?")) {
                localStorage.removeItem('webRTC_Number');
                location.reload();
            }
        }

        function copyUrl() {
            navigator.clipboard.writeText(window.location.href);
            alert("URL Copied!");
        }

        const status = document.getElementById('status-bar');

        // 2. PeerJS with STUN + TURN (Open Relay)
        const peer = new Peer('MB-' + formattedId, {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:openrelay.metered.ca:80' },
                    {
                    	url: 'turn:192.158.29.39:3478?transport=udp',
                    	credential: 'JZEOEt2V3Qb0y27GRntt2u2PAYA=',
                    	username: '28224511:1379330808'
                    },
                    {
                    	url: 'turn:192.158.29.39:3478?transport=tcp',
                    	credential: 'JZEOEt2V3Qb0y27GRntt2u2PAYA=',
                    	username: '28224511:1379330808'
                    }
                ]
            }
        });

        let localStream;
        let currentCall;

        peer.on('open', () => status.innerText = "Online & Ready");
        peer.on('error', (err) => status.innerText = "Network Error: " + err.type);

        // 3. Handle Incoming
        peer.on('call', (call) => {
            currentCall = call;
            document.getElementById('caller-name').innerText = "Call from " + call.peer.replace('MB-', '');
            document.getElementById('incoming-overlay').style.display = 'flex';
        });

        async function answerCall() {
            document.getElementById('incoming-overlay').style.display = 'none';
            switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            currentCall.answer(localStream);
            bindCallEvents(currentCall);
        }

        // 4. Handle Outgoing
        document.getElementById('btn-call').onclick = async () => {
            const target = document.getElementById('target-id').value;
            if (!target) return alert("Enter number");
            switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            const call = peer.call('MB-' + target.padStart(4, '0'), localStream);
            bindCallEvents(call);
        };

        function bindCallEvents(call) {
            currentCall = call;
            status.innerText = "Connecting...";

            call.on('stream', (remStream) => {
                status.innerText = "Call Active";
                document.getElementById('remote-video').srcObject = remStream;
            });

            call.peerConnection.oniceconnectionstatechange = () => {
                status.innerText = "ICE: " + call.peerConnection.iceConnectionState;
            };
        }

        // 5. Toggles
        document.getElementById('toggle-mic').onclick = (e) => {
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            e.currentTarget.classList.toggle('active', track.enabled);
        };

        document.getElementById('toggle-cam').onclick = (e) => {
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            e.currentTarget.classList.toggle('active', track.enabled);
        };

        document.getElementById('toggle-screen').onclick = async () => {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenTrack = screenStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                sender.replaceTrack(screenTrack);
                document.getElementById('local-video').srcObject = screenStream;

                screenTrack.onended = () => {
                    sender.replaceTrack(localStream.getVideoTracks()[0]);
                    document.getElementById('local-video').srcObject = localStream;
                };
            } catch (e) { console.error(e); }
        };

        document.getElementById('btn-hangup').onclick = () => {
            location.reload(); // Number is saved in localStorage, so it won't change
        };

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
