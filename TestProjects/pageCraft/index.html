<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Fallback redirect if JavaScript is disabled (0 = immediate) -->
  <meta http-equiv="refresh" content="0; url=./out/index.html">
  <title>Redirecting...</title>
  <script>
    // Immediate redirect that prevents the user from getting stuck on the back button
    window.location.replace("./out/index.html");
  </script>
</head>
<body>
  <p>If you are not redirected automatically, <a href="./out/index.html">click here</a>.</p>
</body>
</html>
