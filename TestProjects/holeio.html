<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Hole.io Clone - Reinforced Boundary</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box; color: white;
        }
        .stats { display: flex; justify-content: space-between; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #timer { color: #ffeb3b; }
        #settings-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 30px; border-radius: 15px;
            pointer-events: all; display: none; flex-direction: column; gap: 15px; color: white; border: 1px solid #444;
        }
        .slider-row { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
        button { cursor: pointer; padding: 10px; background: #3498db; border: none; color: white; border-radius: 5px; font-weight: bold; }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 100;
        }
    </style>
</head>
<body>

<div id="ui-overlay">
    <div class="stats">
        <div id="score">SIZE: 1.6m</div>
        <div id="timer">02:00</div>
    </div>
    <div style="text-align: center; opacity: 0.6;">Eat props & buildings to grow! (Hold Mouse to Move)</div>
</div>

<div id="settings-panel">
    <h2>Settings</h2>
    <div class="slider-row"><label>Sensitivity</label><input type="range" id="sens" min="5" max="50" value="20"></div>
    <button onclick="toggleSettings()">Resume</button>
</div>

<div id="game-over">
    <h1 id="final-status">TIME'S UP!</h1>
    <p id="final-score">Final Size: 0m</p>
    <button onclick="location.reload()">Play Again</button>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    // --- Configuration ---
    const GAME_TIME = 120;
    const WORLD_SIZE = 140;
    const AVG_RADIUS = WORLD_SIZE * 0.45;
    let holeRadius = 1.6;
    let sensitivity = 0.02;
    let timeLeft = GAME_TIME;
    let gameActive = true;
    let scoreMultiplier = 1.6;

    // Organic Coastline Math
    const polygon = [];
    const numPoints = 50;
    for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const r = AVG_RADIUS + Math.sin(angle * 4) * 12 + Math.cos(angle * 7) * 8;
        polygon.push(new THREE.Vector2(Math.cos(angle) * r, Math.sin(angle) * r));
    }

    function isPointInPolygon(x, z, poly) {
        let isInside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, zi = poly[i].y;
            const xj = poly[j].x, zj = poly[j].y;
            const intersect = ((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi);
            if (intersect) isInside = !isInside;
        }
        return isInside;
    }

    function getIslandRadius(angle) {
        return AVG_RADIUS + Math.sin(angle * 4) * 12 + Math.cos(angle * 7) * 8;
    }

    // --- Random Starting Position (In a Park) ---
    let startX = 0, startZ = 0;
    while(true) {
        startX = (Math.random() - 0.5) * WORLD_SIZE * 0.6;
        startZ = (Math.random() - 0.5) * WORLD_SIZE * 0.6;
        const angle = Math.atan2(startZ, startX);
        const distToEdge = getIslandRadius(angle) - Math.sqrt(startX**2 + startZ**2);
        if (isPointInPolygon(startX, startZ, polygon) && distToEdge > 20) break; 
    }

    // --- Physics Setup (Cannon.js) ---
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -30, 0) });
    world.allowSleep = true;
    world.solver.iterations = 60;
    world.solver.tolerance = 0.001;

    const CG_GROUND = 1, CG_HOLE_RIM = 2, CG_ALL_OBJS = 4;
    const staticMat = new CANNON.Material();
    const objMat = new CANNON.Material();
    const rimMat = new CANNON.Material();
    const wallMat = new CANNON.Material(); // ULTRA-DEAD WALL MATERIAL

    world.addContactMaterial(new CANNON.ContactMaterial(staticMat, objMat, { friction: 0.7, restitution: 0.0 }));
    world.addContactMaterial(new CANNON.ContactMaterial(objMat, objMat, { friction: 0.5, restitution: 0.0 }));
    world.addContactMaterial(new CANNON.ContactMaterial(rimMat, objMat, { friction: 0.0, restitution: 0.0, contactEquationStiffness: 1e6 }));
    world.addContactMaterial(new CANNON.ContactMaterial(wallMat, objMat, { friction: 0.1, restitution: 0.0, contactEquationStiffness: 5e5 }));

    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: staticMat });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    groundBody.collisionFilterGroup = CG_GROUND;
    groundBody.collisionFilterMask = CG_ALL_OBJS; 
    world.addBody(groundBody);

    // --- 12-METER THICK REINFORCED INVISIBLE WALLS (FLUSH TO EDGE) ---
    for (let i = 0; i < polygon.length; i++) {
        const p1 = polygon[i];
        const p2 = polygon[(i + 1) % polygon.length];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const midX = (p1.x + p2.x) / 2;
        const midZ = (p1.y + p2.y) / 2;
        
        // Outward normal computation
        let nx = -dy / dist;
        let nz = dx / dist;
        if (nx * midX + nz * midZ < 0) {
            nx = -nx;
            nz = -nz;
        }

        const thickness = 12.0; // 12-meter thick buffer prevents any high-speed tunneling
        const height = 100.0;
        
        const wallShape = new CANNON.Box(new CANNON.Vec3(dist / 2, height / 2, thickness / 2));
        const wallBody = new CANNON.Body({ mass: 0, material: wallMat });

        // Position center so inner face is flush against the edge line
        const pushOut = thickness / 2; 
        wallBody.addShape(wallShape);
        wallBody.position.set(midX + nx * pushOut, height / 2 - 5, midZ + nz * pushOut);
        
        const angle = Math.atan2(dy, dx);
        wallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -angle);

        wallBody.collisionFilterGroup = CG_GROUND;
        wallBody.collisionFilterMask = CG_ALL_OBJS;
        world.addBody(wallBody);
    }

    const holeTarget = new THREE.Vector3(startX, 0, startZ);
    let holeBody;
    function updateHolePhysics(radius) {
        if (holeBody) world.removeBody(holeBody);
        holeBody = new CANNON.Body({ type: CANNON.Body.KINEMATIC, position: new CANNON.Vec3(holeTarget.x, 0, holeTarget.z), material: rimMat });
        holeBody.collisionFilterGroup = CG_HOLE_RIM;
        holeBody.collisionFilterMask = CG_ALL_OBJS; 
        
        const numSegments = 32;
        const boxThickness = 40;
        const distance = (radius + 0.1) + boxThickness / 2;
        const boxWidth = 2 * distance * Math.tan(Math.PI / numSegments) + 0.5;
        
        for (let i = 0; i < numSegments; i++) {
            const angle = i * ((Math.PI * 2) / numSegments);
            const shape = new CANNON.Box(new CANNON.Vec3(boxThickness/2, 4/2, boxWidth/2));
            const quat = new CANNON.Quaternion();
            quat.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -angle);
            holeBody.addShape(shape, new CANNON.Vec3(Math.cos(angle) * distance, -2, Math.sin(angle) * distance), quat);
        }
        world.addBody(holeBody);
    }

    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
    camera.position.set(startX, 10, startZ + 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(50, 100, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
    sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
    scene.add(sun);

    // --- Shader Injection ---
    const groundUniforms = { holePos: { value: new THREE.Vector3(startX, 0, startZ) }, holeRadius: { value: holeRadius } };

    function applyHoleShader(material, isWater = false) {
        material.onBeforeCompile = (shader) => {
            shader.uniforms.holePos = groundUniforms.holePos;
            shader.uniforms.holeRadius = groundUniforms.holeRadius;
            shader.vertexShader = `varying vec3 vCustomWorldPos;\n${shader.vertexShader}`.replace('#include <project_vertex>', `#include <project_vertex>\n vCustomWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
            
            let fragMain = `void main() { \n if (length(vCustomWorldPos.xz - holePos.xz) < holeRadius) discard;\n`;
            shader.fragmentShader = `uniform vec3 holePos;\nuniform float holeRadius;\nvarying vec3 vCustomWorldPos;\n${shader.fragmentShader}`.replace('void main() {', fragMain);

            if (!isWater) {
                shader.fragmentShader = shader.fragmentShader.replace('#include <map_fragment>', `
                    #include <map_fragment>
                    float grid = max(step(0.95, fract(vCustomWorldPos.x * 0.5)), step(0.95, fract(vCustomWorldPos.z * 0.5)));
                    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.15), grid * 0.2);
                `);
            }
        };
    }

    // --- Geometry Construction ---
    const islandGeom = new THREE.CylinderGeometry(1, 1, 4, 64);
    const pos = islandGeom.attributes.position;
    for(let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i), vz = pos.getZ(i);
        if (vx !== 0 || vz !== 0) {
            const angle = Math.atan2(vz, vx);
            const r = getIslandRadius(angle);
            const norm = Math.sqrt(vx*vx + vz*vz);
            pos.setX(i, (vx / norm) * r);
            pos.setZ(i, (vz / norm) * r);
        }
    }
    islandGeom.computeVertexNormals();
    const islandMat = new THREE.MeshStandardMaterial({ color: 0x4aa651, roughness: 0.9 });
    applyHoleShader(islandMat, false);
    const islandMesh = new THREE.Mesh(islandGeom, islandMat);
    islandMesh.position.y = -2.01; 
    islandMesh.receiveShadow = true;
    scene.add(islandMesh);

    const edgePath = new THREE.CurvePath();
    for (let i = 0; i < polygon.length; i++) {
        const p1 = polygon[i], p2 = polygon[(i + 1) % polygon.length];
        edgePath.add(new THREE.LineCurve3(new THREE.Vector3(p1.x, 0, p1.y), new THREE.Vector3(p2.x, 0, p2.y)));
    }
    const tubeGeom = new THREE.TubeGeometry(edgePath, 128, 0.5, 8, true);
    const tubeMat = new THREE.MeshStandardMaterial({ color: 0x3d8c43, roughness: 1 });
    applyHoleShader(tubeMat, false);
    const edgeMesh = new THREE.Mesh(tubeGeom, tubeMat);
    edgeMesh.position.y = 0.0; 
    scene.add(edgeMesh);

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#006994'; ctx.fillRect(0,0,256,256);
    for(let i=0; i<3000; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.15})`;
        ctx.fillRect(Math.random()*256, Math.random()*256, 3, 1);
    }
    const waterTex = new THREE.CanvasTexture(canvas);
    waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping; waterTex.repeat.set(30, 30);

    const waterGeom = new THREE.PlaneGeometry(2000, 2000);
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x006994, roughness: 0.1, metalness: 0.2, map: waterTex });
    applyHoleShader(waterMat, true);
    const waterMesh = new THREE.Mesh(waterGeom, waterMat);
    waterMesh.rotation.x = -Math.PI / 2;
    waterMesh.position.y = -1.5; 
    scene.add(waterMesh);

    const raycastPlane = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshBasicMaterial({ visible: false }));
    raycastPlane.rotation.x = -Math.PI / 2;
    scene.add(raycastPlane);

    const holeGroup = new THREE.Group();
    const pitWall = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 40, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide }));
    pitWall.position.y = -20;
    const pitBase = new THREE.Mesh(new THREE.CircleGeometry(1, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    pitBase.rotation.x = -Math.PI / 2; pitBase.position.y = -39.9;
    holeGroup.add(pitWall); holeGroup.add(pitBase);
    scene.add(holeGroup);

    // --- City Generation ---
    const items = [];
    const colors = [0xff5722, 0x4caf50, 0x2196f3, 0xffeb3b, 0x9c27b0, 0xffffff, 0x607d8b, 0x795548];

    const downtowns = [];
    for(let i=0; i<6; i++) {
        downtowns.push({ x: (Math.random() - 0.5) * WORLD_SIZE * 0.7, z: (Math.random() - 0.5) * WORLD_SIZE * 0.7 });
    }

    function createEntity(x, y, z, w, h, d, color, visualType = 'box', rotY = 0) {
        let meshGeom;
        if (visualType === 'cylinder') meshGeom = new THREE.CylinderGeometry(w/2, d/2, h, 16);
        else meshGeom = new THREE.BoxGeometry(w, h, d);

        const mesh = new THREE.Mesh(meshGeom, new THREE.MeshStandardMaterial({ color, roughness: 0.8, transparent: true, opacity: 1.0 }));
        mesh.castShadow = mesh.receiveShadow = true;
        scene.add(mesh);

        const mass = w * h * d * 0.5;
        const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
        const body = new CANNON.Body({ mass, material: objMat, position: new CANNON.Vec3(x, y, z), linearDamping: 0.3, angularDamping: 0.3 });
        
        body.quaternion.setFromEuler(0, rotY, 0);
        body.addShape(shape);
        body.collisionFilterGroup = CG_ALL_OBJS;
        body.collisionFilterMask = CG_GROUND | CG_ALL_OBJS; 
        world.addBody(body);
        body.sleep(); 

        mesh.rotation.y = rotY; 
        items.push({ mesh, body, radius: Math.max(w, d) / 2, targetOpacity: 1.0 });
    }

    function buildSkyscraper(cx, cz, color, style, baseType) {
        let currentY = 0;

        if (style === 0) {
            let floors = 7 + Math.floor(Math.random() * 6); 
            let w = 4.0 + Math.random() * 2.0;
            for (let i = 0; i < floors; i++) {
                let h = 1.2 + Math.random() * 0.5;
                createEntity(cx, currentY + h/2, cz, w, h, w, color, baseType);
                currentY += h;
                w *= 0.82; 
            }
        } else if (style === 1) {
            let h = 2.0 + Math.random(), w = 4.5; 
            createEntity(cx, currentY + h/2, cz, w, h, w, color, baseType);
            currentY += h;
            
            h = 6 + Math.random() * 4; w = 1.8; 
            createEntity(cx, currentY + h/2, cz, w, h, w, color, baseType);
            currentY += h;
            
            h = 1.5; w = 3.5; 
            createEntity(cx, currentY + h/2, cz, w, h, w, color, baseType);
            currentY += h;
            
            h = 4; w = 0.8; 
            createEntity(cx, currentY + h/2, cz, w, h, w, color, baseType);
            currentY += h;
        } else if (style === 2) {
            let floors = 8 + Math.floor(Math.random() * 5); 
            let w = 3.5;
            let h = 1.2;
            let rot = 0;
            for(let i = 0; i < floors; i++) {
                createEntity(cx, currentY + h/2, cz, w, h, w, color, baseType, rot);
                currentY += h;
                if(baseType === 'box') rot += 0.25; 
            }
        } else if (style === 3) {
            let floors = 8 + Math.floor(Math.random() * 5);
            let w = 3.5;
            let h = 1.1;
            for(let i = 0; i < floors; i++) {
                let offsetX = Math.sin(i * 0.7) * (w * 0.2); 
                createEntity(cx + offsetX, currentY + h/2, cz, w, h, w, color, baseType);
                currentY += h;
                w *= 0.96; 
            }
        }
    }

    // Spawning 1: Perimeter Fence
    for (let i = 0; i < polygon.length; i++) {
        const p1 = polygon[i], p2 = polygon[(i + 1) % polygon.length];
        const dist = p1.distanceTo(p2);
        const angle = Math.atan2(p1.y - p2.y, p1.x - p2.x);
        
        const fenceLength = 2.0;
        const fenceGap = 0.05;
        const stride = fenceLength + fenceGap;
        
        const count = Math.floor(dist / stride);
        if (count > 0) {
            const actualStride = dist / count; 
            for (let j = 0; j < count; j++) {
                const d = j * actualStride + (actualStride / 2);
                const px = p1.x - Math.cos(angle) * d;
                const pz = p1.y - Math.sin(angle) * d;
                createEntity(px, 0.6, pz, fenceLength, 1.2, 0.4, 0x8b4513, 'box', -angle);
            }
        }
    }

    // Spawning 2: City Blocks
    const GRID_SIZE = 6.5; 
    for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x += GRID_SIZE) {
        for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z += GRID_SIZE) {
            
            if (!isPointInPolygon(x, z, polygon)) continue; 

            let minDistToDowntown = Infinity;
            downtowns.forEach(dt => {
                const d = Math.sqrt((x - dt.x)**2 + (z - dt.z)**2);
                if (d < minDistToDowntown) minDistToDowntown = d;
            });
            const distToSpawn = Math.sqrt((x - startX)**2 + (z - startZ)**2);
            const coastDist = getIslandRadius(Math.atan2(z, x));
            const distToCenter = Math.sqrt(x*x + z*z);
            
            if (distToCenter > coastDist - 5) continue; 

            const cx = x + (Math.random() - 0.5);
            const cz = z + (Math.random() - 0.5);
            const color = colors[Math.floor(Math.random() * colors.length)];
            const chance = Math.random();

            if (distToSpawn < 12) {
                if (chance > 0.1) createEntity(cx, 0.4, cz, 0.8, 0.8, 0.8, 0xffff00, Math.random() > 0.5 ? 'box' : 'cylinder'); 
                if (Math.random() > 0.5) createEntity(cx+1.5, 0.3, cz-1.5, 0.6, 0.6, 0.6, 0x4caf50, 'box');
                continue; 
            }

            if (chance > 0.5) {
                createEntity(cx + 2.0, 0.3, cz - 2.0, 0.6, 0.6, 0.6, 0xff9800, 'box');
            }

            if (minDistToDowntown < 15) {
                if (chance > 0.3) {
                    const style = Math.floor(Math.random() * 4); 
                    const baseType = Math.random() > 0.5 ? 'cylinder' : 'box'; 
                    buildSkyscraper(cx, cz, color, style, baseType);
                } else {
                    createEntity(cx, 1.5, cz, 4.0, 3.0, 4.0, color, 'box'); 
                }
            } 
            else if (minDistToDowntown >= 15 && minDistToDowntown < 30) {
                if (chance > 0.4) {
                    const floors = 2 + Math.floor(Math.random() * 3);
                    const floorH = 1.2;
                    for (let i = 0; i < floors; i++) {
                        createEntity(cx, (floorH / 2) + (i * floorH), cz, 3.0, floorH, 3.0, color, 'box');
                    }
                }
            } 
            else {
                if (chance > 0.2) {
                    const floors = Math.random() > 0.8 ? 2 : 1;
                    const floorH = 1.0;
                    for (let i = 0; i < floors; i++) {
                        createEntity(cx, (floorH / 2) + (i * floorH), cz, 2.5, floorH, 2.5, color, 'box');
                    }
                }
            }
        }
    }

    // --- Game Logic ---
    const mouse = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();

    updateHolePhysics(holeRadius);

    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    const timerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) endGame();
    }, 1000);

    function endGame() {
        gameActive = false;
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-score').innerText = `Final Size: ${scoreMultiplier.toFixed(1)}m`;
    }

    function updateHoleSize(newRadius) {
        holeRadius = newRadius;
        groundUniforms.holeRadius.value = holeRadius;
        holeGroup.scale.set(holeRadius, 1, holeRadius);
        updateHolePhysics(holeRadius);
        document.getElementById('score').innerText = `SIZE: ${scoreMultiplier.toFixed(1)}m`;
    }

    const timeStep = 1 / 60;
    let lastCallTime = performance.now();
    const maskNormal = CG_GROUND | CG_ALL_OBJS;   
    const maskFalling = CG_HOLE_RIM | CG_ALL_OBJS; 

    function animate() {
        requestAnimationFrame(animate);
        if (!gameActive) return;

        const time = performance.now() / 1000;
        const dt = time - lastCallTime;
        lastCallTime = time;

        waterTex.offset.x -= 0.0005;
        waterTex.offset.y -= 0.0005;

        // Move Hole (Clamped to Island Edge)
        raycaster.setFromCamera(mouse, camera);
        const intersect = raycaster.intersectObject(raycastPlane);
        if (intersect.length > 0) {
            const rt = intersect[0].point;
            const angle = Math.atan2(rt.z, rt.x);
            const maxR = getIslandRadius(angle); 
            const dist = Math.sqrt(rt.x*rt.x + rt.z*rt.z);
            
            if (dist > maxR && maxR > 0) {
                rt.x = (rt.x / dist) * maxR;
                rt.z = (rt.z / dist) * maxR;
            }
            holeTarget.lerp(rt, sensitivity);
        }

        holeGroup.position.copy(holeTarget);
        groundUniforms.holePos.value.copy(holeTarget);
        if (holeBody) holeBody.position.set(holeTarget.x, 0, holeTarget.z);

        const camDist = 8 + (holeRadius * 2.5);
        const camHeight = 7 + (holeRadius * 1.5);
        camera.position.lerp(new THREE.Vector3(holeTarget.x, camHeight, holeTarget.z + camDist), 0.05);
        camera.lookAt(holeTarget);

        scene.fog.near = camDist + 5;
        scene.fog.far = camDist + 70 + (holeRadius * 8);

        world.step(timeStep, dt, 3);

        const camToHole = new THREE.Vector3().subVectors(holeTarget, camera.position).normalize();
        const distToHole = camera.position.distanceTo(holeTarget);

        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            
            item.mesh.position.copy(item.body.position);
            item.mesh.quaternion.copy(item.body.quaternion);

            const dx = item.body.position.x - holeTarget.x;
            const dz = item.body.position.z - holeTarget.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            
            // X-Ray Vision
            const camToItem = new THREE.Vector3().subVectors(item.mesh.position, camera.position);
            const distToItem = camToItem.length();
            camToItem.normalize();

            const blockingAngle = Math.min(0.3, 0.05 + (item.radius / Math.max(1, distToItem)));
            if (distToItem < distToHole - 5 && item.body.position.y > 0 && camToHole.angleTo(camToItem) < blockingAngle) {
                item.targetOpacity = 0.2; 
            } else {
                item.targetOpacity = 1.0;
            }
            if (Math.abs(item.mesh.material.opacity - item.targetOpacity) > 0.01) {
                item.mesh.material.opacity += (item.targetOpacity - item.mesh.material.opacity) * 0.15;
            }

            let isGhost = false;

            const swallowedByHole = (item.body.position.y < -0.3 && dist < holeRadius * 1.2);

            if (swallowedByHole) {
                isGhost = true;
                if (item.body.collisionFilterMask !== 0) item.body.collisionFilterMask = 0; 
                item.body.applyForce(new CANNON.Vec3(0, -item.body.mass * 20, 0), item.body.position);
                item.mesh.scale.multiplyScalar(0.85); 
            }

            // --- FAILSAFE ACTIVE EDGE CONTAINMENT LOOP ---
            // If any object gets pushed outside the boundary while NOT falling in the hole, clamp it back inside immediately!
            if (!isGhost && item.body.position.y > -0.5) {
                const itemAngle = Math.atan2(item.body.position.z, item.body.position.x);
                const maxIslandR = getIslandRadius(itemAngle) - 0.2;
                const itemDist = Math.sqrt(item.body.position.x**2 + item.body.position.z**2);
                
                if (itemDist > maxIslandR && maxIslandR > 0) {
                    item.body.position.x = (item.body.position.x / itemDist) * maxIslandR;
                    item.body.position.z = (item.body.position.z / itemDist) * maxIslandR;
                    item.body.velocity.x *= 0.1;
                    item.body.velocity.z *= 0.1;
                    item.body.angularVelocity.set(0, 0, 0);
                    item.mesh.position.copy(item.body.position);
                }
            }

            // Cleanup swallowed/eaten objects
            if (item.body.position.y < -6 || item.mesh.scale.x < 0.1) {
                scene.remove(item.mesh);
                world.removeBody(item.body);
                items.splice(i, 1);
                
                if (item.mesh.scale.x < 0.2 || dist < holeRadius * 2) {
                    const mass = item.body.mass;
                    scoreMultiplier += mass * 0.04;
                    updateHoleSize(holeRadius + mass * 0.015);
                }
                continue;
            }

            if (!isGhost) {
                if (dist < holeRadius + item.radius) {
                    if (item.body.collisionFilterMask !== maskFalling) {
                        item.body.collisionFilterMask = maskFalling;
                        item.body.wakeUp(); 
                    }
                } else {
                    if (item.body.position.y > -0.1) {
                        if (item.body.collisionFilterMask !== maskNormal) {
                            item.body.collisionFilterMask = maskNormal;
                        }
                    }
                }
            }
        }
        renderer.render(scene, camera);
    }

    window.toggleSettings = () => {
        const panel = document.getElementById('settings-panel');
        const isVisible = panel.style.display === 'flex';
        panel.style.display = isVisible ? 'none' : 'flex';
        gameActive = !isVisible;
        if(gameActive) lastCallTime = performance.now() / 1000;
    };
    document.getElementById('sens').oninput = (e) => sensitivity = e.target.value / 1000;
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
