<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Pro Dialer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --primary: #34c759; --danger: #ff3b30; --blue: #007aff; --text: #fff; --gray: #2c2c2e; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }

        .top-info { width: 100%; max-width: 400px; background: #111; padding: 10px; text-align: center; border-bottom: 1px solid #333; }
        #status-bar { font-size: 10px; color: #ffc107; text-transform: uppercase; letter-spacing: 1px; }

        .phone-shell { width: 100%; max-width: 400px; height: 85vh; background: var(--bg); position: relative; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #333; border-radius: 40px; margin-top: 10px; }
        .view { display: none; flex-direction: column; height: 100%; padding: 20px; }
        .view.active { display: flex; }

        /* Dialer UI */
        #dial-display { font-size: 45px; height: 60px; text-align: center; margin: 30px 0; font-weight: 300; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; justify-items: center; }
        .key { width: 70px; height: 70px; background: var(--gray); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .key:active { background: #444; }
        .key b { font-size: 24px; }
        .key.call-btn { background: var(--primary); grid-column: 2; }

        /* Call UI */
        .video-box { flex-grow: 1; position: relative; background: #111; border-radius: 20px; overflow: hidden; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 10px; right: 10px; width: 80px; height: 120px; border-radius: 10px; object-fit: cover; border: 1px solid #444; z-index: 5; }
        
        .call-controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 20px 0; }
        .btn-ctl { border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--gray); color: white; font-size: 18px; }
        .btn-ctl.active { background: white; color: black; }
        .btn-ctl.hangup { background: var(--danger); }
        .btn-ctl.low-data { font-size: 10px; font-weight: bold; }

        .incoming-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="top-info">
        <div id="status-bar">Connecting...</div>
        <div style="font-size: 12px; color: var(--primary); font-weight: bold;">ID: <span id="my-id-val">....</span></div>
    </div>

    <div class="phone-shell">
        <!-- DIALER -->
        <div id="view-dialer" class="view active">
            <div id="dial-display"></div>
            <div class="keypad" id="keypad-grid"></div>
        </div>

        <!-- CALL -->
        <div id="view-call" class="view">
            <div class="video-box">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="call-controls">
                <button class="btn-ctl active" id="mic-toggle">🎤</button>
                <button class="btn-ctl active" id="cam-toggle">📷</button>
                <button class="btn-ctl" id="screen-toggle" style="background:var(--blue)">📺</button>
                <button class="btn-ctl low-data" id="data-toggle" title="Prioritize Audio">LOW<br>DATA</button>
                <button class="btn-ctl hangup" id="hangup-btn">📵</button>
            </div>
        </div>

        <!-- INCOMING -->
        <div id="incoming-overlay" class="incoming-ui">
            <h2 id="caller-id">Incoming...</h2>
            <div style="display:flex; gap: 30px; margin-top: 20px;">
                <button class="btn-ctl hangup" onclick="endCall()">✕</button>
                <button class="btn-ctl" style="background:var(--primary); width:70px; height:70px;" onclick="answerCall()">✔</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Setup Persistent ID
        let myNum = localStorage.getItem('pro_dialer_id') || (Math.floor(Math.random()*1000)+1).toString().padStart(4, '0');
        localStorage.setItem('pro_dialer_id', myNum);
        document.getElementById('my-id-val').innerText = myNum;

        // 2. PeerJS with STUN/TURN fallback
        const peer = new Peer('P-' + myNum, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    {
                        urls: "stun:stun.relay.metered.ca:80",
                    },
                    {
                        urls: "turn:global.relay.metered.ca:80",
                        username: "c198465a34d3f8e5ae248d9e",
                        credential: "5BRzxWFSps2G0yOR",
                    },
                    {
                        urls: "turn:global.relay.metered.ca:80?transport=tcp",
                        username: "c198465a34d3f8e5ae248d9e",
                        credential: "5BRzxWFSps2G0yOR",
                    },
                    {
                        urls: "turn:global.relay.metered.ca:443",
                        username: "c198465a34d3f8e5ae248d9e",
                        credential: "5BRzxWFSps2G0yOR",
                    },
                    {
                        urls: "turns:global.relay.metered.ca:443?transport=tcp",
                        username: "c198465a34d3f8e5ae248d9e",
                        credential: "5BRzxWFSps2G0yOR",
                    }
                ]
            }
        });

        let localStream, currentCall, dataConn, lowDataMode = false;
        const status = document.getElementById('status-bar');

        // 3. Dialer Keypad Generation
        const keypad = document.getElementById('keypad-grid');
        const keys = ['1','2','3','4','5','6','7','8','9','*','0','#'];
        keys.forEach(k => {
            const div = document.createElement('div');
            div.className = 'key';
            div.innerHTML = `<b>${k}</b>`;
            div.onclick = () => { document.getElementById('dial-display').innerText += k; };
            keypad.appendChild(div);
        });
        const callBtn = document.createElement('div');
        callBtn.className = 'key call-btn';
        callBtn.innerHTML = `<b>📞</b>`;
        callBtn.onclick = startCall;
        keypad.appendChild(callBtn);

        // 4. Handle Incoming
        peer.on('connection', conn => { // Listen for Data Signals (like Hangup)
            dataConn = conn;
            conn.on('data', data => { if(data === 'HANGUP') endCall(false); });
        });

        peer.on('call', call => {
            currentCall = call;
            document.getElementById('caller-id').innerText = "From: " + call.peer.replace('P-','');
            document.getElementById('incoming-overlay').style.display = 'flex';
        });

        async function answerCall() {
            document.getElementById('incoming-overlay').style.display = 'none';
            switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            currentCall.answer(localStream);
            setupCall(currentCall);
            dataConn = peer.connect(currentCall.peer); // Ensure data link is open
        }

        // 5. Outgoing Call
        async function startCall() {
            const target = document.getElementById('dial-display').innerText;
            if(!target) return;
            switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            
            const targetID = 'P-' + target.padStart(4, '0');
            dataConn = peer.connect(targetID); // Signaling link
            currentCall = peer.call(targetID, localStream);
            setupCall(currentCall);
        }

        function setupCall(call) {
            status.innerText = "Connecting...";
            call.on('stream', rem => {
                status.innerText = "Active";
                document.getElementById('remote-video').srcObject = rem;
            });
            call.on('close', () => endCall(false));
            call.peerConnection.oniceconnectionstatechange = () => {
                status.innerText = "ICE: " + call.peerConnection.iceConnectionState;
            };
        }

        // 6. Audio Priority (Low Data Mode)
        document.getElementById('data-toggle').onclick = async (e) => {
            lowDataMode = !lowDataMode;
            e.currentTarget.classList.toggle('active', lowDataMode);
            
            if (currentCall && currentCall.peerConnection) {
                const senders = currentCall.peerConnection.getSenders();
                const videoSender = senders.find(s => s.track.kind === 'video');
                if (videoSender) {
                    const params = videoSender.getParameters();
                    if (!params.encodings) params.encodings = [{}];
                    // On low data, limit video to 50kbps to give audio all the bandwidth
                    params.encodings[0].maxBitrate = lowDataMode ? 50000 : 2500000; 
                    await videoSender.setParameters(params);
                    status.innerText = lowDataMode ? "Low Data Active" : "Standard Quality";
                }
            }
        };

        // 7. Screen Share (Mobile Fixes)
        document.getElementById('screen-toggle').onclick = async () => {
            try {
                // Check if browser supports screen share (iOS Safari 13+ or Android Chrome)
                if(!navigator.mediaDevices.getDisplayMedia) {
                    return alert("Screen sharing not supported on this mobile browser.");
                }
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenTrack = screenStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                sender.replaceTrack(screenTrack);
                document.getElementById('local-video').srcObject = screenStream;
                screenTrack.onended = () => { 
                    sender.replaceTrack(localStream.getVideoTracks()[0]); 
                    document.getElementById('local-video').srcObject = localStream; 
                };
            } catch (e) { console.error("Screen share failed", e); }
        };

        // 8. Proper Disconnect (Signal Remote First)
        document.getElementById('hangup-btn').onclick = () => endCall(true);

        function endCall(sendSignal) {
            if (sendSignal && dataConn) {
                dataConn.send('HANGUP'); // Tell remote we are hanging up
            }
            // Small delay to let signal send before teardown
            setTimeout(() => {
                location.reload(); 
            }, 300);
        }

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Toggles
        document.getElementById('mic-toggle').onclick = e => {
            localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled;
            e.currentTarget.classList.toggle('active');
        };
        document.getElementById('cam-toggle').onclick = e => {
            localStream.getVideoTracks()[0].enabled = !localStream.getVideoTracks()[0].enabled;
            e.currentTarget.classList.toggle('active');
        };
    </script>
</body>
</html>
