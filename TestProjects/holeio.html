<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Hole.io Clone - Smooth Tracking</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none;}
        
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box; color: white;
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        
        #stars-container { display: flex; gap: 5px; pointer-events: all; cursor: pointer; transition: transform 0.2s; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; border: 1px solid #777;}
        #stars-container:hover { transform: scale(1.05); }
        .star { font-size: 32px; color: #666; transition: color 0.3s, text-shadow 0.3s; }
        .star.achieved { color: #ffd700; text-shadow: 0 0 10px #ffaa00; }
        .star.failed { color: #ff3333; opacity: 0.5; }
        
        #center-info { text-align: center; font-size: 24px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 12px; pointer-events: all; border: 1px solid #555;}
        #level-text { font-size: 18px; color: #aaa; margin-bottom: 5px; text-transform: uppercase;}
        #score-text { color: #4caf50; }
        
        #growth-container { margin-top: 10px; font-size: 14px; width: 260px; text-align: center;}
        #growth-text { color: #ddd; margin-bottom: 4px; font-weight: bold; letter-spacing: 1px; font-size: 13px;}
        .progress-bg { width: 100%; height: 16px; background: rgba(0,0,0,0.8); border: 2px solid #666; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 5px black; }
        #growth-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); transition: width 0.2s ease-out, background 0.4s ease;}
        
        .right-hud { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: all; }
        #timer { font-size: 36px; font-weight: bold; color: #ffeb3b; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 10px; border: 1px solid #555;}
        #btn-settings { cursor: pointer; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 8px; border: 1px solid #999; color: white; font-weight: bold; transition: 0.2s; }
        #btn-settings:hover { background: rgba(50,50,50,1); }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 100; pointer-events: all;
        }
        
        .modal-content {
            background: #222; border: 2px solid #555; border-radius: 15px;
            padding: 30px; width: 500px; max-width: 90%; text-align: center; display: flex; flex-direction: column; gap: 15px;
        }
        
        .obj-row { display: flex; align-items: center; justify-content: flex-start; gap: 20px; background: #333; margin: 10px 0; padding: 15px; border-radius: 10px; text-align: left; }
        .obj-row img { width: 80px; height: 80px; background: #111; border-radius: 8px; border: 1px solid #666; object-fit: contain; }
        .obj-details { flex-grow: 1; }
        .obj-desc { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .obj-prog { font-size: 14px; color: #aaa; }
        .obj-status { font-size: 24px; font-weight: bold; }
        
        .slider-row { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 12px 15px; border-radius: 10px; gap: 10px;}
        .slider-row label { font-weight: bold; font-size: 14px; width: 35%; text-align: left;}
        input[type=range] { width: 45%; }
        .val-display { background: #111; padding: 2px 8px; border-radius: 5px; border: 1px solid #555; font-family: monospace; font-size: 16px; min-width: 25px; text-align: center; }

        button { cursor: pointer; padding: 12px 24px; background: #3498db; border: none; color: white; border-radius: 5px; font-weight: bold; font-size: 18px; transition: 0.2s; margin: 5px; }
        button:hover { background: #2980b9; transform: translateY(-2px); }
        button.success { background: #2ecc71; }
        
        #instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; opacity: 0.8; font-weight: bold; pointer-events: none; font-size: 18px; text-shadow: 2px 2px 4px rgba(0,0,0,1);}
        
        #joystick-base {
            position: absolute; border-radius: 50%; width: 100px; height: 100px;
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 50;
        }
        #joystick-knob {
            position: absolute; border-radius: 50%; width: 40px; height: 40px;
            background: rgba(255,255,255,0.5); transform: translate(-50%, -50%); top: 50%; left: 50%;
        }
    </style>
</head>
<body>

<div id="joystick-base"><div id="joystick-knob"></div></div>

<div id="ui-overlay">
    <div class="top-bar">
        <div id="stars-container" title="Click to view Objectives">
            <span class="star" id="ui-star-0">★</span>
            <span class="star" id="ui-star-1">★</span>
            <span class="star" id="ui-star-2">★</span>
        </div>
        <div id="center-info">
            <div id="level-text">Level 1 - Intro</div>
            <div id="score-text">0 / 0 pts</div>
            <div id="growth-container">
                <div id="growth-text">NEXT SIZE: 0 / 100</div>
                <div class="progress-bg"><div id="growth-bar"></div></div>
            </div>
        </div>
        <div class="right-hud">
            <div id="timer">02:30</div>
            <div id="btn-settings" onclick="showSettingsModal()">⚙️ Pause (ESC)</div>
        </div>
    </div>
    <div id="instructions">Move mouse from center to steer | WASD / Arrows | Touch drag</div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top: 0; color: #3498db;">Game Paused</h2>
        <div class="slider-row">
            <label>Mouse / Trackpad</label>
            <input type="range" id="sens-mouse" min="5" max="50" value="20">
            <span class="val-display" id="val-mouse">20</span>
        </div>
        <div class="slider-row">
            <label>Touch Drag</label>
            <input type="range" id="sens-touch" min="5" max="50" value="20">
            <span class="val-display" id="val-touch">20</span>
        </div>
        <div class="slider-row">
            <label>Keyboard (WASD)</label>
            <input type="range" id="sens-key" min="5" max="50" value="20">
            <span class="val-display" id="val-key">20</span>
        </div>
        <button onclick="resumeGame('settings-modal')">Resume Game</button>
    </div>
</div>

<div id="obj-modal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top: 0; color: #ffeb3b;">Level Objectives</h2>
        <div id="obj-list"></div>
        <button onclick="resumeGame('obj-modal')">Resume Game</button>
    </div>
</div>

<div id="end-modal" class="modal">
    <div class="modal-content">
        <h1 id="end-title" style="font-size: 40px; margin-top: 0;">TIME'S UP!</h1>
        <p id="end-stats" style="font-size: 20px; color: #ccc;">Final Score: 0</p>
        <div style="font-size: 50px; margin: 20px 0;" id="end-stars"></div>
        <div id="end-buttons">
            <button id="btn-next" class="success" style="display:none;" onclick="nextLevel()">Next Level</button>
            <button id="btn-retry" onclick="retryLevel()">Retry Level</button>
        </div>
    </div>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    // --- Global Game State ---
    let GAME_TIME = 150;
    let currentLevel = 1;
    let difficultyConfig = {};
    let totalWorldPoints = 0;
    let score = 0;
    
    // Growth Logic (Gradual Animation Over ~2 Seconds)
    let holeLevel = 1;
    let holePoints = 0;
    let targetHolePoints = 100;
    let holeRadius = 1.6;       // Live animated radius
    let targetHoleRadius = 1.6; // Goal radius after level ups
    let scoreMultiplier = 1.6; 
    
    // Sensitivities
    let mouseSpeed = 20;
    let touchSpeed = 20;
    let keySpeed = 20;
    
    let timeLeft = GAME_TIME;
    let gameActive = false;
    let isPaused = false;
    
    let objectives = []; 
    let WORLD_SIZE = 140;
    let polygon = []; 
    
    let items = [];
    let mapMeshes = [];
    let wallBodies = [];
    
    let nextBuildingId = 1;
    let buildingMap = {};

    // --- Physics Setup (Pure Void Hole Architecture) ---
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -30, 0) });
    world.allowSleep = true;
    world.solver.iterations = 40;

    const CG_GROUND = 1, CG_ALL_OBJS = 2;
    const staticMat = new CANNON.Material();
    const objMat = new CANNON.Material();
    const wallMat = new CANNON.Material();

    world.defaultContactMaterial.restitution = 0.0;
    world.defaultContactMaterial.friction = 0.4;
    
    world.addContactMaterial(new CANNON.ContactMaterial(staticMat, objMat, { 
        friction: 0.6, 
        restitution: 0.0, 
        contactEquationStiffness: 1e6, 
        contactEquationRelaxation: 3 
    }));
    
    world.addContactMaterial(new CANNON.ContactMaterial(objMat, objMat, { 
        friction: 0.5, 
        restitution: 0.0, 
        contactEquationStiffness: 1e6, 
        contactEquationRelaxation: 3 
    }));
    
    world.addContactMaterial(new CANNON.ContactMaterial(wallMat, objMat, { 
        friction: 0.8, 
        restitution: 0.0, 
        contactEquationStiffness: 1e6, 
        contactEquationRelaxation: 4 
    }));

    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: staticMat });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    groundBody.collisionFilterGroup = CG_GROUND;
    groundBody.collisionFilterMask = CG_ALL_OBJS; 
    world.addBody(groundBody);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 20, 150);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
    let cameraTarget = new THREE.Vector3(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(50, 100, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
    scene.add(sun);

    // Single-Context Safe Snapshot Generator
    const snapCanvas = document.createElement('canvas');
    snapCanvas.width = 128; snapCanvas.height = 128;
    const snapScene = new THREE.Scene();
    const snapLight = new THREE.DirectionalLight(0xffffff, 1.5);
    snapLight.position.set(5, 10, 5);
    snapScene.add(new THREE.AmbientLight(0xffffff, 1.0));
    snapScene.add(snapLight);
    const snapCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);

    function createSnapshot(previewObj) {
        if (!previewObj) return null;
        try {
            const renderTarget = new THREE.WebGLRenderTarget(128, 128);
            const clone = previewObj.clone(true);
            clone.position.set(0, 0, 0);
            clone.rotation.set(0, 0, 0);
            snapScene.add(clone);

            const box = new THREE.Box3().setFromObject(clone);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z, 1.0);

            clone.position.sub(center);
            snapCamera.position.set(maxDim * 1.5, maxDim * 1.2, maxDim * 1.5);
            snapCamera.lookAt(0, 0, 0);

            const oldTarget = renderer.getRenderTarget();
            renderer.setRenderTarget(renderTarget);
            renderer.render(snapScene, snapCamera);

            const buffer = new Uint8Array(128 * 128 * 4);
            renderer.readRenderTargetPixels(renderTarget, 0, 0, 128, 128, buffer);
            renderer.setRenderTarget(oldTarget);

            const sCtx = snapCanvas.getContext('2d');
            const imgData = sCtx.createImageData(128, 128);
            for (let y = 0; y < 128; y++) {
                for (let x = 0; x < 128; x++) {
                    const srcIdx = ((127 - y) * 128 + x) * 4;
                    const dstIdx = (y * 128 + x) * 4;
                    imgData.data[dstIdx] = buffer[srcIdx];
                    imgData.data[dstIdx + 1] = buffer[srcIdx + 1];
                    imgData.data[dstIdx + 2] = buffer[srcIdx + 2];
                    imgData.data[dstIdx + 3] = buffer[srcIdx + 3];
                }
            }
            sCtx.putImageData(imgData, 0, 0);
            const dataUrl = snapCanvas.toDataURL();

            snapScene.remove(clone);
            renderTarget.dispose();
            return dataUrl;
        } catch (e) {
            console.warn("Snapshot fallback icon used:", e);
            return null;
        }
    }

    const groundUniforms = { holePos: { value: new THREE.Vector3(0, 0, 0) }, holeRadius: { value: holeRadius } };
    function applyHoleShader(material) {
        material.onBeforeCompile = (shader) => {
            shader.uniforms.holePos = groundUniforms.holePos;
            shader.uniforms.holeRadius = groundUniforms.holeRadius;
            shader.vertexShader = `varying vec3 vCustomWorldPos;\n${shader.vertexShader}`.replace(
                '#include <project_vertex>', 
                `#include <project_vertex>\n vCustomWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`
            );
            let fragMain = `void main() { \n if (length(vCustomWorldPos.xz - holePos.xz) < holeRadius) discard;\n`;
            shader.fragmentShader = `uniform vec3 holePos;\nuniform float holeRadius;\nvarying vec3 vCustomWorldPos;\n${shader.fragmentShader}`.replace('void main() {', fragMain);
        };
    }

    // Static Water
    const waterCanvas = document.createElement('canvas');
    waterCanvas.width = waterCanvas.height = 256;
    const ctx = waterCanvas.getContext('2d');
    ctx.fillStyle = '#006994'; ctx.fillRect(0,0,256,256);
    for(let i=0; i<3000; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.15})`;
        ctx.fillRect(Math.random()*256, Math.random()*256, 3, 1);
    }
    const waterTex = new THREE.CanvasTexture(waterCanvas);
    waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping; waterTex.repeat.set(30, 30);
    const waterGeom = new THREE.PlaneGeometry(2000, 2000);
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x006994, roughness: 0.1, metalness: 0.2, map: waterTex });
    applyHoleShader(waterMat);
    const waterMesh = new THREE.Mesh(waterGeom, waterMat);
    waterMesh.rotation.x = -Math.PI / 2;
    waterMesh.position.y = -1.5; 
    scene.add(waterMesh);

    const holeGroup = new THREE.Group();
    const pitWall = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 40, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide }));
    pitWall.position.y = -20;
    const pitBase = new THREE.Mesh(new THREE.CircleGeometry(1, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    pitBase.rotation.x = -Math.PI / 2; pitBase.position.y = -39.9;
    holeGroup.add(pitWall); holeGroup.add(pitBase);
    scene.add(holeGroup);
    
    let holeTopMesh;
    let holeTarget = new THREE.Vector3(0, 0, 0);

    function isPointInPolygon(x, z, poly) {
        if (!poly || poly.length < 3) return true;
        let isInside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, zi = poly[i].y;
            const xj = poly[j].x, zj = poly[j].y;
            const intersect = ((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi);
            if (intersect) isInside = !isInside;
        }
        return isInside;
    }

    function getPolygonRadius(angle) {
        if (!polygon || polygon.length === 0) return WORLD_SIZE * 0.45;
        let a = (angle + Math.PI * 2) % (Math.PI * 2);
        const numPoints = polygon.length;
        const indexFloat = (a / (Math.PI * 2)) * numPoints;
        const i1 = Math.floor(indexFloat) % numPoints;
        const i2 = (i1 + 1) % numPoints;
        const t = indexFloat - Math.floor(indexFloat);
        const r1 = Math.sqrt(polygon[i1].x**2 + polygon[i1].y**2);
        const r2 = Math.sqrt(polygon[i2].x**2 + polygon[i2].y**2);
        return r1 * (1 - t) + r2 * t; 
    }

    function getDifficultyConfig(level) {
        if (level === 1) return { name: "Intro", min: 0.08, max: 0.12, time: 150, color: '#4caf50' };
        if (level <= 3)  return { name: "Easy",  min: 0.15, max: 0.22, time: 140, color: '#4caf50' };
        if (level <= 6)  return { name: "Medium",min: 0.25, max: 0.35, time: 130, color: '#ffeb3b' };
        if (level <= 12) return { name: "Hard",  min: 0.35, max: 0.45, time: 120, color: '#ff9800' };
        return { name: "Very Hard", min: 0.48, max: 0.58, time: 110, color: '#ff3333' };
    }

    function getNextTargetPoints(level) {
        if (level === 1) return 100;
        if (level === 2) return 300;
        if (level === 3) return 1000;
        if (level === 4) return 3000;
        if (level === 5) return 8000;
        return Math.floor(8000 * Math.pow(1.6, level - 5));
    }

    function getGrowthPercent(level) {
        if (level <= 2) return 0.30;
        if (level === 3) return 0.40;
        if (level === 4) return 0.60;
        if (level === 5) return 0.70;
        return 0.75; 
    }

    function updateGrowthUI() {
        const text = document.getElementById('growth-text');
        const bar = document.getElementById('growth-bar');
        if (text && bar) {
            text.innerText = `NEXT SIZE: ${Math.floor(holePoints)} / ${targetHolePoints}`;
            const pct = Math.min(100, (holePoints / targetHolePoints) * 100);
            bar.style.width = `${pct}%`;
            
            let c1 = '#3498db', c2 = '#2ecc71'; 
            if (holeLevel === 3) { c1 = '#f1c40f'; c2 = '#f39c12'; } 
            else if (holeLevel === 4) { c1 = '#e67e22'; c2 = '#d35400'; } 
            else if (holeLevel === 5) { c1 = '#e74c3c'; c2 = '#c0392b'; } 
            else if (holeLevel >= 6) { c1 = '#9b59b6'; c2 = '#8e44ad'; } 
            
            bar.style.background = `linear-gradient(90deg, ${c1}, ${c2})`;
        }
    }

    function clearLevel() {
        mapMeshes.forEach(m => { scene.remove(m); m.geometry?.dispose(); m.material?.dispose(); });
        mapMeshes = [];
        wallBodies.forEach(b => world.removeBody(b));
        wallBodies = [];
        
        items.forEach(item => { 
            scene.remove(item.mesh);
            if(item.mesh.isGroup) {
                item.mesh.traverse(child => { if (child.isMesh) { child.geometry?.dispose(); child.material?.dispose(); } });
            } else {
                item.mesh.geometry?.dispose(); item.mesh.material?.dispose();
            }
            world.removeBody(item.body); 
        });
        
        items = []; 
        buildingMap = {};
        nextBuildingId = 1;
        totalWorldPoints = 0; 
        score = 0; 
        holeRadius = 1.6; 
        targetHoleRadius = 1.6;
        scoreMultiplier = 1.6;
        groundUniforms.holeRadius.value = 1.6;
        holeLevel = 1; 
        holePoints = 0; 
        targetHolePoints = getNextTargetPoints(1);
        updateGrowthUI();
        inputVelocity.set(0, 0);
        mouseDir.set(0, 0);
        updateHoleVisuals(holeRadius);
    }

    function startLevel(levelNum) {
        currentLevel = levelNum;
        difficultyConfig = getDifficultyConfig(currentLevel);
        GAME_TIME = difficultyConfig.time;
        clearLevel();
        
        WORLD_SIZE = Math.floor(Math.random() * 60) + 120;
        const AVG_RADIUS = WORLD_SIZE * 0.42;
        
        polygon = [];
        const numPoints = 60;
        const bumpA = Math.floor(Math.random()*5)+2;
        const bumpB = Math.floor(Math.random()*6)+4;
        
        for (let i = 0; i < numPoints; i++) {
            const angle = (i / numPoints) * Math.PI * 2; 
            const r = AVG_RADIUS + Math.sin(angle * bumpA) * 12 + Math.cos(angle * bumpB) * 8;
            polygon.push(new THREE.Vector2(Math.cos(angle) * r, Math.sin(angle) * r));
        }

        buildIslandAndWalls();
        buildRandomHoleTop();
        
        let startX = 0, startZ = 0;
        let attempts = 0;
        while (attempts++ < 500) {
            const testX = (Math.random() - 0.5) * WORLD_SIZE * 0.5;
            const testZ = (Math.random() - 0.5) * WORLD_SIZE * 0.5;
            const dist = Math.sqrt(testX**2 + testZ**2);
            if (isPointInPolygon(testX, testZ, polygon) && (getPolygonRadius(Math.atan2(testZ, testX)) - dist) > 10) {
                startX = testX;
                startZ = testZ;
                break;
            }
        }
        
        holeTarget.set(startX, 0, startZ);
        cameraTarget.set(startX, 0, startZ);
        groundUniforms.holePos.value.set(startX, 0, startZ);
        camera.position.set(startX, 7 + (1.6 * 1.5), startZ + 8 + (1.6 * 2.5));
        camera.lookAt(cameraTarget);
        
        spawnCity(startX, startZ);
        generateObjectives();
        
        timeLeft = GAME_TIME;
        updateUI();
        
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        gameActive = true; 
        isPaused = false;
        lastCallTime = performance.now() / 1000;
    }

    function buildIslandAndWalls() {
        const shape = new THREE.Shape();
        shape.moveTo(polygon[0].x, -polygon[0].y); 
        for(let i=1; i<polygon.length; i++) shape.lineTo(polygon[i].x, -polygon[i].y);
        shape.lineTo(polygon[0].x, -polygon[0].y);

        const islandGeom = new THREE.ShapeGeometry(shape);
        islandGeom.rotateX(-Math.PI / 2); 
        islandGeom.computeVertexNormals();

        const islandMat = new THREE.MeshStandardMaterial({ color: 0x4aa651, roughness: 0.9 });
        applyHoleShader(islandMat);
        const islandMesh = new THREE.Mesh(islandGeom, islandMat);
        islandMesh.position.y = -0.01; 
        islandMesh.receiveShadow = true;
        scene.add(islandMesh);
        mapMeshes.push(islandMesh);

        const edgePath = new THREE.CurvePath();
        const wallThickness = 200; 

        for (let i = 0; i < polygon.length; i++) {
            const p1 = polygon[i], p2 = polygon[(i + 1) % polygon.length];
            edgePath.add(new THREE.LineCurve3(new THREE.Vector3(p1.x, 0, p1.y), new THREE.Vector3(p2.x, 0, p2.y)));
            
            const dx = p2.x - p1.x; const dy = p2.y - p1.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist <= 0.001) continue;
            
            const nx = dy / dist; const nz = -dx / dist;

            const wallShape = new CANNON.Box(new CANNON.Vec3(dist / 2, 100, wallThickness / 2));
            const wallBody = new CANNON.Body({ mass: 0, material: wallMat });
            wallBody.addShape(wallShape);
            
            wallBody.position.set((p1.x + p2.x) / 2 + (nx * wallThickness/2), 45, (p1.y + p2.y) / 2 + (nz * wallThickness/2));
            wallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -Math.atan2(dy, dx));
            
            wallBody.collisionFilterGroup = CG_GROUND;
            wallBody.collisionFilterMask = CG_ALL_OBJS;
            world.addBody(wallBody);
            wallBodies.push(wallBody);
        }
        
        const tubeGeom = new THREE.TubeGeometry(edgePath, 150, 0.8, 8, true);
        const tubeMat = new THREE.MeshStandardMaterial({ color: 0x3d8c43, roughness: 1 });
        applyHoleShader(tubeMat);
        const edgeMesh = new THREE.Mesh(tubeGeom, tubeMat);
        scene.add(edgeMesh);
        mapMeshes.push(edgeMesh);
    }

    function buildRandomHoleTop() {
        if (holeTopMesh) {
            holeGroup.remove(holeTopMesh);
            holeTopMesh.geometry?.dispose();
            holeTopMesh.material?.dispose();
        }
        const rColor = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
        const type = Math.floor(Math.random() * 3);
        let geom;
        if (type === 0) geom = new THREE.TorusGeometry(1, 0.08, 16, Math.floor(Math.random()*10 + 4));
        else if (type === 1) geom = new THREE.CylinderGeometry(1.05, 1.05, 0.1, 32);
        else geom = new THREE.TorusGeometry(1, 0.1, 6, 32); 
        
        const mat = new THREE.MeshStandardMaterial({ color: rColor, roughness: 0.2, metalness: 0.8 });
        holeTopMesh = new THREE.Mesh(geom, mat);
        if (type !== 1) holeTopMesh.rotation.x = -Math.PI / 2;
        holeTopMesh.position.y = 0.01;
        holeGroup.add(holeTopMesh);
    }

    const colors = [0xff5722, 0x4caf50, 0x2196f3, 0xffeb3b, 0x9c27b0, 0xffffff, 0x607d8b, 0x795548];

    function createSimpleEntity(x, y, z, w, h, d, color, visualType, rotY = 0, category = 'Block', buildingId = 0, blockIndex = 0, previewObj = null) {
        const meshGeom = visualType === 'cylinder' ? new THREE.CylinderGeometry(w/2, d/2, h, 16) : new THREE.BoxGeometry(w, h, d);
        const meshMat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, transparent: true, opacity: 1.0 });
        const mesh = new THREE.Mesh(meshGeom, meshMat);
        mesh.position.set(x, y, z);
        mesh.rotation.y = rotY;
        mesh.castShadow = mesh.receiveShadow = true;
        scene.add(mesh);

        const mass = Math.max(1, Math.floor(w * h * d * 5)); 
        totalWorldPoints += mass;
        
        let shape;
        let shapeQuat = new CANNON.Quaternion();
        if (visualType === 'cylinder') {
            shape = new CANNON.Cylinder(w/2, d/2, h, 16);
            shapeQuat.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        } else {
            shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
        }

        const body = new CANNON.Body({ mass, material: objMat, position: new CANNON.Vec3(x, y, z), linearDamping: 0.3, angularDamping: 0.3 });
        body.quaternion.setFromEuler(0, rotY, 0);
        body.addShape(shape, new CANNON.Vec3(0, 0, 0), shapeQuat);
        body.collisionFilterGroup = CG_ALL_OBJS;
        body.collisionFilterMask = CG_GROUND | CG_ALL_OBJS; 
        world.addBody(body);
        body.sleep(); 
        mesh.userData.radius = Math.max(w, d)/2;

        items.push({ 
            mesh, 
            body, 
            radius: Math.max(w, d)/2, 
            initialY: y, 
            targetOpacity: 1.0, 
            mass, 
            cat: category, 
            color, 
            buildingId, 
            blockIndex, 
            previewObj: previewObj || mesh 
        });
    }

    function spawnBuildingStack(cx, cz, blocksData, color, category) {
        const buildingId = nextBuildingId++;
        const previewGroup = new THREE.Group();
        buildingMap[buildingId] = { totalBlocks: blocksData.length, eatenBlocks: 0, cat: category, color: color };

        blocksData.forEach((b, idx) => {
            const depth = b.d || b.w;
            const x = cx + (b.offsetX || 0);
            const y = b.y;
            const z = cz + (b.offsetZ || 0);
            const blockCol = b.color !== undefined ? b.color : color;
            
            const geom = b.type === 'cylinder' ? new THREE.CylinderGeometry(b.w/2, (b.d ? b.d/2 : b.w/2), b.h, 16) : new THREE.BoxGeometry(b.w, b.h, depth);
            const mat = new THREE.MeshStandardMaterial({ color: blockCol, roughness: 0.8 });
            const pMesh = new THREE.Mesh(geom, mat);
            pMesh.position.set(b.offsetX || 0, b.y, b.offsetZ || 0);
            pMesh.rotation.y = b.rotY || 0;
            previewGroup.add(pMesh);

            createSimpleEntity(x, y, z, b.w, b.h, depth, blockCol, b.type || 'box', b.rotY || 0, category, buildingId, idx, previewGroup);
        });
    }

    function buildSkyscraper(cx, cz, color, style) {
        let blocks = []; 
        let cy = 0;

        if (style === 0) {
            let floors = 5 + Math.floor(Math.random() * 4); 
            let w = 4.0 + Math.random() * 2.0;
            for (let i = 0; i < floors; i++) { 
                let h = 1.2 + Math.random() * 0.5; 
                blocks.push({ y: cy + h/2, w: w, h: h, type: 'box' }); 
                cy += h; 
                w *= 0.82; 
            }
        } else if (style === 1) {
            let h = 2.0 + Math.random(), w = 4.5; 
            blocks.push({ y: cy + h/2, w: w, h: h, type: 'box' }); cy += h;
            h = 6 + Math.random() * 4; w = 1.8; 
            blocks.push({ y: cy + h/2, w: w, h: h, type: 'box' }); cy += h;
            h = 1.5; w = 3.5; 
            blocks.push({ y: cy + h/2, w: w, h: h, type: 'box' }); cy += h;
            h = 4; w = 0.5; 
            blocks.push({ y: cy + h/2, w: w, h: h, type: 'cylinder' });
        } else if (style === 2) {
            let floors = 7 + Math.floor(Math.random() * 4); 
            let w = 3.5, h = 1.2, rot = 0;
            for(let i = 0; i < floors; i++) { 
                blocks.push({ y: cy + h/2, w: w, h: h, type: 'box', rotY: rot }); 
                cy += h; 
                rot += 0.25; 
            }
        } else if (style === 3) {
            let floors = 7 + Math.floor(Math.random() * 4); 
            let w = 3.5, h = 1.1;
            for(let i = 0; i < floors; i++) { 
                let offsetX = Math.sin(i * 0.7) * (w * 0.2); 
                blocks.push({ y: cy + h/2, w: w, h: h, type: 'box', offsetX }); 
                cy += h; 
                w *= 0.96; 
            }
        } else if (style === 4) {
            let baseH = 1.4, baseW = 5.2;
            blocks.push({ y: cy + baseH/2, w: baseW, h: baseH, type: 'box', offsetX: 0 }); cy += baseH;
            blocks.push({ y: cy + 0.65, w: 4.2, h: 1.3, type: 'box', offsetX: -0.5 }); cy += 1.3;
            blocks.push({ y: cy + 0.65, w: 3.2, h: 1.3, type: 'box', offsetX: 0.6 }); cy += 1.3;
            blocks.push({ y: cy + 0.65, w: 4.2, h: 1.3, type: 'box', offsetX: -0.4 }); cy += 1.3;
            blocks.push({ y: cy + 0.7, w: 2.4, h: 1.4, type: 'box', offsetX: 0.7 }); cy += 1.4;
            blocks.push({ y: cy + 0.75, w: 1.3, h: 1.5, type: 'box', offsetX: 1.1 }); cy += 1.5;
            blocks.push({ y: cy + 1.2, w: 0.35, h: 2.4, type: 'cylinder', offsetX: 1.1 });
        } else if (style === 5) {
            let colH = 1.2;
            for (let i = 0; i < 5; i++) {
                blocks.push({ y: cy + colH/2, w: 1.8, d: 1.8, h: colH, type: 'box', offsetX: -1.5 });
                blocks.push({ y: cy + colH/2, w: 1.8, d: 1.8, h: colH, type: 'box', offsetX: 1.5 });
                cy += colH;
            }
            blocks.push({ y: cy + 0.6, w: 5.0, d: 2.0, h: 1.2, type: 'box', offsetX: 0 }); cy += 1.2;
            blocks.push({ y: cy + 0.7, w: 1.2, d: 1.2, h: 1.4, type: 'box', offsetX: -1.5 });
            blocks.push({ y: cy + 0.7, w: 1.2, d: 1.2, h: 1.4, type: 'box', offsetX: 1.5 }); cy += 1.4;
            blocks.push({ y: cy + 1.0, w: 0.3, h: 2.0, type: 'cylinder', offsetX: -1.5 });
            blocks.push({ y: cy + 1.0, w: 0.3, h: 2.0, type: 'cylinder', offsetX: 1.5 });
        } else if (style === 6) {
            let jFloors = 6 + Math.floor(Math.random() * 3);
            let longDim = 4.6, shortDim = 2.2, floorH = 1.2;
            for (let i = 0; i < jFloors; i++) {
                let isX = i % 2 === 0;
                let shift = (Math.random() - 0.5) * 1.0;
                blocks.push({
                    y: cy + floorH/2,
                    w: isX ? longDim : shortDim,
                    d: isX ? shortDim : longDim,
                    h: floorH,
                    type: 'box',
                    offsetX: isX ? shift : 0,
                    offsetZ: isX ? 0 : shift
                });
                cy += floorH;
                longDim *= 0.94;
                shortDim *= 0.94;
            }
            blocks.push({ y: cy + 0.8, w: 1.2, h: 1.6, type: 'cylinder' });
        } else if (style === 7) {
            let bH = 1.3;
            blocks.push({ y: cy + bH/2, w: 4.8, d: 4.8, h: bH, type: 'box' }); cy += bH;
            blocks.push({ y: cy + bH/2, w: 3.8, d: 3.8, h: bH, type: 'box' }); cy += bH;
            blocks.push({ y: cy + 2.5, w: 1.8, d: 1.8, h: 5.0, type: 'box' }); cy += 5.0;
            blocks.push({ y: cy + 0.8, w: 4.6, d: 4.6, h: 1.6, type: 'box' }); cy += 1.6;
            blocks.push({ y: cy + 0.6, w: 3.2, d: 3.2, h: 1.2, type: 'cylinder' }); cy += 1.2;
            blocks.push({ y: cy + 1.2, w: 0.4, h: 2.4, type: 'cylinder' });
        } else if (style === 8) {
            let zSteps = 5, curW = 5.6, stepH = 1.3;
            for (let i = 0; i < zSteps; i++) {
                blocks.push({ y: cy + stepH/2, w: curW, d: curW, h: stepH, type: 'box' });
                cy += stepH;
                curW -= 0.9;
            }
            blocks.push({ y: cy + 1.5, w: 0.4, h: 3.0, type: 'cylinder' });
        } else if (style === 9) {
            blocks.push({ y: cy + 0.9, w: 5.2, d: 5.2, h: 1.8, type: 'box' }); cy += 1.8;
            blocks.push({ y: cy + 0.7, w: 4.2, d: 4.2, h: 1.4, type: 'box' }); cy += 1.4;
            blocks.push({ y: cy + 2.0, w: 3.6, d: 3.6, h: 4.0, type: 'cylinder' }); cy += 4.0;
            blocks.push({ y: cy + 0.4, w: 4.8, d: 4.8, h: 0.8, type: 'box' }); cy += 0.8;
            blocks.push({ y: cy + 1.2, w: 2.6, d: 2.6, h: 2.4, type: 'cylinder' }); cy += 2.4;
            blocks.push({ y: cy + 0.6, w: 1.6, d: 1.6, h: 1.2, type: 'box' }); cy += 1.2;
            blocks.push({ y: cy + 1.2, w: 0.3, h: 2.4, type: 'cylinder' });
        } else if (style === 10) {
            let baseH = 1.4;
            blocks.push({ y: cy + baseH/2, w: 5.6, d: 5.6, h: baseH, type: 'box' }); cy += baseH;
            blocks.push({ y: cy + 3.0, w: 2.0, d: 2.0, h: 6.0, type: 'box' });
            let siloR = 1.2, siloH = 6.0, offset = 1.8;
            blocks.push({ y: cy + 3.0, w: siloR, d: siloR, h: siloH, type: 'cylinder', offsetX: -offset, offsetZ: -offset });
            blocks.push({ y: cy + 3.0, w: siloR, d: siloR, h: siloH, type: 'cylinder', offsetX: offset, offsetZ: -offset });
            blocks.push({ y: cy + 3.0, w: siloR, d: siloR, h: siloH, type: 'cylinder', offsetX: -offset, offsetZ: offset });
            blocks.push({ y: cy + 3.0, w: siloR, d: siloR, h: siloH, type: 'cylinder', offsetX: offset, offsetZ: offset });
            cy += 6.0;
            blocks.push({ y: cy + 0.5, w: 5.0, d: 5.0, h: 1.0, type: 'box' }); cy += 1.0;
            blocks.push({ y: cy + 1.0, w: 2.8, d: 2.8, h: 2.0, type: 'cylinder' }); cy += 2.0;
            blocks.push({ y: cy + 1.5, w: 0.4, h: 3.0, type: 'cylinder' });
        } else if (style === 11) {
            let pFloors = 5, curW = 3.6, curDisc = 5.4;
            for (let i = 0; i < pFloors; i++) {
                blocks.push({ y: cy + 0.6, w: curW, d: curW, h: 1.2, type: 'box' }); cy += 1.2;
                blocks.push({ y: cy + 0.2, w: curDisc, d: curDisc, h: 0.4, type: 'cylinder' }); cy += 0.4;
                curW *= 0.86;
                curDisc *= 0.86;
            }
            blocks.push({ y: cy + 1.5, w: 0.4, h: 3.0, type: 'cylinder' });
        } else if (style === 12) {
            blocks.push({ y: cy + 0.8, w: 4.8, d: 4.8, h: 1.6, type: 'box' }); cy += 1.6;
            blocks.push({ y: cy + 3.5, w: 1.6, d: 1.6, h: 7.0, type: 'cylinder' }); cy += 7.0;
            blocks.push({ y: cy + 0.6, w: 5.4, d: 5.4, h: 1.2, type: 'cylinder' }); cy += 1.2;
            blocks.push({ y: cy + 0.6, w: 3.4, d: 3.4, h: 1.2, type: 'box' }); cy += 1.2;
            blocks.push({ y: cy + 0.5, w: 2.2, d: 2.2, h: 1.0, type: 'cylinder' }); cy += 1.0;
            blocks.push({ y: cy + 1.8, w: 0.3, h: 3.6, type: 'cylinder' });
        } else if (style === 13) {
            let coreH = 8.5;
            blocks.push({ y: cy + 0.7, w: 4.4, d: 4.4, h: 1.4, type: 'box' }); cy += 1.4;
            blocks.push({ y: cy + coreH/2, w: 2.0, d: 2.0, h: coreH, type: 'box' });
            for (let i = 0; i < 5; i++) {
                let podY = cy + (i * 1.6) + 0.8;
                let isCyl = i % 2 === 1;
                let side = i % 4;
                let ox = side === 0 ? 1.8 : (side === 1 ? -1.8 : 0);
                let oz = side === 2 ? 1.8 : (side === 3 ? -1.8 : 0);
                blocks.push({
                    y: podY,
                    w: 1.4,
                    d: 1.4,
                    h: 1.2,
                    type: isCyl ? 'cylinder' : 'box',
                    offsetX: ox,
                    offsetZ: oz
                });
            }
            cy += coreH;
            blocks.push({ y: cy + 0.6, w: 2.6, d: 2.6, h: 1.2, type: 'box' }); cy += 1.2;
            blocks.push({ y: cy + 1.0, w: 0.35, h: 2.0, type: 'cylinder' });
        } else if (style === 14) {
            blocks.push({ y: cy + 1.0, w: 5.4, d: 5.4, h: 2.0, type: 'box' }); cy += 2.0;
            blocks.push({ y: cy + 1.2, w: 3.4, d: 3.4, h: 2.4, type: 'box' });
            let tR = 0.8, tH = 2.4, tOff = 2.1;
            blocks.push({ y: cy + 1.2, w: tR, d: tR, h: tH, type: 'cylinder', offsetX: -tOff, offsetZ: -tOff });
            blocks.push({ y: cy + 1.2, w: tR, d: tR, h: tH, type: 'cylinder', offsetX: tOff, offsetZ: -tOff });
            blocks.push({ y: cy + 1.2, w: tR, d: tR, h: tH, type: 'cylinder', offsetX: -tOff, offsetZ: tOff });
            blocks.push({ y: cy + 1.2, w: tR, d: tR, h: tH, type: 'cylinder', offsetX: tOff, offsetZ: tOff });
            cy += 2.4;

            blocks.push({ y: cy + 0.6, w: 2.6, d: 2.6, h: 1.2, type: 'cylinder' }); cy += 1.2;
            blocks.push({ y: cy + 0.4, w: 1.6, d: 1.6, h: 0.8, type: 'cylinder' }); cy += 0.8;
            blocks.push({ y: cy + 1.5, w: 0.35, h: 3.0, type: 'cylinder' });
        }

        spawnBuildingStack(cx, cz, blocks, color, 'Skyscraper');
    }

    function spawnCity(startX, startZ) {
        const downtowns = [];
        for(let i=0; i<6; i++) downtowns.push({ x: (Math.random()-0.5)*WORLD_SIZE*0.7, z: (Math.random()-0.5)*WORLD_SIZE*0.7 });

        const inset = 1.8; 
        for (let i = 0; i < polygon.length; i++) {
            const p1 = polygon[i], p2 = polygon[(i + 1) % polygon.length];
            const dx = p2.x - p1.x; const dy = p2.y - p1.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist <= 0.001) continue;
            
            const nx = -dy / dist; const nz = dx / dist;
            const count = Math.max(1, Math.floor(dist / 2.05));
            const angle = Math.atan2(dy, dx);
            
            for (let j = 0; j < count; j++) {
                const d = j * (dist/count) + ((dist/count) / 2);
                const fx = p1.x + Math.cos(angle)*d + (nx * inset);
                const fz = p1.y + Math.sin(angle)*d + (nz * inset);
                createSimpleEntity(fx, 0.6, fz, 2.0, 1.2, 0.4, 0x8b4513, 'box', -angle, 'Fence');
            }
        }

        const GRID_SIZE = 6.5; 
        for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x += GRID_SIZE) {
            for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z += GRID_SIZE) {
                if (!isPointInPolygon(x, z, polygon)) continue; 
                
                let minDistToDt = Infinity;
                downtowns.forEach(dt => { minDistToDt = Math.min(minDistToDt, Math.sqrt((x - dt.x)**2 + (z - dt.z)**2)); });
                const distToSpawn = Math.sqrt((x - startX)**2 + (z - startZ)**2);
                
                const coastDist = getPolygonRadius(Math.atan2(z, x));
                const distToCenter = Math.sqrt(x*x + z*z);
                
                if (coastDist - distToCenter < 8) continue; 

                const cx = x + (Math.random() - 0.5);
                const cz = z + (Math.random() - 0.5);
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                if (distToSpawn < 12) {
                    if (Math.random() > 0.3) createSimpleEntity(cx, 0.4, cz, 0.8, 0.8, 0.8, 0xffff00, 'box', 0, 'Small Box'); 
                    if (Math.random() > 0.5) createSimpleEntity(cx+1.5, 0.4, cz-1.5, 0.6, 0.8, 0.6, 0x4caf50, 'cylinder', 0, 'Bush');
                    continue; 
                }

                if (minDistToDt < 15 && Math.random() > 0.3) {
                    buildSkyscraper(cx, cz, color, Math.floor(Math.random() * 15));
                } else if (minDistToDt < 30 && Math.random() > 0.4) {
                    let oType = Math.floor(Math.random() * 3);
                    if (oType === 0) {
                        spawnBuildingStack(cx, cz, [
                            { y: 1.5, w: 3.2, h: 3.0, type: 'box' },
                            { y: 3.6, w: 2.2, h: 1.2, type: 'cylinder' },
                            { y: 4.5, w: 0.3, h: 1.0, type: 'cylinder' }
                        ], color, 'Office Building');
                    } else if (oType === 1) {
                        spawnBuildingStack(cx, cz, [
                            { y: 1.3, w: 3.0, d: 3.0, h: 2.6, type: 'box' },
                            { y: 1.3, w: 1.6, d: 1.6, h: 2.6, type: 'cylinder', offsetX: 2.35 },
                            { y: 3.1, w: 2.4, d: 2.4, h: 1.0, type: 'box' }
                        ], color, 'Office Building');
                    } else {
                        spawnBuildingStack(cx, cz, [
                            { y: 1.2, w: 2.0, d: 2.0, h: 2.4, type: 'cylinder', offsetX: -1.75 },
                            { y: 1.2, w: 2.0, d: 2.0, h: 2.4, type: 'cylinder', offsetX: 1.75 },
                            { y: 1.2, w: 1.4, d: 1.6, h: 2.0, type: 'box' },
                            { y: 2.8, w: 4.6, d: 2.4, h: 0.8, type: 'box' }
                        ], color, 'Office Building');
                    }
                } else if (Math.random() > 0.3) {
                    let hType = Math.floor(Math.random() * 3);
                    if (hType === 0) {
                        spawnBuildingStack(cx, cz, [
                            { y: 1.0, w: 2.2, h: 2.0, type: 'box' },
                            { y: 2.5, w: 1.6, h: 1.0, type: 'box' }
                        ], color, 'House');
                    } else if (hType === 1) {
                        spawnBuildingStack(cx, cz, [
                            { y: 0.9, w: 2.2, d: 2.0, h: 1.8, type: 'box' },
                            { y: 0.9, w: 1.4, d: 1.4, h: 1.8, type: 'cylinder', offsetX: 1.85 },
                            { y: 2.2, w: 1.8, d: 1.6, h: 0.8, type: 'box' }
                        ], color, 'House');
                    } else {
                        spawnBuildingStack(cx, cz, [
                            { y: 0.9, w: 2.0, h: 1.8, type: 'cylinder' },
                            { y: 1.9, w: 1.4, h: 0.8, type: 'box' },
                            { y: 2.5, w: 0.3, h: 0.8, type: 'cylinder' }
                        ], color, 'House');
                    }
                }
            }
        }
    }

    function generateObjectives() {
        const percent = difficultyConfig.min + Math.random() * (difficultyConfig.max - difficultyConfig.min);
        const targetScore = Math.floor(totalWorldPoints * percent);
        
        objectives = [{
            id: 0, desc: `Score ${targetScore} pts (${difficultyConfig.name})`,
            target: targetScore, current: 0, achieved: false, failed: false, cat: 'Score', timeLimit: null, thumb: null
        }];

        const groups = {};
        items.forEach(it => {
            if(it.cat === 'Fence' || it.cat === 'Small Box' || it.cat === 'Bush') return; 
            const key = it.cat + '_' + it.color;
            if(!groups[key]) {
                groups[key] = { 
                    count: 0, 
                    cat: it.cat, 
                    color: it.color, 
                    previewObj: it.previewObj,
                    buildingIds: new Set()
                };
            }
            groups[key].count++;
            if (it.buildingId) groups[key].buildingIds.add(it.buildingId);
        });

        const validGroups = Object.values(groups).filter(g => g.count >= 2).sort(() => 0.5 - Math.random());

        for (let i = 1; i <= 2; i++) {
            if (validGroups.length > 0) {
                const group = validGroups.pop();
                const hasBuildings = group.buildingIds.size > 0;
                let reqCount, desc, targetType;

                if (hasBuildings) {
                    targetType = 'building';
                    reqCount = Math.min(group.buildingIds.size, Math.floor(Math.random() * 2) + 1);
                    desc = `Eat ${reqCount} ${group.cat}${reqCount > 1 ? 's' : ''}`;
                } else {
                    targetType = 'block';
                    reqCount = Math.min(group.count, Math.floor(Math.random() * 5) + 2);
                    desc = `Eat ${reqCount} ${group.cat}${reqCount > 1 ? 's' : ''}`;
                }

                let hasTimeLimit = Math.random() > 0.5;
                let limit = null;
                if (hasTimeLimit) {
                    let minTime = hasBuildings ? 45 : 30;
                    limit = minTime + Math.floor(Math.random() * 30);
                    if (limit > GAME_TIME - 15) limit = null; 
                }

                if (limit) desc += ` in first ${limit}s`;

                objectives.push({
                    id: i, 
                    desc, 
                    target: reqCount, 
                    current: 0, 
                    achieved: false, 
                    failed: false,
                    cat: group.cat, 
                    color: group.color, 
                    targetType, 
                    timeLimit: limit, 
                    thumb: createSnapshot(group.previewObj)
                });
            } else {
                objectives.push({
                    id: i, desc: "Survive", target: 1, current: 1, achieved: true, failed: false, cat: 'Survive', timeLimit: null, thumb: null
                });
            }
        }
    }

    function checkItemObjective(item) {
        let buildingFullyEaten = false;
        if (item.buildingId && buildingMap[item.buildingId]) {
            buildingMap[item.buildingId].eatenBlocks++;
            if (buildingMap[item.buildingId].eatenBlocks >= buildingMap[item.buildingId].totalBlocks) {
                buildingFullyEaten = true;
            }
        }

        objectives.forEach(obj => {
            if (obj.id > 0 && !obj.achieved && !obj.failed && obj.cat === item.cat && obj.color === item.color) {
                if (obj.targetType === 'building') {
                    if (buildingFullyEaten) {
                        obj.current++;
                        if (obj.current >= obj.target) {
                            obj.achieved = true;
                            document.getElementById(`ui-star-${obj.id}`).classList.add('achieved');
                        }
                    }
                } else {
                    obj.current++;
                    if (obj.current >= obj.target) {
                        obj.achieved = true;
                        document.getElementById(`ui-star-${obj.id}`).classList.add('achieved');
                    }
                }
                if (isPaused) populateObjectiveModal(); 
            }
        });
    }

    function updateScoreObjective() {
        const obj0 = objectives[0];
        obj0.current = score;
        if (score >= obj0.target && !obj0.achieved) {
            obj0.achieved = true;
            document.getElementById(`ui-star-0`).classList.add('achieved');
        }
        document.getElementById('score-text').innerText = `${score} / ${obj0.target} pts`;
        document.getElementById('score-text').style.color = obj0.achieved ? '#2ecc71' : '#fff';
    }

    window.showSettingsModal = () => { 
        isPaused = true; 
        document.getElementById('sens-mouse').value = mouseSpeed;
        document.getElementById('val-mouse').innerText = mouseSpeed;
        document.getElementById('sens-touch').value = touchSpeed;
        document.getElementById('val-touch').innerText = touchSpeed;
        document.getElementById('sens-key').value = keySpeed;
        document.getElementById('val-key').innerText = keySpeed;
        document.getElementById('settings-modal').style.display = 'flex'; 
    };
    window.showObjectivesModal = () => { isPaused = true; populateObjectiveModal(); document.getElementById('obj-modal').style.display = 'flex'; };
    window.resumeGame = (modalId) => { isPaused = false; document.getElementById(modalId).style.display = 'none'; lastCallTime = performance.now() / 1000; };
    window.nextLevel = () => startLevel(currentLevel + 1);
    window.retryLevel = () => startLevel(currentLevel);

    document.getElementById('sens-mouse').oninput = (e) => { mouseSpeed = parseFloat(e.target.value); document.getElementById('val-mouse').innerText = e.target.value; };
    document.getElementById('sens-touch').oninput = (e) => { touchSpeed = parseFloat(e.target.value); document.getElementById('val-touch').innerText = e.target.value; };
    document.getElementById('sens-key').oninput = (e) => { keySpeed = parseFloat(e.target.value); document.getElementById('val-key').innerText = e.target.value; };

    function updateUI() {
        document.getElementById('level-text').innerText = `Level ${currentLevel} - ${difficultyConfig.name}`;
        document.getElementById('level-text').style.color = difficultyConfig.color;
        for (let i=0; i<3; i++) {
            const el = document.getElementById(`ui-star-${i}`);
            el.className = 'star'; 
            if(objectives[i] && objectives[i].achieved) el.classList.add('achieved');
            if(objectives[i] && objectives[i].failed) el.classList.add('failed');
        }
        updateScoreObjective();
        updateGrowthUI();
    }

    function populateObjectiveModal() {
        const list = document.getElementById('obj-list');
        list.innerHTML = '';
        objectives.forEach(obj => {
            let imgHtml = obj.thumb ? `<img src="${obj.thumb}">` : `<div style="width:80px; height:80px; background:#444; border-radius:8px; display:flex; align-items:center; justify-content:center; border:1px solid #777;">★</div>`;
            let statusStr = obj.achieved ? '<span style="color:#2ecc71">DONE</span>' : (obj.failed ? '<span style="color:#e74c3c">FAILED</span>' : `${obj.current}/${obj.target}`);
            let div = document.createElement('div');
            div.className = 'obj-row';
            if(obj.achieved) div.style.border = "1px solid #2ecc71";
            if(obj.failed) div.style.border = "1px solid #e74c3c";
            
            div.innerHTML = `${imgHtml}<div class="obj-details"><div class="obj-desc">${obj.desc}</div>${obj.timeLimit ? `<div class="obj-prog">Time Limit: ${obj.timeLimit}s</div>` : ''}</div><div class="obj-status">${statusStr}</div>`;
            list.appendChild(div);
        });
    }

    function levelComplete() {
        gameActive = false; isPaused = true;
        const modal = document.getElementById('end-modal');
        const title = document.getElementById('end-title');
        modal.style.display = 'flex';
        document.getElementById('end-stats').innerText = `Final Score: ${score} Points\nHole Diameter: ${(targetHoleRadius * 2).toFixed(1)}m`;
        
        let starsHtml = '';
        let passed = objectives[0].achieved; 
        for(let i=0; i<3; i++) starsHtml += objectives[i].achieved ? '<span style="color:#ffd700; text-shadow:0 0 15px #ffaa00;">★</span>' : '<span style="color:#444;">★</span>';
        document.getElementById('end-stars').innerHTML = starsHtml;

        if (passed) { title.innerText = "LEVEL PASSED!"; title.style.color = "#2ecc71"; document.getElementById('btn-next').style.display = 'inline-block'; document.getElementById('btn-retry').style.display = 'none'; } 
        else { title.innerText = "LEVEL FAILED"; title.style.color = "#e74c3c"; document.getElementById('btn-next').style.display = 'none'; document.getElementById('btn-retry').style.display = 'inline-block'; }
    }
    document.getElementById('stars-container').addEventListener('click', showObjectivesModal);

    // --- Inputs ---
    const activeKeys = new Set();
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (isPaused) { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); isPaused = false; lastCallTime = performance.now() / 1000; } 
            else if (gameActive) { showSettingsModal(); }
        } else {
            activeKeys.add(e.key.toLowerCase());
        }
    });
    window.addEventListener('keyup', (e) => { activeKeys.delete(e.key.toLowerCase()); });
    window.addEventListener('blur', () => { 
        activeKeys.clear(); 
        inputVelocity.set(0, 0);
        mouseDir.set(0, 0);
    });

    let lastPointerType = 'mouse';
    const mouseDir = new THREE.Vector2(0, 0);
    let inputVelocity = new THREE.Vector2(0, 0);
    let isDragging = false;
    let dragStart = new THREE.Vector2();
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');

    window.addEventListener('pointerdown', (e) => {
        lastPointerType = e.pointerType;
        if(e.pointerType === 'mouse') return; 
        
        if(isPaused || e.target.tagName === 'BUTTON' || e.target.closest('#stars-container') || e.target.tagName === 'INPUT') return;
        isDragging = true;
        dragStart.set(e.clientX, e.clientY);
        inputVelocity.set(0, 0);
        joystickBase.style.display = 'block';
        joystickBase.style.left = e.clientX + 'px';
        joystickBase.style.top = e.clientY + 'px';
        joystickKnob.style.transform = `translate(-50%, -50%)`;
    });

    window.addEventListener('pointermove', (e) => {
        lastPointerType = e.pointerType;
        if(e.pointerType === 'mouse') {
            const nx = (e.clientX / window.innerWidth) * 2 - 1;
            const ny = (e.clientY / window.innerHeight) * 2 - 1;
            const dist = Math.sqrt(nx * nx + ny * ny);
            const deadzone = 0.05;
            
            if (dist < deadzone) {
                mouseDir.set(0, 0);
            } else {
                const strength = Math.min(1.0, (dist - deadzone) / 0.7);
                mouseDir.set((nx / dist) * strength, (ny / dist) * strength);
            }
        } else {
            if(!isDragging || isPaused) return;
            let dx = e.clientX - dragStart.x;
            let dy = e.clientY - dragStart.y;
            
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxDist = 60;
            if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            inputVelocity.x = dx / maxDist; 
            inputVelocity.y = dy / maxDist;
        }
    });

    const stopTouch = (e) => {
        if (e.pointerType === 'mouse') return;
        isDragging = false; 
        joystickBase.style.display = 'none';
        inputVelocity.set(0, 0);
    };
    window.addEventListener('pointerup', stopTouch);
    window.addEventListener('pointercancel', stopTouch);
    window.addEventListener('pointerleave', stopTouch);

    function updateHoleVisuals(radius) {
        holeGroup.scale.set(radius, 1, radius);
        groundUniforms.holeRadius.value = radius;
    }

    const timeStep = 1 / 60;
    let lastCallTime = performance.now() / 1000;
    
    // Pure Void Collision Masks
    const maskGroundOnly = CG_GROUND | CG_ALL_OBJS; 
    const maskVoidFall   = CG_ALL_OBJS;            
    
    const _camToHole = new THREE.Vector3();
    const _camToItem = new THREE.Vector3();

    function animate() {
        requestAnimationFrame(animate);
        if (!gameActive || isPaused) { 
            renderer.render(scene, camera); 
            return; 
        }

        const time = performance.now() / 1000;
        const dt = Math.min(time - lastCallTime, 0.1); 
        lastCallTime = time;

        timeLeft -= dt;
        const mins = Math.floor(Math.max(0, timeLeft) / 60); 
        const secs = Math.floor(Math.max(0, timeLeft) % 60);
        document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        let elapsed = GAME_TIME - timeLeft;
        objectives.forEach(obj => {
            if (obj.timeLimit && !obj.achieved && !obj.failed && elapsed >= obj.timeLimit) { 
                obj.failed = true; 
                document.getElementById(`ui-star-${obj.id}`).classList.add('failed'); 
            }
        });
        if (timeLeft <= 0) {
            levelComplete();
            return;
        }

        // --- Smooth 2-Second Hole Growth Animation ---
        if (Math.abs(holeRadius - targetHoleRadius) > 0.001) {
            holeRadius += (targetHoleRadius - holeRadius) * (1 - Math.exp(-2.2 * dt));
            updateHoleVisuals(holeRadius);
        } else {
            holeRadius = targetHoleRadius;
        }

        if (holeTopMesh) holeTopMesh.rotation.z += 0.02;

        let currentMode = 'mouse';
        if (activeKeys.size > 0) currentMode = 'keyboard';
        else if (lastPointerType !== 'mouse' && isDragging) currentMode = 'touch';
        else if (lastPointerType !== 'mouse' && !isDragging) currentMode = 'touch-inertia';

        const baseSpeed = (20 + holeRadius * 2);

        if (currentMode === 'keyboard') {
            let kx = 0, ky = 0;
            if(activeKeys.has('arrowup') || activeKeys.has('w')) ky -= 1;
            if(activeKeys.has('arrowdown') || activeKeys.has('s')) ky += 1;
            if(activeKeys.has('arrowleft') || activeKeys.has('a')) kx -= 1;
            if(activeKeys.has('arrowright') || activeKeys.has('d')) kx += 1;
            
            let vec = new THREE.Vector2(kx, ky);
            if(vec.lengthSq() > 0) vec.normalize();
            
            const kSpeed = baseSpeed * (keySpeed / 20);
            holeTarget.x += vec.x * kSpeed * dt;
            holeTarget.z += vec.y * kSpeed * dt;
            
        } else if (currentMode === 'touch' || currentMode === 'touch-inertia') {
            if (currentMode === 'touch-inertia') inputVelocity.multiplyScalar(0.90);

            const tSpeed = baseSpeed * (touchSpeed / 20);
            holeTarget.x += inputVelocity.x * tSpeed * dt;
            holeTarget.z += inputVelocity.y * tSpeed * dt;

        } else if (currentMode === 'mouse') {
            const mSpeed = baseSpeed * (mouseSpeed / 20);
            holeTarget.x += mouseDir.x * mSpeed * dt;
            holeTarget.z += mouseDir.y * mSpeed * dt;
        }

        const targetAngle = Math.atan2(holeTarget.z, holeTarget.x);
        const maxHoleR = getPolygonRadius(targetAngle) - holeRadius;
        const currentHoleR = Math.sqrt(holeTarget.x**2 + holeTarget.z**2);
        
        if (currentHoleR > maxHoleR && maxHoleR > 0) {
            holeTarget.x = (holeTarget.x / currentHoleR) * maxHoleR;
            holeTarget.z = (holeTarget.z / currentHoleR) * maxHoleR;
            inputVelocity.set(0, 0); 
        }

        holeGroup.position.copy(holeTarget);
        groundUniforms.holePos.value.copy(holeTarget);

        const camDist = 8 + (holeRadius * 2.5); 
        const camHeight = 7 + (holeRadius * 1.5);
        camera.position.lerp(new THREE.Vector3(holeTarget.x, camHeight, holeTarget.z + camDist), 0.08);
        
        cameraTarget.lerp(holeTarget, 0.15);
        camera.lookAt(cameraTarget);
        
        scene.fog.near = camDist + 5; 
        scene.fog.far = camDist + 70 + (holeRadius * 8);

        world.step(timeStep, dt, 3);
        
        _camToHole.subVectors(holeTarget, camera.position);
        const distToHole = _camToHole.length();
        _camToHole.normalize();

        const occludedBuildingIds = new Set();
        const occludedSingleItems = new Set();

        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            _camToItem.subVectors(item.mesh.position, camera.position);
            const distToItem = _camToItem.length();
            _camToItem.normalize();
            
            const blockingAngle = Math.min(0.35, 0.06 + (item.radius / Math.max(1, distToItem)));
            const isBetween = distToItem < distToHole - 3 && item.body.position.y > 0.1;
            
            if (isBetween && _camToHole.angleTo(_camToItem) < blockingAngle) {
                if (item.buildingId) {
                    occludedBuildingIds.add(item.buildingId);
                } else {
                    occludedSingleItems.add(item);
                }
            }
        }

        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            
            // --- Exponential Vertical Speed Reduction & Jump Height Clamping ---
            if (item.body.velocity.y > 0) {
                const vy = item.body.velocity.y;
                const decay = Math.exp(-6.0 * vy * dt);
                item.body.velocity.y = Math.min(vy * decay, 1.2);
            }

            const maxJumpThreshold = 0.5;
            if (item.body.position.y > item.initialY + maxJumpThreshold) {
                item.body.position.y = item.initialY + maxJumpThreshold;
                if (item.body.velocity.y > 0) item.body.velocity.y = 0;
            }

            const dx = item.body.position.x - holeTarget.x; 
            const dz = item.body.position.z - holeTarget.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            
            const isSubmerged = item.body.position.y < Math.min(item.initialY - 0.4, 0.2);
            const swallowed = isSubmerged && (dist < holeRadius * 1.25);
            
            // Island containment
            if (!swallowed && item.body.position.y > -2.0) {
                const itemAngle = Math.atan2(item.body.position.z, item.body.position.x);
                const maxIslandR = getPolygonRadius(itemAngle) - 0.5; 
                const itemDist = Math.sqrt(item.body.position.x**2 + item.body.position.z**2);
                
                if (itemDist > maxIslandR && maxIslandR > 0) {
                    item.body.position.x = (item.body.position.x / itemDist) * maxIslandR;
                    item.body.position.z = (item.body.position.z / itemDist) * maxIslandR;
                    item.body.velocity.set(0, item.body.velocity.y, 0); 
                    item.body.angularVelocity.set(0, 0, 0);
                }
            }
            
            item.mesh.position.copy(item.body.position); 
            item.mesh.quaternion.copy(item.body.quaternion);

            // Unified X-Ray
            const isObstructing = (item.buildingId && occludedBuildingIds.has(item.buildingId)) || occludedSingleItems.has(item);
            item.targetOpacity = isObstructing ? 0.2 : 1.0;

            if (Math.abs(item.mesh.material.opacity - item.targetOpacity) > 0.01) {
                item.mesh.material.opacity += (item.targetOpacity - item.mesh.material.opacity) * 0.18;
            }

            if (swallowed) {
                if (item.body.collisionFilterMask !== 0) item.body.collisionFilterMask = 0; 
                item.body.applyForce(new CANNON.Vec3(0, -item.body.mass * 35, 0), item.body.position);
                item.mesh.scale.multiplyScalar(0.88); 
            }

            if (item.body.position.y < -6 || item.mesh.scale.x < 0.08) {
                scene.remove(item.mesh);
                item.mesh.geometry?.dispose(); 
                item.mesh.material?.dispose(); 
                world.removeBody(item.body);
                items.splice(i, 1);
                
                if (item.mesh.scale.x < 0.25 || dist < holeRadius * 2.2) {
                    score += item.mass; 
                    updateScoreObjective(); 
                    checkItemObjective(item);
                    
                    holePoints += item.mass;
                    
                    // Trigger level-up target expansion
                    while (holePoints >= targetHolePoints) {
                        holePoints -= targetHolePoints;
                        holeLevel++;
                        
                        let percent = getGrowthPercent(holeLevel);
                        targetHoleRadius *= (1 + percent);
                        scoreMultiplier *= (1 + percent);
                        
                        targetHolePoints = getNextTargetPoints(holeLevel);
                    }
                    
                    updateGrowthUI();
                }
                
                if (items.length === 0) levelComplete(); 
                continue;
            }

            // Pure Void Ingestion: Dropping objects lose ground support without any rim collision
            if (!swallowed) {
                const overHole = dist < holeRadius;
                if (overHole) { 
                    if (item.body.collisionFilterMask !== maskVoidFall) { 
                        item.body.collisionFilterMask = maskVoidFall; 
                        item.body.wakeUp(); 
                    } 
                } else if (item.body.position.y > -0.2 && item.body.collisionFilterMask !== maskGroundOnly) {
                    item.body.collisionFilterMask = maskGroundOnly;
                }
            }
        }
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
    });

    startLevel(currentLevel);
    animate();
</script>
