<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AKalls</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --primary: #34c759; --danger: #ff3b30; --blue: #007aff; --text: #fff; --gray: rgba(255,255,255,0.12); }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { background-color: #0a0a0a; color: var(--text); margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        .app-shell { width: 100%; max-width: 450px; height: 100dvh; background: var(--bg); position: relative; display: flex; flex-direction: column; border-left: 1px solid #222; border-right: 1px solid #222; }

        .view { display: none; flex-direction: column; height: 100%; width: 100%; overflow: hidden; position: relative; }
        .view.active { display: flex; }

        /* Header */
        .header { padding: calc(10px + env(safe-area-inset-top)) 15px 10px; text-align: center; border-bottom: 1px solid #222; z-index: 50; }
        .app-name { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -1px; margin-bottom: 5px; }
        #user-name-input { background: none; border: none; color: #aaa; font-size: 13px; text-align: center; width: 100%; outline: none; margin-bottom: 8px; border-bottom: 1px dashed #333; }

        /* Dialer & Logs */
        .dial-wrap { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        #dial-display { font-size: 48px; text-align: center; margin-bottom: 15px; letter-spacing: 5px; height: 60px; font-weight: 200; }
        
        .log-item { display: flex; justify-content: space-between; align-items: center; background: var(--gray); padding: 12px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
        .log-info b { font-size: 15px; display: block; }
        .log-info span { font-size: 11px; color: #777; }
        .log-type-tag { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-right: 8px; text-transform: uppercase; }

        /* Keypad */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; justify-items: center; margin-top: auto; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .key { width: 70px; height: 70px; background: var(--gray); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 26px; font-weight: bold; }
        .key.call-btn { background: var(--primary); grid-column: 2; }

        /* Call Screen */
        .video-main { flex-grow: 1; background: #000; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #local-video-container { position: absolute; top: 15px; right: 15px; width: 90px; height: 130px; border-radius: 12px; border: 1px solid #444; overflow: hidden; z-index: 10; }
        .mic-meter { position: absolute; bottom: 0; width: 100%; height: 4px; background: rgba(0,0,0,0.5); }
        #mic-bar { height: 100%; width: 0%; background: var(--primary); }

        .controls { 
            padding: 15px 5px calc(25px + env(safe-area-inset-bottom)); 
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;
            position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, #000); justify-items: center;
        }
        .btn-ctl { width: 45px; height: 45px; border-radius: 50%; border: none; background: var(--gray); color: #fff; font-size: 18px; cursor: pointer; }
        .btn-ctl.active { background: #fff; color: #000; }
        .btn-ctl.hangup { background: var(--danger); }

        /* Details Modal */
        .modal { position: absolute; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; padding: 20px; padding-top: env(safe-area-inset-top); overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .timeline-item { border-left: 2px solid var(--gray); padding-left: 15px; margin-bottom: 15px; position: relative; }
        .timeline-item::before { content: ''; width: 10px; height: 10px; background: var(--blue); border-radius: 50%; position: absolute; left: -6px; top: 3px; }
        .timeline-time { font-size: 10px; color: #666; font-family: monospace; }
        .timeline-desc { font-size: 13px; color: #eee; }

        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 150; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="view active" id="view-dialer">
            <div class="header">
                <div class="app-name">AKalls</div>
                <input type="text" id="user-name-input" placeholder="Enter your name">
                <div id="net-state" style="font-size: 10px; color: #ffc107;">CONNECTING...</div>
                <div class="id-pill" onclick="copyLink()">My ID: <b id="my-num-display">....</b> 🔗</div>
            </div>
            
            <div class="dial-wrap">
                <div id="dial-display"></div>
                <div style="font-size: 11px; color: #555; margin-bottom: 10px;">RECENT ACTIVITY</div>
                <div id="call-logs"></div>

                <div class="keypad">
                    <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div>
                    <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div>
                    <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div>
                    <div class="key" style="background:transparent; font-size: 18px; color: #444;" onclick="backspace()">⌫</div>
                    <div class="key" onclick="press('0')">0</div>
                    <div class="key call-btn" onclick="startCall()">📞</div>
                </div>
            </div>
        </div>

        <div id="view-call" class="view">
            <div class="video-main">
                <video id="remote-video" autoplay playsinline></video>
                <div id="local-video-container">
                    <video id="local-video" autoplay playsinline muted></video>
                    <div class="mic-meter"><div id="mic-bar"></div></div>
                </div>
            </div>
            <div class="controls">
                <button class="btn-ctl active" id="mic-btn" onclick="toggleMic()">🎤</button>
                <button class="btn-ctl active" id="cam-btn" onclick="toggleCam()">📷</button>
                <button class="btn-ctl" onclick="flipCamera()">🔄</button>
                <button class="btn-ctl" onclick="toggleScreen()">📺</button>
                <button class="btn-ctl" onclick="togglePiP()">🖼️</button>
                <button class="btn-ctl hangup" onclick="hangup(true)">📵</button>
            </div>
        </div>

        <!-- DETAILS MODAL -->
        <div id="details-modal" class="modal">
            <div class="modal-header">
                <h2 style="margin:0; font-size:18px;">Call Timeline</h2>
                <button onclick="closeModal()" style="background:var(--gray); border:none; color:white; padding:5px 12px; border-radius:8px;">Close</button>
            </div>
            <div id="modal-summary" style="margin-bottom:20px; color:var(--primary); font-weight:bold;"></div>
            <div id="timeline-content"></div>
        </div>

        <div id="incoming-overlay" class="overlay">
            <h1 id="caller-name" style="font-size: 40px; margin-bottom: 40px;">0000</h1>
            <div style="display:flex; gap: 40px;">
                <button class="btn-ctl hangup" style="width:70px; height:70px;" onclick="location.reload()">✕</button>
                <button class="btn-ctl" style="background:var(--primary); width:70px; height:70px;" onclick="answerCall()">✔</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. PERSISTENT STORAGE (Stable Keys) ---
        const STORAGE = { ID: 'akalls_id', NAME: 'akalls_name', LOGS: 'akalls_history' };
        
        let myNum = localStorage.getItem(STORAGE.ID) || Math.floor(1000 + Math.random() * 9000).toString();
        localStorage.setItem(STORAGE.ID, myNum);
        document.getElementById('my-num-display').innerText = myNum;

        const nameInput = document.getElementById('user-name-input');
        nameInput.value = localStorage.getItem(STORAGE.NAME) || "";
        nameInput.oninput = () => localStorage.setItem(STORAGE.NAME, nameInput.value);

        // --- 2. PEERJS ---
        const peer = new Peer('P-' + myNum, {
            config: { iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "turn:global.relay.metered.ca:80", username: "c198465a34d3f8e5ae248d9e", credential: "5BRzxWFSps2G0yOR" },
                { urls: "turn:global.relay.metered.ca:443", username: "c198465a34d3f8e5ae248d9e", credential: "5BRzxWFSps2G0yOR" }
            ]}
        });

        let localStream, currentCall, dataConn, audioCtx, analyser, heartbeatTimer;
        let callEvents = [], callStartTime = 0;

        peer.on('open', () => { document.getElementById('net-state').innerText = "ONLINE"; renderLogs(); });

        // --- 3. EVENT RECORDER ---
        function recordEvent(desc) {
            const elapsed = callStartTime ? Math.floor((Date.now() - callStartTime) / 1000) : 0;
            const m = Math.floor(elapsed / 60);
            const s = elapsed % 60;
            const timestamp = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            callEvents.push({ time: timestamp, desc });
        }

        // --- 4. CALL HANDLING ---
        peer.on('connection', conn => {
            dataConn = conn;
            conn.on('data', data => {
                if (data === 'BYE') terminateCall("Peer ended call");
            });
        });

        peer.on('call', call => {
            currentCall = call;
            document.getElementById('caller-name').innerText = (call.metadata && call.metadata.name) || call.peer.replace('P-', '');
            document.getElementById('incoming-overlay').style.display = 'flex';
        });

        async function startCall() {
            const num = document.getElementById('dial-display').innerText;
            if(!num) return;
            switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('local-video').srcObject = localStream;
            
            callStartTime = Date.now();
            callEvents = [];
            recordEvent("Call started (Outgoing)");
            
            const target = 'P-' + num.padStart(4, '0');
            dataConn = peer.connect(target);
            const call = peer.call(target, localStream, { metadata: { name: nameInput.value } });
            setupStream(call, num, 'OUT');
        }

        async function answerCall() {
            document.getElementById('incoming-overlay').style.display = 'none';
            switchView('view-call');
            localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('local-video').srcObject = localStream;
            
            callStartTime = Date.now();
            callEvents = [];
            recordEvent("Call answered (Incoming)");

            currentCall.answer(localStream);
            dataConn = peer.connect(currentCall.peer);
            setupStream(currentCall, currentCall.peer.replace('P-',''), 'IN');
        }

        function setupStream(call, num, type) {
            currentCall = call;
            call.on('stream', rem => {
                document.getElementById('remote-video').srcObject = rem;
                recordEvent("Remote video stream received");
            });
            initVisualizer(localStream);
        }

        function terminateCall(reason) {
            recordEvent(reason || "Call ended");
            const duration = Math.floor((Date.now() - callStartTime) / 1000);
            
            // Save Log
            const logs = JSON.parse(localStorage.getItem(STORAGE.LOGS) || '[]');
            const num = currentCall ? currentCall.peer.replace('P-','') : 'Unknown';
            logs.unshift({
                num,
                duration: `${Math.floor(duration/60)}m ${duration%60}s`,
                events: [...callEvents],
                time: new Date().toLocaleString(),
                type: currentCall ? (currentCall.metadata ? 'IN' : 'OUT') : '?'
            });
            localStorage.setItem(STORAGE.LOGS, JSON.stringify(logs.slice(0, 15)));

            if (localStream) localStream.getTracks().forEach(t => t.stop());
            switchView('view-dialer');
            renderLogs();
            analyser = null;
        }

        // --- 5. LOGS & MODAL ---
        function renderLogs() {
            const logs = JSON.parse(localStorage.getItem(STORAGE.LOGS) || '[]');
            document.getElementById('call-logs').innerHTML = logs.map((l, i) => `
                <div class="log-item" onclick="viewDetails(${i})">
                    <div class="log-info">
                        <b>${l.num}</b>
                        <span>${l.time} • ${l.duration}</span>
                    </div>
                    <span class="log-type-tag ${l.type === 'IN' ? 'type-in' : 'type-out'}" style="background:${l.type==='IN'?'#34c759':'#007aff'}">
                        ${l.type}
                    </span>
                </div>
            `).join('');
        }

        function viewDetails(index) {
            const log = JSON.parse(localStorage.getItem(STORAGE.LOGS))[index];
            document.getElementById('modal-summary').innerText = `Call with ${log.num} (${log.duration})`;
            document.getElementById('timeline-content').innerHTML = log.events.map(e => `
                <div class="timeline-item">
                    <div class="timeline-time">${e.time}</div>
                    <div class="timeline-desc">${e.desc}</div>
                </div>
            `).join('');
            document.getElementById('details-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('details-modal').style.display = 'none'; }

        // --- 6. CONTROLS ---
        function toggleMic() {
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            recordEvent(track.enabled ? "Microphone Unmuted" : "Microphone Muted");
            document.getElementById('mic-btn').classList.toggle('active');
        }

        function toggleCam() {
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            recordEvent(track.enabled ? "Camera Turned On" : "Camera Turned Off");
            document.getElementById('cam-btn').classList.toggle('active');
        }

        async function flipCamera() {
            recordEvent("Switching Camera...");
            const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:true});
            currentCall.peerConnection.getSenders().find(x=>x.track.kind==='video').replaceTrack(s.getVideoTracks()[0]);
            document.getElementById('local-video').srcObject = s;
            recordEvent("Camera flipped to back");
        }

        async function toggleScreen() {
            try {
                const s = await navigator.mediaDevices.getDisplayMedia({video:true});
                recordEvent("Started Screen Sharing");
                currentCall.peerConnection.getSenders().find(x=>x.track.kind==='video').replaceTrack(s.getVideoTracks()[0]);
                s.getVideoTracks()[0].onended = () => recordEvent("Screen share ended");
            } catch(e) {}
        }

        function hangup(sig) {
            if(sig && dataConn) dataConn.send('BYE');
            terminateCall("You hung up");
        }

        // --- 7. UTILS ---
        function press(k) { if(navigator.vibrate) navigator.vibrate(15); const d = document.getElementById('dial-display'); if(d.innerText.length < 4) d.innerText += k; }
        function backspace() { const d = document.getElementById('dial-display'); d.innerText = d.innerText.slice(0, -1); }
        function switchView(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function initVisualizer(stream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            audioCtx.createMediaStreamSource(stream).connect(analyser);
            const draw = () => {
                if(!analyser) return;
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                let sum = data.reduce((a,b)=>a+b,0);
                document.getElementById('mic-bar').style.width = Math.min(100, (sum/data.length)*2.5) + "%";
                requestAnimationFrame(draw);
            };
            draw();
        }
        function copyLink() { navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?dial=${myNum}`); alert("Invite Link Copied!"); }
    </script>
</body>
</html>
